      draw,
      step(s, id){ st.fly = null; st.hl.fill(0); st.lay.fill(1); st.names = s.names || null; st.who = s.who || WHO;

    };
  }
};

    const st = {a: 2, rec: 3, rin: [1, 1, 1], gd: 0, con: {a: [], b: [], c: [], f: []}, pass: 0, ux: HOME, ph: 0, arm: 0,
                bub: null, slips: [], cur: -1, hot: {}, trash: 0, cards: false};
    const V = () => { const a = st.a, b = -3, c = 10, f = -2, e = a * b, d = e + c; return {a, b, c, f, e, d, L: d * f}; };
    const G = v => { const g = {L: 1}; g.d = v.f; g.f = v.d; g.e = g.d; g.c = g.d; g.a = g.e * v.b; g.b = g.e * v.a; return g; };
    const fmtCon = n => { const L = st.con[n]; if (!L.length) return "0"; if (L.length === 1) return f2(L[0]);
      const sm = L.reduce((p, x) => p + x, 0), term = x => Math.round(x * 100) < 0 ? " − " + f2(-x) : " + " + f2(x);
      return (L.length <= 3 ? f2(L[0]) + L.slice(1).map(term).join("") : "…" + term(L[L.length - 1])) + " = " + f2(sm); };

    function draw(fromSlider){
      E.view(180);
      const v = V(), g = G(v);
      // чеки
      for (let i = 0; i < 3; i++){ const [n, u, w, op] = REC[i], o = i < st.rec ? st.rin[i] : 0, el = q("r" + i);
        el.style.opacity = o.toFixed(2); sa(el, {transform: `translate(0 ${((1 - o) * -6).toFixed(1)})`});
        tx("rf" + i, `${n} = ${u} ${op} ${w}`);
        fit("rc" + i, `${f2(v[u])} ${op} ${pn(v[w])} = ${f2(v[n])}`, 66, 8.5);
        tx("ro" + i, `из ${u} и ${w}`);
        const kn = 2 - i < st.gd; tx("rg" + i, kn ? f2(g[n]) : "?"); q("rg" + i).style.fill = kn ? "var(--accent)" : "var(--muted)";
        const hot = i === st.cur; sa("rp" + i, {style: `fill:var(--card);stroke:var(${hot ? "--accent" : "--line"})`, "stroke-width": hot ? 1.8 : 1}); }
      // карточки ручек
      KN.forEach((n, i) => { tx("kv" + i, `${n} = ${f2(v[n])}`); fit("kg" + i, fmtCon(n), 64, 9);
        const on = (st.hot[n] || 0) > 0.05 || st.cards;
        sa("kr" + i, {style: `fill:var(--card);stroke:var(${on ? "--accent" : "--line"})`, "stroke-width": on ? 1.8 : 1}); });
      // бухгалтер: ноги шагают, правая рука с ручкой тянется к чеку
      const sw = 5.5 * Math.sin(st.ph), r = st.arm;
      sa("man", {transform: `translate(${st.ux.toFixed(1)} 236)`});
      sa("l0", {d: `M-5 -26L${(-6 + sw).toFixed(1)} 0`}); sa("l1", {d: `M5 -26L${(6 - sw).toFixed(1)} 0`});
      const ex = 18.5 + 3.5 * r, ey = -40 - 27 * r, hx = 18 - 2 * r, hy = -29 - 57 * r;
      sa("ar", {d: `M13 -52L${P(ex, ey)}L${P(hx, hy)}`}); sa("hr", {cx: hx.toFixed(1), cy: hy.toFixed(1)});
      sa("pen", {d: `M${P(hx, hy)}l-2.5 -10.5`, opacity: r > 0.3 ? 1 : 0});
      // облачко со строкой кода — справа от бухгалтера, если влезает, иначе слева
      if (st.bub){ const [l1, l2] = st.bub, w = Math.max(l1.length, l2.length) * 4.8 + 12, right = st.ux + 30 + w <= 356, x0 = right ? st.ux + 30 : st.ux - 30 - w;
        sa("bub", {opacity: 1}); sa("bb", {x: x0.toFixed(1), width: w.toFixed(1)});
        const bx = right ? x0 + 1 : x0 + w - 1;
        sa("bt", {d: `M${P(bx, 163)}L${P(st.ux + (right ? 14 : -14), 168)}L${P(bx, 174)}Z`});
        sa("b1", {x: (x0 + 6).toFixed(1)}); sa("b2", {x: (x0 + 6).toFixed(1)}); tx("b1", l1); tx("b2", l2);
      } else sa("bub", {opacity: 0});
      // листки
      for (let j = 0; j < 4; j++){ const s = st.slips[j], el = q("s" + j);
        if (!s){ el.setAttribute("opacity", 0); continue; }
        const w = s.t.length * 4.5 + 8; sa("sr" + j, {x: (-w / 2).toFixed(1), width: w.toFixed(1)}); tx("st" + j, s.t);
        sa(el, {transform: `translate(${P(s.x, s.y)})`, opacity: s.o.toFixed(2)}); }
      for (let j = 0; j < 8; j++) q("t" + j).setAttribute("opacity", j < st.trash ? 0.8 : 0);
      // плашки
      E.val(0, st.rec >= 3 ? f2(v.L) : "?"); E.val(1, fmtCon("a")); E.val(2, fmtCon("b")); E.val(3, String(st.pass));
      if (!fromSlider) E.setCtrl("a", st.a);
    }

    function anim(ms, id, fn){
      return new Promise(res => {
        if (!E.live(id)) return res();
        const t0 = performance.now();
        const fr = now => {
          if (!E.live(id)) return res();
          const p = Math.min((now - t0) / ms, 1); fn(p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2, p); draw();
          if (p < 1) requestAnimationFrame(fr); else res();
        };
        requestAnimationFrame(fr);
      });
    }
    async function walkTo(x, id){
      const x0 = st.ux, d = Math.abs(x - x0); if (d < 0.5) return;
      await anim(Math.max(260, d * 4.2), id, e => { st.ux = x0 + (x - x0) * e; st.ph = Math.abs(st.ux - x0) * 0.21; });
      if (E.live(id)){ st.ux = x; st.ph = 0; draw(); }
    }
    const raise = (to, id, ms = 280) => { const r0 = st.arm; return Math.abs(to - r0) < 0.01 ? Promise.resolve() : anim(ms, id, e => { st.arm = r0 + (to - r0) * e; }); };
    async function fly(from, to, id, ms){   // листки по дуге: from — точка, to — [{x, y, t}]
      st.slips = to.map(d => ({t: d.t, x: from[0], y: from[1], o: 1}));
      await anim(ms, id, (e, p) => st.slips.forEach((s, j) => { const T = to[j], F = T.from || from;
        s.x = F[0] + (T.x - F[0]) * e; s.y = F[1] + (T.y - F[1]) * e - Math.sin(e * Math.PI) * (T.lift ?? 24); s.o = p > 0.86 ? (1 - p) / 0.14 : 1; }));
      st.slips = [];
    }
    const recPt = i => ({x: RX[i], y: 114}), cardPt = n => ({x: 313, y: CY[KN.indexOf(n)] + 19});
    const fresh = () => { st.rec = 3; st.rin = [1, 1, 1]; st.gd = 0; };
    function bwI(){ const g = G(V()); fresh(); st.gd = 3; KN.forEach(n => st.con[n].push(g[n])); st.pass++; }
    function clean(){ st.con = {a: [], b: [], c: [], f: []}; st.pass = 0; bwI(); }

    async function print(id){   // прогноз: чеки прикалываются слева направо, каждый помнит, из чего он
      const v = V(); st.rec = 0; st.gd = 0; st.rin = [0, 0, 0]; st.cur = -1; draw();
      for (let i = 0; i < 3; i++){ const [n, u, w, op] = REC[i];
        await walkTo(RX[i], id); if (!E.live(id)) return;
        st.bub = [`${n} = ${u} ${op} ${w} = ${f2(v[n])}`, `помнит: ${u}, ${w} и «${op}»`]; st.rec = i + 1;
        await anim(420, id, e => { st.arm = e; st.rin[i] = e; }); if (!E.live(id)) return;
        await E.wait(450); await raise(0, id, 220); if (!E.live(id)) return; }
      st.bub = null; await walkTo(HOME, id);
    }
    async function backward(id, k){
      const g = G(V());
      if (st.rec < 3) fresh();
      else if (st.gd > 0){   // новый шаг — новые чеки, их .grad с нуля; карточки ручек никто не стирал
        st.bub = ["новый шаг: новые чеки", st.pass ? "старые .grad остались!" : "карточки чистые"];
        await anim(520 * k, id, (e, p) => { const o = Math.abs(1 - 2 * p); st.rin = [o, o, o]; if (p >= 0.5) st.gd = 0; });
        if (!E.live(id)) return; fresh(); draw(); await E.wait(800 * k); }
      if (!E.live(id)) return;
      st.bub = ["L.backward()", "L.grad = 1 — старт"];
      await walkTo(RX[2], id); if (!E.live(id)) return;
      st.cur = 2; await raise(1, id); if (!E.live(id)) return;
      st.gd = 1; draw(); await E.wait(550 * k);
      const plan = [[2, [{r: 1, t: g.d}, {n: "f", t: g.f}]], [1, [{r: 0, t: g.e}, {n: "c", t: g.c}]], [0, [{n: "a", t: g.a}, {n: "b", t: g.b}]]];
      for (const [i, to] of plan){
        if (!E.live(id)) return;
        if (i !== 2){ await raise(0, id); if (!E.live(id)) return; await walkTo(RX[i], id); if (!E.live(id)) return; st.cur = i; await raise(1, id); if (!E.live(id)) return; }
        st.bub = BW[2 - i]; draw(); await E.wait(380 * k); if (!E.live(id)) return;
        await fly([RX[i], 110], to.map(d => Object.assign(d.r != null ? recPt(d.r) : cardPt(d.n), {t: "+= " + f2(d.t)})), id, 650 * k);
        if (!E.live(id)) return;
        for (const d of to){ if (d.r != null) st.gd = Math.max(st.gd, 3 - d.r); else { st.con[d.n].push(d.t); st.hot[d.n] = 1; } }
        draw(); await anim(420 * k, id, e => { for (const n in st.hot) st.hot[n] = 1 - e; }); st.hot = {};
        if (!E.live(id)) return; await E.wait(200 * k);
      }
      st.pass++; st.cur = -1; draw();
      await raise(0, id); if (!E.live(id)) return; await E.wait(500 * k); if (!E.live(id)) return;
      st.bub = null; await walkTo(HOME, id);
    }
    async function zero(id){   // zero_grad(): .grad с карточек — в корзину
      const ks = KN.filter(n => st.con[n].length);
      st.cur = -1; st.bub = ["optimizer.zero_grad()", ks.length ? "все .grad ручек = 0" : "и так по нулям"];
      await walkTo(RACK, id); if (!E.live(id)) return;
      await raise(1, id); if (!E.live(id)) return;
      if (ks.length){ const to = ks.map(n => ({x: 305, y: 211, lift: 8, from: [313, cardPt(n).y], t: fmtCon(n).split(" = ").pop()}));
        ks.forEach(n => { st.con[n] = []; }); st.pass = 0;
        await fly([313, 100], to, id, 800); if (!E.live(id)) return;
        st.trash = Math.min(8, st.trash + ks.length); }
      st.pass = 0; draw(); await E.wait(550); if (!E.live(id)) return;
      await raise(0, id); if (!E.live(id)) return; await E.wait(350); if (!E.live(id)) return;
      st.bub = null; await walkTo(HOME, id);
    }
    function setA(a){ st.a = a; clean(); const g = G(V()); st.bub = ["b.grad = a · e.grad", `= ${f2(a)} · ${pn(g.e)} = ${f2(g.b)}`]; }
    async function run(plan, id){
      for (const p of plan){
        if (!E.live(id)) return;
        if (p === "pause") await E.wait(1300);
        else if (p === "clear"){ st.rec = 0; st.gd = 0; draw(); }
        else if (p === "print") await print(id);
        else if (p === "printI"){ fresh(); draw(); }
        else if (p === "bw") await backward(id, 1);
        else if (p === "bwS") await backward(id, 1.5);
        else if (p === "bwI"){ bwI(); draw(); }
        else if (p === "zero") await zero(id);
        else if (p.a != null){ setA(p.a); draw(); }
      }
    }
    const calm = () => { st.arm = 0; st.ph = 0; st.slips = []; st.hot = {}; st.cur = -1; st.bub = null; if (st.rec >= 3) st.rin = [1, 1, 1]; };
    return {
      draw,
      step(s, id){ calm(); st.a = 2; st.ux = HOME; st.trash = 0; st.cards = !!s.cards; st.con = {a: [], b: [], c: [], f: []}; st.pass = 0; fresh();
        draw(); return run([].concat(s.go == null ? [] : s.go), id); },
      slide(v){ calm(); st.cards = false; setA(+v); draw(true); },
      action(a, id){ calm(); st.cards = false; draw(); run([a], id); }
    };
  }
};

/* ================= Урок ================= */
// peek — просмотр по скрытой ссылке #theory-N: только теория любого урока, без вкладки «Задачи», прогресс не меняется
function renderLesson(id, peek){
  const L = LESSONS[id-1];
  if (!peek && !lessonUnlocked(L)) { go("#home"); return; }
  if (LV.id !== id) LV = {id, view:null, ti:null};
  LV.peek = !!peek;
  if (!LV.view) LV.view = "theory";
  if (peek) LV.view = "theory";
  if (LV.ti == null){ const k = L.tasks.findIndex(t => !S.solved[t.id]); LV.ti = k < 0 ? L.tasks.length : k; }
  const st = STAGES[L.stage-1];
  app.innerHTML = `
  <div class="topbar"><button class="back" id="bk">${peek ? "← На главную" : "← Карта"}</button>${peek ? `<span class="pill cur">Просмотр теории</span>` : xpBar()}</div>
  <div class="lhead"><span class="glyph big${glyphCls(L.g)}">${esc(L.g)}</span><div><small>Этап ${st.n} · ${esc(st.name)} · урок ${id} из 24</small><h1>${esc(L.title)}</h1></div></div>
  ${peek ? "" : `<nav class="seg2" role="tablist"><button data-v="theory" role="tab">Теория</button><button data-v="tasks" role="tab">Задачи <span class="mono" id="tc">${solvedCount(L)}/${L.tasks.length}</span></button></nav>`}
  <section id="pane"></section>`;
  $("#bk").onclick = () => go("#home");
  $$(".seg2 button").forEach(b => b.onclick = () => { LV.view = b.dataset.v; showView(L); });
  showView(L);
}
function showView(L){
  stopAll(); exitFS();
  $$(".seg2 button").forEach(b => { b.classList.toggle("on", b.dataset.v === LV.view); b.setAttribute("aria-selected", b.dataset.v === LV.view); });
  const pane = $("#pane");
  if (LV.view === "theory") renderTheory(L, pane); else renderTasks(L, pane);
}
function symTable(L){ return `<div class="symtab">${L.sym.map(([s,m,e]) => `<div class="sr"><span class="sy">${esc(s)}</span><span class="sm">${esc(m)}</span><span class="se">${esc(e)}</span></div>`).join("")}</div>`; }
const shortName = L => L.title.split(" — ")[1] || L.title;
function pathChip(L, on){ return `<span class="pi${on?" on":""}"><span class="glyph xs${glyphCls(L.g)}">${esc(L.g)}</span>${esc(shortName(L))}</span>`; }
function renderTheory(L, pane){
  const prev = LESSONS[L.id-2], next = LESSONS[L.id];
  pane.innerHTML = `<div class="need"><span class="nl">Зачем этот урок</span><p>${esc(L.need)}</p>
      <div class="path" aria-label="Путь курса">${prev ? pathChip(prev) + "→" : ""}${pathChip(L, true)}${next ? "→" + pathChip(next) : ""}</div></div>
    ${L.stand ? `<div id="standHost"></div>` : `<div class="intro">${L.intro.map(p => `<p>${p}</p>`).join("")}</div>`}
    <h3 class="blk">Что значат буквы</h3>${symTable(L)}
    <h3 class="blk">Разбор примера: ${esc(L.ex.t)}</h3>
    <ol class="steps">${L.ex.s.map(([f,e]) => `<li><code>${esc(f)}</code><p>${esc(e)}</p></li>`).join("")}</ol>
    <div class="analog"><b>Аналогия</b>${esc(L.analog)}</div>

    ${LV.peek ? "" : `<div class="next"><button class="btn" id="tt">К задачам →</button></div>`}`;
  if (L.stand){ renderStand(L, $("#standHost"), {step: LV.sstep || 0}); LV.sstep = 0; }
  if ($("#tt")) $("#tt").onclick = () => { LV.view = "tasks"; showView(L); window.scrollTo(0,0); };

function renderTasks(L, pane){
  const all = lessonDone(L);
  if (LV.ti >= L.tasks.length && !all){ LV.ti = L.tasks.findIndex(t => !S.solved[t.id]); }
  const dots = () => `<div class="tdots">${L.tasks.map((t,k) => {
      const s = S.solved[t.id] ? "done" : "", open = taskOpen(L,k);
      return `<button class="${s}${k===LV.ti?" cur":""}" data-k="${k}" ${open?"":"disabled"} aria-label="Задача ${k+1}">${S.solved[t.id]?"✓":k+1}</button>`;
    }).join("")}${all ? `<button class="fin${LV.ti>=L.tasks.length?" cur":""}" data-k="${L.tasks.length}" aria-label="Итог">★</button>` : ""}</div>`;
  pane.innerHTML = dots() + `<section class="task" id="task"></section>`;
  const bindDots = () => $$(".tdots button", pane).forEach(b => b.onclick = () => { LV.ti = +b.dataset.k; renderTasks(L, pane); });
  bindDots();
  const card = $("#task");
  if (LV.ti >= L.tasks.length){ lessonComplete(L, card); return; }
  const t = L.tasks[LV.ti];
  mountTask(card, t, {mode:"lesson", L, k:LV.ti, onSolved: () => {
      $("#tc").textContent = solvedCount(L) + "/" + L.tasks.length;
      $(".topbar .xp").outerHTML = xpBar();
      const d = $(".tdots", pane); d.outerHTML = dots(); bindDots();
    },
    onNext: () => {
      const k = L.tasks.findIndex((x,i) => i > LV.ti && !S.solved[x.id]);
      const k0 = L.tasks.findIndex(x => !S.solved[x.id]);
      LV.ti = k >= 0 ? k : k0 >= 0 ? k0 : L.tasks.length;
      renderTasks(L, pane); $(".seg2").scrollIntoView({block:"start"});
    }});
}
function lessonComplete(L, card){
  const next = LESSONS[L.id], newStage = next && next.stage !== L.stage;
  card.innerHTML = `<div class="result"><span class="glyph huge${glyphCls(L.g)}">${esc(L.g)}</span>
    <h2>Урок «${esc(L.title)}» пройден</h2>
    <p>Все задачи решены. Вопросы урока будут возвращаться в повторение: через 1, 3, 7, 16 и 35 дней.</p>
    ${next ? `<div class="unl">${newStage ? `<small>Открыт этап ${next.stage} «${esc(STAGES[next.stage-1].name)}»</small>` : `<small>Открыт следующий урок</small>`}<span class="glyph${glyphCls(next.g)}">${esc(next.g)}</span><b>${esc(next.title)}</b></div>` : `<p><b>Это был последний урок. Курс пройден!</b></p>`}

}

// t.see — шаг стенда своего урока, к которому отсылает задача (кнопка «Стенд» в окне задачи; только в уроках со стендом):
// номер шага или {step, s?, area?}: s — с какого предложения шага подпись, area:[x, y, ширина, высота] — кадр части сцены
function seePanel(pnl, L, t){
  const s = typeof t.see === "number" ? {step: t.see} : t.see, k = s.step - 1;
  pnl.innerHTML = `<div class="tsee"></div>`;
  // «Теория ↗»: вкладка «Теория», стенд на том же шаге сразу на экране
  renderStand(L, $(".tsee", pnl), {step: k, from: s.s, area: s.area, mini: true, onTheory: i => {
    exitFS(); LV.view = "theory"; LV.sstep = i; showView(L); $("#standHost").scrollIntoView({block: "start"}); }});
}
let taskTok = 0, fsCard = null;
function exitFS(){ if (fsCard){ fsCard.classList.remove("fs"); fsCard = null; } document.documentElement.classList.remove("noscroll"); }
function whyHTML(t){
  let h = t.why ? `<p>${esc(t.why)}</p>` : "";
  if (t.steps && t.steps.length) h += `<div class="wl">Разбор по шагам</div><ol class="wsteps">${t.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
  if (t.idea) h += `<p class="widea"><span>Смысл.</span> ${esc(t.idea)}</p>`;
  return h;
}
function solText(t){
  if (t.t === "mc") return t.o[t.a];
  if (t.t === "tf") return t.a ? "Верно" : "Неверно";
  if (t.t === "num") return fmt(t.a, 3);
  if (t.t === "order") return t.items.join(" → ");
  if (t.t === "match") return t.pairs.map(([a,b]) => a + " — " + b).join("; ");
  if (t.t === "fill") return t.blanks.join(", ");
  return t.sol || "";
}
function mountTask(card, t, ctx){
  const L = LESSONS[t.lesson-1];
  const st = TS[t.id] || (TS[t.id] = {});
  const wasSolved = ctx.mode === "lesson" && !!S.solved[t.id];
  let attempts = 0, done = false, checker = null, panel = null;
  const label = ctx.mode === "review" ? `Урок ${L.id} · ${esc(L.title)}` : `Задача ${ctx.k+1}/${L.tasks.length} · ${KIND[t.t]}`;
  card.innerHTML = `<div class="thead"><span class="tlabel">${label}${wasSolved ? ` <span class="pill ok">решено</span>` : ""}</span>
      <div class="tools"><button data-tool="hint">Подсказка</button><button data-tool="sym">Буквы</button>${t.see && L.stand ? `<button data-tool="see">Стенд</button>` : ""}<button data-tool="fs" aria-label="Во весь экран">⤢</button></div></div>
    <div class="tq">${esc(t.q)}</div><div class="tpanel" hidden></div>
    <div class="tbody"></div><div class="tfb" aria-live="polite"></div><div class="tact"></div>`;
  const body = $(".tbody", card), fb = $(".tfb", card), act = $(".tact", card), pnl = $(".tpanel", card);

/* ================= Python в браузере ================= */
const PY = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
let pyPromise = null;
function getPy(){
  if (!pyPromise){
    pyPromise = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = PY + "pyodide.js";
      s.onload = () => loadPyodide({indexURL: PY}).then(async py => { await py.loadPackage("numpy"); res(py); }).catch(rej);
      s.onerror = () => rej(new Error("load"));
      document.head.appendChild(s);
    }).catch(e => { pyPromise = null; throw e; });
  }
  return pyPromise;
}
async function runPy(code){
  let py;
  try { py = await getPy(); } catch(e){ return {loaded:false, out:""}; }
  const lines = [];
  py.setStdout({batched: s => lines.push(s)}); py.setStderr({batched: s => lines.push(s)});
  const g = py.globals.get("dict")();
  try { await py.runPythonAsync(code, {globals: g}); }
  catch(e){ const msg = String(e.message || e).trim().split("\n").filter(Boolean); lines.push("Ошибка: " + msg[msg.length-1]); }
  finally { g.destroy && g.destroy(); }
  return {loaded:true, out: lines.join("\n")};
}

function drawLoss(cv, hist, linear){
  const {ctx, w:W, h:H} = canvas(cv, 100);
  const p = {l:44, r:10, t:10, b:18}, muted = cssv("--muted"), line = cssv("--line"), acc = cssv("--accent");
  ctx.font = "11px " + cssv("--f-mono"); ctx.fillStyle = muted; ctx.textAlign = "left";
  const vals = hist.filter(v => isFinite(v) && v > 0);
  if (vals.length < 2){ ctx.fillText("здесь появится график ошибки", p.l, H/2); return; }
  const f = linear ? (v => v) : (v => Math.log10(Math.min(v, 1e9)));
  let lo = Math.min(...vals.map(f)), hi = Math.max(...vals.map(f)); if (hi - lo < 1e-6) hi = lo + 1;
  const sx = i => p.l + i/(hist.length-1)*(W-p.l-p.r), sy = v => H-p.b - (f(v)-lo)/(hi-lo)*(H-p.t-p.b);
  ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(p.l, H-p.b); ctx.lineTo(W-p.r, H-p.b); ctx.stroke();
  ctx.textAlign = "right";
  const lab = v => linear ? fmt(v,2) : (v >= 1e6 ? fmt(v/1e6,0)+" млн" : v >= 1e3 ? fmt(v/1e3,0)+" тыс" : fmt(v, v<10?1:0));
  ctx.fillText(lab(linear ? hi : Math.pow(10,hi)), p.l-6, p.t+8); ctx.fillText(lab(linear ? lo : Math.pow(10,lo)), p.l-6, H-p.b);
  ctx.textAlign = "center"; ctx.fillText("ошибка по шагам", (p.l+W-p.r)/2, H-3);
  const path = () => { ctx.beginPath(); let first = true; hist.forEach((v,i) => { if (!isFinite(v) || v <= 0) return; const x = sx(i), y = Math.max(p.t, sy(v)); if (first){ ctx.moveTo(x,y); first = false; } else ctx.lineTo(x,y); }); };
  path(); ctx.lineTo(sx(hist.length-1), H-p.b); ctx.lineTo(p.l, H-p.b); ctx.closePath(); ctx.globalAlpha = 0.15; ctx.fillStyle = acc; ctx.fill(); ctx.globalAlpha = 1;
  path(); ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke();

  api.check(() => t.goal === "low" ? {ok: st.top > 0.8, msg:`Сейчас у лидера ${fmt(st.top*100,0)}%. ${t.hint}`} : {ok: st.top < 0.25, msg:`Сейчас у лидера ${fmt(st.top*100,0)}%. ${t.hint}`});
},
gen(body, t, api){
  const st = api.st, B = bigram(); st.samples = st.samples || [];
  body.innerHTML = `<div class="formula">начало: <b>ма</b></div><div class="row"><button class="btn ghost" id="gn">Дописать 6 раз</button></div><div class="names" id="nm"></div><p class="legend">Зелёным — новые имена, серым — имена из обучающего списка.</p>`;
  const show = () => $("#nm", body).innerHTML = st.samples.map(s => `<span class="nm-chip ${NAMESET.has(s)?"copy":"new"}">${esc(s)}</span>`).join("");
  $("#gn", body).onclick = () => { const out = []; for (let n=0; n<6; n++){ let s = "ма", r = B.ix["а"]; for (let k=0; k<12; k++){ const nx = B.sample(B.probs(r, 1)); if (nx === 0) break; s += B.chars[nx]; r = nx; } out.push(s); } st.samples = out; show(); };
  show();
  api.check(() => st.samples.length ? {ok: st.samples.some(s => !NAMESET.has(s) && s.length >= 4), msg:"Новых имён пока нет. Нажмите «Дописать» ещё раз."} : {ok:false, msg:"Сначала нажмите «Дописать 6 раз».", noCount:true});
},
attn(body, t, api){
  const Wd = ["Кошка","не","прыгнула","на","забор,","потому","что","она","устала"], SC = {0:4,1:0,2:1,3:0,4:2.3,5:0,6:0,7:0.3};
  let solved = false;
  const render = (bad) => {
    const sc = Wd.slice(0,8).map((_,j) => SC[j]), mx = Math.max(...sc), ex = sc.map(s => Math.exp(s-mx)), sum = ex.reduce((a,b) => a+b, 0), p = ex.map(e => e/sum);
    body.innerHTML = `<div class="words">${Wd.map((w,i) => `<button data-i="${i}" class="${i===7?"src":""}${solved&&i===0?" on":""}${bad===i?" bad":""}">${esc(w)}</button>`).join("")}</div>
      ${solved ? `<div class="bars">${Wd.map((w,j) => j > 7 ? `<div class="bar off"><span>${esc(w)}</span><div class="tr"></div><span>маска</span></div>` : `<div class="bar"><span>${esc(w)}</span><div class="tr"><div class="fl${j===0?"":" cool"}" style="width:${(p[j]*100).toFixed(1)}%"></div></div><span>${fmt(p[j]*100,0)}%</span></div>`).join("")}</div><p class="legend">Числа придуманы для наглядности, механизм — как в настоящей модели.</p>` : `<p class="legend">Слово «она» выделено: оно задаёт запрос Q.</p>`}`;
    $$(".words button", body).forEach(b => b.onclick = () => { if (solved) return; const i = +b.dataset.i;
      if (i === 0){ solved = true; render(); api.answer(true); } else render(i), api.answer(false, i === 7 ? "Это само слово «она». На кого оно смотрит?" : i > 7 ? "Это слово после «она» — оно закрыто маской." : "Не самое сильное совпадение. " + t.hint); });
  };
  render();
},
mask(body, t, api){
  const st = api.st, T = ["Кот","ест","свою","кашу"]; st.sel = st.sel || [];
  const render = (bad) => {
    body.innerHTML = `<div class="mgrid"><span></span>${T.map(w => `<span class="mh">${w}</span>`).join("")}${T.map((w,r) => `<span class="mh r">${w}</span>` + T.map((_,c) => { const k = r+","+c, on = st.sel.includes(k); return `<button class="mc${on?" on":""}${c===r?" diag":""}${bad&&bad.includes(k)?" bad":""}" data-k="${k}" aria-label="${w} смотрит на ${T[c]}">${on?"✕":""}</button>`; }).join("")).join("")}</div>
      <p class="legend">Строка — кто смотрит, столбец — на кого. ✕ — запрещено. Отмечено: ${st.sel.length}.</p>`;
    $$(".mc", body).forEach(b => b.onclick = () => { const k = b.dataset.k; st.sel = st.sel.includes(k) ? st.sel.filter(x => x !== k) : st.sel.concat(k); render(); });
  };
  render();
  api.check(() => { const need = []; for (let r=0;r<4;r++) for (let c=r+1;c<4;c++) need.push(r+","+c);
    const miss = need.filter(k => !st.sel.includes(k)), extra = st.sel.filter(k => !need.includes(k)); render(extra);
    return {ok: !miss.length && !extra.length, msg: extra.length ? `Лишние запреты (красным): токену можно смотреть на себя и назад.` : `Не хватает запретов: ${miss.length}. ${t.hint}`}; });
},
params(body, t, api){
  const st = api.st, DS2 = [64,128,256,384,512,768,1024,1280,1600,2048]; if (st.L == null){ st.L = 4; st.di = 1; st.V = 100; }
  body.innerHTML = slider("nl","N — блоков",1,48,1,st.L) + slider("nd","d — ширина",0,DS2.length-1,1,st.di) + `
    <div class="seg" id="vs"><button data-v="100">словарь: буквы (~100)</button><button data-v="50257">части слов (~50 000)</button></div>
    <div class="meter"><span>Параметров</span><b id="pc"></b></div><div class="formula" id="fx"></div>
    <div class="seg" id="pr"><button data-p="4,1,100">мини-GPT</button><button data-p="12,5,50257">GPT-2 small</button><button data-p="48,8,50257">GPT-2 XL</button></div>`;
  const upd = () => { st.L = +$("#nl", body).value; st.di = +$("#nd", body).value; const d = DS2[st.di]; $("#nl-o", body).textContent = st.L; $("#nd-o", body).textContent = d;
    const blocks = 12*st.L*d*d, emb = st.V*d, n = blocks + emb; st.n = n;
    const f = v => v < 1e6 ? fmt(v/1e3,0) + " тыс." : v < 1e9 ? fmt(v/1e6, v<1e7?1:0) + " млн" : fmt(v/1e9,2) + " млрд";
    $("#pc", body).textContent = f(n); $("#pc", body).className = n >= 1e8 && n <= 1.5e8 ? "good" : "";
    $("#fx", body).textContent = `12·${st.L}·${d}² = ${f(blocks)}  +  ${fmt(st.V,0)}·${d} = ${f(emb)}`;
    $$("#vs button", body).forEach(b => b.classList.toggle("on", +b.dataset.v === st.V)); };
  $("#nl", body).oninput = upd; $("#nd", body).oninput = upd;
  $$("#vs button", body).forEach(b => b.onclick = () => { st.V = +b.dataset.v; upd(); });
  $$("#pr button", body).forEach(b => b.onclick = () => { const [l,di,v] = b.dataset.p.split(",").map(Number); $("#nl", body).value = l; $("#nd", body).value = di; st.V = v; upd(); });
  upd();
  api.check(() => st.V !== 50257 ? {ok:false, msg:"Выберите словарь из частей слов (~50 000)."} : {ok: st.n >= 1e8 && st.n <= 1.5e8, msg:`Нужно от 100 до 150 млн. ${t.hint}`});
},
train(body, t, api){
  const st = api.st, B = bigram(), chars = B.chars, ix = B.ix, V = chars.length;
  const init = K => { st.K = K; st.Wt = new Float32Array(Math.pow(V,K)*V); st.steps = 0; st.hist = []; st.samples = []; st.run = false; st.pairs = [];
    NAMES.forEach(n => { const s = ".".repeat(K) + n + "."; for (let i=K; i<s.length; i++){ let r = 0; for (let j=i-K; j<i; j++) r = r*V + ix[s[j]]; st.pairs.push([r, ix[s[i]]]); } }); st.hist.push(evalL()); };
  const soft = r => { const o = r*V, p = new Float64Array(V); let mx = -1e9; for (let j=0;j<V;j++) mx = Math.max(mx, st.Wt[o+j]); let s = 0; for (let j=0;j<V;j++){ p[j] = Math.exp(st.Wt[o+j]-mx); s += p[j]; } for (let j=0;j<V;j++) p[j] /= s; return p; };
  const evalL = () => { let L = 0; for (const [r,tt] of st.pairs) L -= Math.log(soft(r)[tt] + 1e-12); return L/st.pairs.length; };
  const stepOnce = () => { for (let b=0; b<32; b++){ const [r,tt] = st.pairs[(Math.random()*st.pairs.length)|0], p = soft(r), o = r*V; for (let j=0; j<V; j++) st.Wt[o+j] -= 0.5*(p[j] - (j===tt?1:0)); } st.steps++; };
  const gen = () => { const out = []; for (let n=0; n<8; n++){ let c = new Array(st.K).fill(0), s = ""; for (let k=0; k<14; k++){ let r = 0; for (const x of c) r = r*V + x; const nx = B.sample(soft(r)); if (nx === 0) break; s += chars[nx]; c = c.slice(1).concat(nx); } out.push(s); } return out; };
  if (!st.Wt) init(1);
  body.innerHTML = `<div class="row"><span class="legend">Контекст:</span><div class="seg" id="kk">${[1,2,3].map(k => `<button data-k="${k}">${k} ${plural(k,"буква","буквы","букв")}</button>`).join("")}</div></div>
    <div class="row"><button class="btn ghost" id="go">▶ Обучать</button><button class="btn ghost" id="rs">Сначала</button></div>
    <div class="stats"><span>шагов: <b id="ns"></b></span><span>ошибка: <b id="ls"></b></span><span>параметров: <b id="pc"></b></span></div>
    <canvas class="plot" id="lc"></canvas><div class="names" id="nm"></div><div class="status" id="ss"></div>
    <p class="legend">Зелёным — новые имена, серым — заученные из обучающего списка.</p>`;
  const tok = api.tok();
  const draw = () => { const L = st.hist[st.hist.length-1]; $("#ns", body).textContent = st.steps; $("#ls", body).textContent = fmt(L,3); $("#ls", body).className = L < 1.9 ? "good" : "";
    $("#pc", body).textContent = fmt(Math.pow(V,st.K)*V,0); drawLoss($("#lc", body), st.hist, true);
    $("#nm", body).innerHTML = st.samples.map(s => `<span class="nm-chip ${NAMESET.has(s)?"copy":"new"}">${esc(s||"—")}</span>`).join("");
    $$("#kk button", body).forEach(b => b.classList.toggle("on", +b.dataset.k === st.K));
    const ss = $("#ss", body);
    if (L < 1.9){ ss.className = "status good"; ss.textContent = "Ошибка ниже 1,9. Нажмите «Проверить»."; }
    else if (st.steps >= 1500){ ss.className = "status bad"; ss.textContent = "Обучение закончилось, а ошибка не опустилась. С одной буквой контекста модель упирается в ≈ 2,1."; }
    else { ss.className = "status"; ss.textContent = st.steps ? "" : "Нажмите «Обучать». Сначала модель выдаёт мешанину букв."; } };
  const loop = () => { if (!st.run || !api.alive(tok)) return; for (let k=0; k<10; k++) stepOnce(); if (st.steps % 30 === 0 || st.steps >= 1500) st.hist.push(evalL()); if (st.steps % 100 === 0 || st.steps >= 1500) st.samples = gen(); draw();
    if (st.steps >= 1500){ st.run = false; $("#go", body).textContent = "▶ Обучать"; return; } requestAnimationFrame(loop); };
  $$("#kk button", body).forEach(b => b.onclick = () => { init(+b.dataset.k); st.samples = gen(); $("#go", body).textContent = "▶ Обучать"; draw(); });
  $("#go", body).onclick = () => { if (st.steps >= 1500) return; st.run = !st.run; $("#go", body).textContent = st.run ? "❚❚ Пауза" : "▶ Обучать"; if (st.run) loop(); };
  $("#rs", body).onclick = () => { init(st.K); st.samples = gen(); $("#go", body).textContent = "▶ Обучать"; draw(); };
  if (!st.samples.length) st.samples = gen();
  draw(); if (st.run){ $("#go", body).textContent = "❚❚ Пауза"; loop(); }
  api.check(() => ({ok: st.hist[st.hist.length-1] < 1.9, msg:`Ошибка сейчас ${fmt(st.hist[st.hist.length-1],2)}. ${t.hint}`}));
}
};
let _bigram = null;
function bigram(){
  if (_bigram) return _bigram;
  const chars = ["."].concat([...new Set(NAMES.join(""))].sort((a,b) => a.localeCompare(b,"ru")));
  const ix = Object.fromEntries(chars.map((c,i) => [c,i])), V = chars.length;
  const C = Array.from({length:V}, () => new Float64Array(V).fill(0.05));
  NAMES.forEach(n => { const s = "."+n+"."; for (let i=0; i<s.length-1; i++) C[ix[s[i]]][ix[s[i+1]]]++; });
  const probs = (row, T) => { const p = C[row].map(c => Math.pow(c, 1/T)); const s = p.reduce((a,b) => a+b, 0); return p.map(x => x/s); };
  const sample = p => { let u = Math.random(), j = 0; for (; j<p.length-1; j++){ u -= p[j]; if (u <= 0) break; } return j; };
  return (_bigram = {chars, ix, probs, sample});
}

/* ================= Старт ================= */
function start(data){
  const old = loadLS(OLDKEY);
  S = Object.assign(defaults(), loadLS(KEY) || {xp: old && old.xp || 0}, (data && data.S) || {});
  if (data && data.LV) LV = data.LV;
  if (!location.hash) { try { history.replaceState(null, "", "#home"); } catch(e){} }
  route();
}
window.claude?.hot?.snapshot?.(() => ({S, LV}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
