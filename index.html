<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
html.noscroll,html.noscroll body{overflow:hidden}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
#app{max-width:720px;margin:0 auto;padding:16px 16px 72px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--cool)}
button,input,textarea,select,a,.node,label{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row.two > *{flex:1}
.next{display:flex;justify-content:flex-end;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;text-decoration:none;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.pill{font-size:12px;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-family:var(--f-body);font-weight:500}
.pill.ok{background:var(--good);border-color:var(--good);color:#fff}
.pill.cur{border-color:var(--accent);color:var(--accent)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:14px;color:var(--muted)}
.xp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-size:15px}
.glyph{display:inline-grid;place-items:center;flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:19px;line-height:1}
.glyph.g2{font-size:15px}.glyph.g3{font-size:12px}
.glyph.big{width:52px;height:52px;border-radius:14px;font-size:24px}
.glyph.big.g2{font-size:19px}.glyph.big.g3{font-size:15px}
.glyph.huge{width:84px;height:84px;border-radius:22px;font-size:40px}
.glyph.huge.g3{font-size:24px}

/* главная */
.hero{padding:6px 0 2px}
.hero h1{font-size:clamp(28px,8vw,44px);letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:60ch;margin:10px 0 0}
.map{margin:16px -4px 0}
.map svg{display:block;width:100%;height:auto}
.map .band{fill:var(--band);stroke:var(--line);stroke-width:1}
.map .band.cur{stroke:var(--accent);stroke-width:1.6}
.map .shead circle{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.map .shead text{font-family:var(--f-display);font-weight:700;font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.map .shead.cur circle{fill:var(--ink)} .map .shead.cur text{fill:var(--paper)}
.map .shead.done circle{fill:var(--accent);stroke:var(--accent)} .map .shead.done text{fill:#fff}
.map .sname{font-family:var(--f-display);font-weight:700;font-size:12px;fill:var(--ink);text-anchor:middle;letter-spacing:.02em}
.map .sprog{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted);text-anchor:middle}
.map .e{stroke:var(--line);stroke-width:.7;opacity:.75}
.map .e.on{stroke:var(--accent);opacity:.35}
.map .p{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;opacity:.8}
.map .p.on{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:none;opacity:1}
.map .node{cursor:pointer;outline:none}
.map .node .c{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.map .node text{font-family:var(--f-mono);font-weight:600;font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .node text.g2{font-size:12.5px}.map .node text.g3{font-size:10px}
.map .node.done .c{fill:var(--accent);stroke:var(--accent)} .map .node.done text{fill:#fff}
.map .node.cur .c{stroke:var(--accent);stroke-width:3}
.map .node.lock .c{fill:var(--paper);stroke:var(--line);stroke-dasharray:3 3}
.map .node.lock text{fill:var(--muted);opacity:.55}
.map .node.sel .c{stroke:var(--cool);stroke-width:3.2}
.map .node.done.sel .c{stroke:var(--cool)}
.map .pulse{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.85}to{transform:scale(1.7);opacity:0}}
.nodeinfo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 14px;flex-wrap:wrap}
.ni-t{flex:1 1 160px;display:flex;flex-direction:column;min-width:0;line-height:1.35}
.ni-t small{color:var(--muted);font-size:12px}
.ni-t b{font-size:15.5px}
.ni-t span{font-size:13.5px;color:var(--muted)}
.now{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.now-t{display:flex;gap:12px;align-items:center}
.now h2{font-size:21px}
.now p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.prog{height:6px;background:var(--codebg);border-radius:4px;margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog-l{font-size:13px;color:var(--muted)}
.tlist{list-style:none;padding:0;margin:12px 0 4px;display:grid;gap:6px}
.ti{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 10px}
.ti .tn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border:1.5px solid var(--line)}
.ti .tl{font-size:14px;line-height:1.35;color:var(--muted);min-width:0}
.ti .tl b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.ti.done .tn{background:var(--accent);border-color:var(--accent);color:#fff}
.ti.cur{border-color:var(--accent)} .ti.cur .tn{border-color:var(--accent);color:var(--accent)}
.ti[disabled]{opacity:.45;cursor:default}
.review-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;margin:14px 0}
.review-card .rc-l{font-size:13px;opacity:.75}
.review-card b{font-family:var(--f-display);font-size:19px}
.review-card button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap;min-height:44px}
.review-card button[disabled]{opacity:.45;cursor:default}
.srcs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.srcs summary{cursor:pointer;font-weight:600}
.srcs p{font-size:14px;color:var(--muted)}
.srow{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.srow span{color:var(--muted)}
.foot{color:var(--muted);font-size:13px;margin-top:20px}

/* урок */
.lhead{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.lhead small{color:var(--muted);font-size:12.5px;display:block;margin-bottom:2px}
.lhead h1{font-size:clamp(21px,5.6vw,28px)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg2 button{border:0;background:none;border-radius:9px;padding:10px;font-weight:600;font-size:15px}
.seg2 button.on{background:var(--ink);color:var(--paper)}
.intro p{margin:0 0 10px;max-width:65ch}
.blk{font-size:15px;margin:20px 0 8px}
.symtab{display:grid;gap:6px}
.sr{display:grid;grid-template-columns:104px 1fr;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.sy{font-family:var(--f-mono);font-weight:600;color:var(--accent);grid-row:span 2;align-self:center;overflow-wrap:anywhere}
.sm{font-size:15px}
.se{font-size:13.5px;color:var(--muted);font-family:var(--f-mono)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 42px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--cool);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.steps code{font-family:var(--f-mono);font-size:14px;background:var(--codebg);padding:2px 6px;border-radius:6px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.steps p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.analog{border-left:4px solid var(--cool);background:var(--card);padding:12px 14px;border-radius:0 12px 12px 0;margin-top:16px}
.analog b{display:block;font-size:13px;color:var(--cool);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.src{font-size:13.5px;color:var(--muted);margin-top:12px}
/* стенд — анимированное объяснение в теории */
.stand{display:flex;flex-direction:column;gap:10px;margin:0 0 4px}
.st-cap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px 14px;min-height:150px;touch-action:pan-y;overflow:hidden}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.st-n{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.st-pg{display:flex;align-items:center;gap:2px}
.st-ar,.st-bk{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent}
.st-ar.nx{background:var(--accent);border-color:var(--accent);color:#fff}
.st-bk{border-color:transparent;color:var(--muted);margin-right:2px}
.st-bk.on{color:var(--accent);background:var(--paper)}
.st-dots{display:flex;align-items:center;margin:0 3px}
.st-dots i{width:5px;height:5px;border-radius:3px;margin:0 2px;background:var(--line);transition:width .25s}
.st-dots i.on{width:14px;background:var(--accent)}
.st-tag{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cool);font-weight:600;margin-bottom:2px}
.st-tag:empty{display:none}
#stTxt{margin:0;font-size:16px;line-height:1.5}
#stTxt b{font-family:var(--f-mono);font-weight:600}
.st-ex[hidden]{display:none}
.st-ex{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.st-ex .eh{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.st-ex b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.st-ex p{margin:2px 0 0;font-size:14.5px;line-height:1.45}
@keyframes stInR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes stInL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.st-inR{animation:stInR .28s ease-out}.st-inL{animation:stInL .28s ease-out}
.st-scene{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.st-scene svg{display:block;width:100%;height:auto}
.st-scene text{font-family:var(--f-mono)}
.st-scene .lb{paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round}
.st-scene .lbb{paint-order:stroke;stroke:var(--board);stroke-width:3.5px;stroke-linejoin:round}
.st-fade{transition:opacity .5s}
.st-fs{position:absolute;right:7px;bottom:7px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;padding:0;opacity:.92}
.st-vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-v{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px 8px 13px;overflow:hidden;min-width:0}
.st-v::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.st-v .l{font-size:12px;color:var(--muted);line-height:1.3}
.st-v .l b{font-family:var(--f-mono);color:var(--c)}
.st-v .v{font-family:var(--f-mono);font-weight:600;font-size:20px;line-height:1.3;color:var(--c);font-variant-numeric:tabular-nums}
.st-v .v.tx{font-family:var(--f-body);font-size:15px;padding-top:3px}
.st-ctrl{display:grid;gap:8px}
.st-sl{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-weight:600;color:var(--c,var(--sw));min-width:0}
.st-sl input{flex:1;min-width:0;accent-color:var(--c,var(--sw));height:30px;font-size:16px;margin:0}
.st-sw{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.st-sw button{flex:1;min-width:0;border:0;background:none;border-radius:9px;padding:7px 6px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted);-webkit-tap-highlight-color:transparent}
.st-sw button.on{background:var(--c,var(--sw));color:var(--card)}
.st-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-ctrl.c2{grid-template-columns:1fr 1fr;column-gap:14px}.st-ctrl.c2 .st-acts{grid-column:1/-1}
.k-flow{stroke-dasharray:3 7;animation:kflow .55s linear infinite}@keyframes kflow{to{stroke-dashoffset:-10}}
@media (prefers-reduced-motion:reduce){.k-flow{animation:none}}
.stand.fs{position:fixed;inset:0;z-index:60;margin:0;background:var(--paper);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.stand.fs .st-scene{flex:1;min-height:0}
.stand.fs .st-scene svg{height:100%}
.stand.fs .st-vals{display:none}
.stand.fs .st-cap{min-height:0;max-height:42vh;overflow:auto}
@media (orientation:landscape){
  .stand.fs{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,34%);grid-template-rows:auto 1fr;grid-template-areas:"sc cap" "sc ctl"}
  .stand.fs .st-scene{grid-area:sc}
  .stand.fs .st-cap{grid-area:cap;max-height:none}
  .stand.fs .st-n{display:none}
  .stand.fs .st-top{justify-content:flex-end}
  .stand.fs .st-ctrl{grid-area:ctl;align-self:end}
}
.need{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.need .nl,.bigsec .nl{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-weight:600}
.need p{margin:0}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.path .pi{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;background:var(--paper)}
.path .pi.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.path .pi.on .glyph{background:var(--accent)}
.glyph.xs{width:24px;height:24px;border-radius:7px;font-size:13px}
.glyph.xs.g2{font-size:10.5px}.glyph.xs.g3{font-size:8.5px}
.path .pi:not(.on) .glyph{background:var(--muted)}
.real b{display:block;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.real{border-left:4px solid var(--accent);background:var(--card);padding:12px 14px;border-radius:0 12px 12px 0;margin-top:12px}
.biglink{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 0}
.biglink b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.biglink span span{font-size:14px;color:var(--muted)}
.biglink i{font-style:normal;font-size:20px;color:var(--accent)}
.bigsec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.bigsec h3{font-size:16.5px;margin-bottom:6px}
.bigsec p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 11px 3px 3px;font-size:13.5px;min-height:32px}
.lchip[disabled]{opacity:.5;cursor:default}
.flow{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:0}
.flow li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px dashed var(--line)}
.flow li:first-child{border-top:0}
.flow .fg{display:flex;flex-direction:column;gap:3px;min-width:40px;align-items:center}
.flow .fg .glyph{width:34px;height:34px;border-radius:9px;font-size:16px}
.flow .fg .glyph.g2{font-size:13px}.flow .fg .glyph.g3{font-size:11px}
.flow .fg .glyph.none{background:var(--muted)}
.flow p{margin:0;font-size:15px}
.mainidea{background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;margin-top:12px}
.mainidea b{color:var(--accent);display:block;font-family:var(--f-display);margin-bottom:4px}
.tdots{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tdots button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:13px}
.tdots button.done{background:var(--accent);border-color:var(--accent);color:#fff}
.tdots button.cur{box-shadow:0 0 0 2.5px var(--ink)}
.tdots button.fin{border-color:var(--accent);color:var(--accent)}
.tdots button[disabled]{opacity:.35;cursor:default}

/* окно задачи */
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.task.fs{position:fixed;inset:0;z-index:60;border-radius:0;border:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--paper)}
.task.fs > *{max-width:860px;margin-left:auto;margin-right:auto}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tlabel{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:4px;margin-left:auto}
.tools button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 9px;font-size:13px;min-height:34px}
.tools button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools [data-tool="fs"]{font-size:16px;min-width:38px}
.tq{font-weight:600;font-size:17px;line-height:1.4;margin:8px 0 10px}
.tpanel{background:var(--codebg);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-bottom:10px}
.tpanel .symtab{margin-top:8px}
.tpanel .sr{background:var(--card)}
.tpanel .stand{margin:0;gap:8px}
.stand.mini .st-ctrl,.stand.mini .st-vals,.stand.mini .st-dots,.stand.mini .st-bk,.stand.mini .st-ex{display:none}
.stand.mini .st-scene svg{max-height:280px}
.stand.mini #stTxt{font-size:15px;line-height:1.45;margin:0}
.stand.mini .st-cap{min-height:0}
.stand.mini .st-v .v{font-size:17px}
.st-th{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:9px;padding:0 9px;min-height:32px;font-size:12.5px;font-weight:600;margin-left:6px;white-space:nowrap}
.tfb:empty{display:none}
.fbx{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--codebg);font-size:15px}
.fbx b{display:block;margin-bottom:2px}
.fbx.ok{border-left:4px solid var(--good)} .fbx.ok b{color:var(--good)}
.fbx.no{border-left:4px solid var(--bad)} .fbx.no b{color:var(--bad)}
.fbx.sol{border-left:4px solid var(--cool)} .fbx.sol b{color:var(--cool)}
.fbx small{color:var(--muted)}
.fbx p{margin:2px 0 0}
.fbx .wl{margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wsteps{margin:6px 0 0;padding:0;list-style:none;counter-reset:w;display:grid;gap:7px}
.wsteps li{counter-increment:w;position:relative;padding-left:31px;font-size:15px;line-height:1.45}
.wsteps li::before{content:counter(w);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--cool);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.widea{margin:12px 0 2px !important;padding:10px 12px;background:var(--card);border-radius:9px;font-size:15px;line-height:1.45}
.widea span{font-weight:600;color:var(--accent)}
.tact{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.tact:empty{display:none}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;font-size:15.5px;min-height:48px}
.opts.two .opt{text-align:center;font-weight:600}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt[disabled]{cursor:default}
.qcode{background:var(--codebg);border-radius:8px;padding:10px;font-family:var(--f-mono);font-size:14px;overflow-x:auto;margin:0 0 10px}
.numbox{display:flex;align-items:center;font-family:var(--f-mono);font-size:26px;border:1.5px solid var(--ink);border-radius:12px;padding:6px 14px;min-height:54px;background:var(--paper);max-width:360px}
.numbox .ph{color:var(--muted);font-size:16px;font-family:var(--f-body)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;max-width:360px}
.keypad button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:19px}
.keypad button:active{background:var(--codebg)}
.keypad .wide{grid-column:span 2}
.ord-ans{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:o}
.ord-ans li{counter-increment:o;border:1.5px dashed var(--line);border-radius:10px;padding:9px 12px 9px 40px;position:relative;min-height:42px;font-size:15px}
.ord-ans li::before{content:counter(o);position:absolute;left:14px;top:9px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.ord-ans li.f{border-style:solid;border-color:var(--ink)}
.ord-ans li.right{border-style:solid;border-color:var(--good)}
.ord-ans li.wrong{border-style:solid;border-color:var(--bad)}
.ord-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1.5px solid var(--ink);background:var(--paper);border-radius:9px;padding:9px 12px;font-size:15px;text-align:left;min-height:42px}
.chip[disabled]{opacity:.22;cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:grid;gap:6px;align-content:start}
.mbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;text-align:left;min-height:48px;font-size:15px}
.mbtn.sel{border-color:var(--cool);box-shadow:0 0 0 2px color-mix(in srgb,var(--cool) 35%,transparent)}
.mbtn.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card));opacity:.75}
.mbtn.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fillcode{font-family:var(--f-mono);font-size:15px;background:var(--codebg);border-radius:10px;padding:12px;white-space:pre-wrap;line-height:2.2;overflow-x:auto;overflow-wrap:anywhere}
.blank{font-family:var(--f-mono);font-size:15px;border:1.5px dashed var(--accent);border-radius:6px;padding:2px 8px;background:var(--card);color:var(--ink);min-height:30px}
.blank.sel{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.blank.filled{border-style:solid;border-color:var(--ink)}
.blank.bad{border-color:var(--bad);color:var(--bad)}
.plot{width:100%;display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.plot.sq{margin:10px auto 0}
.formula{font-family:var(--f-mono);font-size:14.5px;margin:10px 0;background:var(--codebg);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--accent)} .formula b.fixed{color:var(--muted)}
.slider{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.slider input{width:100%;accent-color:var(--accent);height:28px}
.slider output{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.meter{display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.meter b{font-family:var(--f-mono);font-size:21px;font-variant-numeric:tabular-nums}
.good{color:var(--good)!important}
.status{min-height:22px;margin:8px 0;font-weight:500;font-size:15px}
.status.good{color:var(--good)} .status.bad{color:var(--bad)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13.5px;color:var(--muted);margin:8px 0}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.pos{color:var(--bad)} .neg{color:var(--cool)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 11px;font-family:var(--f-mono);font-size:14px;min-height:38px}
.seg button.on{background:var(--cool);border-color:var(--cool);color:#fff}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px}
.tbl tr.okr td{color:var(--good)}
.graph svg{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.gnode rect{fill:var(--card);stroke:var(--ink);stroke-width:1.3}
.gnode.lit rect{stroke:var(--accent);stroke-width:2.6}
.gnode .nm{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.gnode .vl{font-family:var(--f-mono);font-size:13px;font-weight:600;fill:var(--ink)}
.gnode .gr{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.gnode.has .gr,.gnode.lit .gr{fill:var(--accent);font-weight:600}
.gedge{stroke:var(--line);stroke-width:1.6}
.explain{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.emap text{font-size:13px;fill:var(--ink);font-family:var(--f-body);pointer-events:none}
.emap g{cursor:pointer}
.emap circle{fill:var(--cool)}
.emap .hi circle{fill:var(--accent)} .emap .hi text{font-weight:600}
.emap .bad circle{fill:var(--bad)}
.txt{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.tokens{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0;min-height:44px}
.tok{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 7px;min-width:30px}
.tok span{font-family:var(--f-mono);font-size:15px;white-space:pre}
.tok small{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.bars{display:grid;gap:4px;margin:10px 0}
.bar{display:grid;grid-template-columns:78px 1fr 48px;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13.5px}
.bar .tr{height:16px;background:var(--codebg);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--accent);border-radius:4px}
.bar .fl.cool{background:var(--cool)}
.bar.off{opacity:.45}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.words button{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 11px;min-height:42px}
.words button.src{border-color:var(--cool);color:var(--cool);font-weight:600}
.words button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.words button.bad{border-color:var(--bad);animation:shake .35s}
.names{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.nm-chip{font-family:var(--f-mono);font-size:14px;border-radius:8px;padding:4px 9px;border:1px solid var(--line);background:var(--paper)}

xs = [10, 15, 20, 25, 30, 35]          # температура
ys = [110, 160, 215, 260, 310, 365]    # реальные продажи
w, b = 10, 20

def predict(x):
    return w * x + b

# квадрат промаха для каждого дня
errors = [(predict(x) - y) ** 2 for x, y in zip(xs, ys)]
loss = sum(errors) / len(errors)       # среднее = MSE
print("Квадраты промахов:", errors)
print("Ошибка (MSE):", loss)

<script type="text/plain" id="code-gdbug">
xs = [1, 2, 3, 4, 5]
ys = [3, 5, 7, 9, 11]      # правда: y = 2x + 1, но модель этого не знает
w, b = 0.0, 0.0            # начинаем с нулей
lr = 0.05                  # скорость обучения (длина шага)

for step in range(1001):
    # 1) прогноз и 2) градиенты ошибки по w и по b
    dw = db = 0
    for x, y in zip(xs, ys):
        err = (w * x + b) - y
        dw += 2 * err * x / len(xs)
        db += 2 * err / len(xs)
    # 3) шаг (здесь ошибка в знаках!)
    w += lr * dw
    b += lr * db
    if step % 200 == 0:
        loss = sum(((w * x + b) - y) ** 2 for x, y in zip(xs, ys)) / len(xs)
        print(f"шаг {step}: w={w:.2f}, b={b:.2f}, ошибка={loss:.4f}")

<script type="text/plain" id="code-value">
class Value:
    """Число, которое помнит, откуда оно взялось."""
    def __init__(self, data, parents=()):
        self.data = data
        self.grad = 0.0
        self._parents = parents
        self._backward = lambda: None

    def __add__(self, other):
        out = Value(self.data + other.data, (self, other))
        def _backward():               # сложение: градиент проходит как есть
            self.grad += out.grad
            other.grad += out.grad
        out._backward = _backward
        return out

    def __mul__(self, other):
        out = Value(self.data * other.data, (self, other))
        def _backward():               # умножение: × на соседа
            self.grad += other.data * out.grad
            other.grad += self.data * out.grad
        out._backward = _backward
        return out

    def backward(self):
        # выстраиваем узлы от начала к концу, потом идём назад
        order, seen = [], set()
        def build(v):
            if v not in seen:
                seen.add(v)
                for p in v._parents:
                    build(p)
                order.append(v)
        build(self)
        self.grad = 1.0
        for v in reversed(order):
            v._backward()

a, b, c, f = Value(2.0), Value(-3.0), Value(10.0), Value(-2.0)
L = (a * b + c) * f
L.backward()
print("L =", L.data)
for name, v in zip("abcf", [a, b, c, f]):
    print(f"градиент {name}: {v.grad}")
</script>
<script type="text/plain" id="code-attn">
import numpy as np
np.random.seed(1)

T, d = 4, 8                      # 4 токена, у каждого вектор из 8 чисел
x = np.random.randn(T, d)        # эмбеддинги токенов

# Три обучаемые матрицы делают из токена запрос, ключ и значение
Wq, Wk, Wv = (np.random.randn(d, d) / np.sqrt(d) for _ in range(3))
Q, K, V = x @ Wq, x @ Wk, x @ Wv

scores = Q @ K.T / np.sqrt(d)    # совпадение каждого запроса с каждым ключом

mask = np.triu(np.ones((T, T)), k=1).astype(bool)
scores[mask] = -np.inf           # запрещаем смотреть в будущее

def softmax(z):
    e = np.exp(z - z.max(axis=1, keepdims=True))
    return e / e.sum(axis=1, keepdims=True)

weights = softmax(scores)        # доли внимания, в каждой строке сумма = 1
out = weights @ V                # смесь значений
print("Доли внимания:")
print(weights.round(2))
print("Размер выхода:", out.shape)

<script type="text/plain" id="code-gpt">
import os
import torch, torch.nn as nn, torch.nn.functional as F

# ===== 1. Данные и токенизация =====
# Загрузите в Colab любой русский текст как input.txt (чем больше, тем лучше)
if os.path.exists("input.txt"):
    text = open("input.txt", encoding="utf-8").read()
else:
    text = "Мама мыла раму, а кот смотрел в окно. " * 400   # заглушка

chars = sorted(set(text))
stoi = {c: i for i, c in enumerate(chars)}
itos = {i: c for c, i in stoi.items()}
encode = lambda s: [stoi[c] for c in s]
decode = lambda ids: "".join(itos[i] for i in ids)

data = torch.tensor(encode(text))
n = int(0.9 * len(data))
train, val = data[:n], data[n:]          # 10% откладываем для проверки

# ===== 2. Ручки масштаба =====
ctx = 64          # сколько букв модель видит
d = 128           # длина векторов (ширина)
n_layers = 4      # число блоков (глубина)
n_heads = 4
batch = 32
device = "cuda" if torch.cuda.is_available() else "cpu"

def get_batch(split):
    src = train if split == "train" else val
    ix = torch.randint(len(src) - ctx - 1, (batch,))
    x = torch.stack([src[i:i + ctx] for i in ix])
    y = torch.stack([src[i + 1:i + ctx + 1] for i in ix])   # сдвиг на 1 букву
    return x.to(device), y.to(device)

# ===== 3. Модель =====
class Block(nn.Module):
    def __init__(self, d, n_heads):
        super().__init__()
        self.ln1 = nn.LayerNorm(d)
        self.attn = nn.MultiheadAttention(d, n_heads, batch_first=True)
        self.ln2 = nn.LayerNorm(d)
        self.mlp = nn.Sequential(nn.Linear(d, 4 * d), nn.GELU(), nn.Linear(4 * d, d))

    def forward(self, x):
        T = x.size(1)
        mask = torch.triu(torch.ones(T, T, dtype=torch.bool, device=x.device), 1)
        h = self.ln1(x)
        x = x + self.attn(h, h, h, attn_mask=mask)[0]
        x = x + self.mlp(self.ln2(x))
        return x

class MiniGPT(nn.Module):
    def __init__(self):
        super().__init__()
        self.tok = nn.Embedding(len(chars), d)    # токен → вектор
        self.pos = nn.Embedding(ctx, d)           # позиция → вектор
        self.blocks = nn.Sequential(*[Block(d, n_heads) for _ in range(n_layers)])
        self.ln = nn.LayerNorm(d)
        self.head = nn.Linear(d, len(chars))      # вектор → оценка каждой буквы

    def forward(self, idx, targets=None):
        T = idx.size(1)
        x = self.tok(idx) + self.pos(torch.arange(T, device=idx.device))
        logits = self.head(self.ln(self.blocks(x)))
        loss = None
        if targets is not None:
            loss = F.cross_entropy(logits.view(-1, logits.size(-1)), targets.view(-1))
        return logits, loss

    @torch.no_grad()
    def generate(self, idx, n_new, temperature=1.0):
        for _ in range(n_new):
            logits, _ = self(idx[:, -ctx:])
            probs = F.softmax(logits[:, -1] / temperature, dim=-1)
            nxt = torch.multinomial(probs, 1)
            idx = torch.cat([idx, nxt], dim=1)
        return idx

model = MiniGPT().to(device)
print(sum(p.numel() for p in model.parameters()), "параметров")

# ===== 4. Обучение: прогноз → ошибка → градиенты → шаг =====
opt = torch.optim.AdamW(model.parameters(), lr=1e-3)
for step in range(3001):
    x, y = get_batch("train")
    _, loss = model(x, y)
    opt.zero_grad()
    loss.backward()
    opt.step()
    if step % 500 == 0:
        with torch.no_grad():
            _, vloss = model(*get_batch("val"))
        print(f"шаг {step}: обучение {loss.item():.3f}, проверка {vloss.item():.3f}")

# ===== 5. Генерация =====
start = torch.tensor([encode(text[:1])], device=device)
print(decode(model.generate(start, 300)[0].tolist()))
</script>

  stand:{scene:"taxi", steps:[

    {t:"<b style=\"color:var(--sw)\">w</b> и <b style=\"color:var(--sb)\">b</b> вместе называют параметрами модели. Две ручки: <b style=\"color:var(--sw)\">w</b> поворачивает линию вокруг точки на оси, <b style=\"color:var(--sb)\">b</b> двигает её вверх-вниз. Вместе они дают линии любой наклон и любую высоту — под любой тариф.",
     go:[{b:100, w:30, km:5}, {w:50}, "pause", {w:10}, "pause", {w:30}, 180, "pause", 100],
     ex:[["Гудфеллоу и соавторы, гл. 5","Параметрами авторы называют числа, которые управляют поведением модели. Формула ŷ = w·x + b при обучении не меняется — меняются только параметры: их подбирают по примерам."]]},
    {look:true, t:"Перевод градусов: чтобы получить Фаренгейты, градусы Цельсия умножают на 1,8 и прибавляют 32. При 0 °C выходит не 0, а 32 °F — это сдвиг. А 1,8 — вес: каждый градус Цельсия добавляет 1,8 по Фаренгейту. Та же модель ŷ = w·x + b.",
     go:[{b:100, w:30}, "start", {km:8}]},
    {look:true, t:"Посмотрите на чек такси: «5 км × 30 ₽» и «посадка × 1 × 100 ₽». Посадка — такая же строка, только количество всегда 1. Поэтому сдвиг можно считать ещё одним весом — при входе, который всегда равен 1. Покрутите ползунки: <b style=\"color:var(--sb)\">b</b> двигает линию, <b style=\"color:var(--sw)\">w</b> поворачивает.",
     go:[{b:100, w:30, km:5}],
     ex:[["Гудфеллоу и соавторы, гл. 5","Авторы показывают приём: сдвиг можно не писать отдельно, а дописать ко входу ещё одно число, которое всегда равно 1. Вес при этой единице и работает как b — модель снова состоит из одних весов."]]}
  ]},
  tasks:[
    {t:"fit", see:3, q:"Наклон уже верный (w = 10). Подвиньте сдвиг b, чтобы линия легла на точки.", data:"B", ctrl:["b"], init:{w:10,b:120}, goal:40, hint:"Линия должна опуститься. При 10° продали 108, а 10·10 = 100. Чего не хватает?", why:"b ≈ 10: при 10° прогноз 10·10 + 10 = 110 — почти 108.", steps:["Наклон верный (w = 10), его не трогаем.", "Смотрим на точку: при 10° продали 108. Без сдвига модель дала бы 10 · 10 = 100.", "Не хватает примерно 8–10 порций — это и есть сдвиг b.", "С b = 10 прогноз при 10° равен 110 — почти 108. Линия легла на точки."], idea:"Сдвиг двигает всю линию вверх-вниз, не трогая наклон. Две ручки, w и b, вместе дают линии любой наклон и любую высоту.", sol:"b = 10 (подходит и 5)"},
    {t:"num", see:2, q:"Такси: ŷ = 30·x + 100, где x — километры. Сколько стоит поездка на 0 км?", a:100, hint:"Подставьте x = 0.", why:"30·0 + 100 = 100. Это и есть сдвиг b.", steps:["Подставим x = 0: 30 · 0 = 0 ₽ за километры.", "Остаётся только сдвиг: 0 + 100 = 100.", "Эти 100 ₽ — плата за посадку. Её платят, даже если никуда не поехали."], idea:"Так и понимают сдвиг b: это ответ модели, когда вход равен нулю."},
    {t:"num", see:1, q:"ŷ = 4·x + 7. Чему равен прогноз при x = 5?", a:27, hint:"Сначала w·x, потом прибавьте b.", why:"4·5 = 20, плюс 7 — получается 27.", steps:["Сначала вклад входа: w · x = 4 · 5 = 20.", "Потом прибавляем сдвиг: 20 + 7 = 27."], idea:"Это вся модель первого этапа: умножить вход на вес и прибавить сдвиг. Нейросеть повторяет это действие очень много раз."},
    {t:"match", q:"Соедините части модели ŷ = w·x + b", pairs:[["w","наклон линии"],["b","высота линии при x = 0"],["x","вход"],["ŷ","прогноз"]], why:"Две ручки (w, b), вход (x) и результат (ŷ).", steps:["w — множитель при x: чем он больше, тем круче поднимается линия.", "b — прибавка: при x = 0 линия проходит на высоте b.", "x — то, что подаём, ŷ — что получаем."], idea:"w и b — ручки, которые модель подбирает при обучении. x и ŷ — данные, их она не выбирает."},
    {t:"fit", see:{step:5, s:2}, q:"Теперь обе ручки ваши. Подберите w и b, чтобы линия легла на точки.", data:"B", ctrl:["w","b"], init:{w:4,b:150}, goal:30, hint:"Сначала наклон w (около 10), потом сдвиг b.", why:"w = 10, b ≈ 10: линия почти проходит через все точки.", steps:["Сначала наклон: продажи растут примерно на 10 порций за градус → w = 10.", "Потом высота: при 10° продали 108, а 10 · 10 = 100 → не хватает около 10 → b = 10.", "Проверка: при 30° прогноз 10 · 30 + 10 = 310 — продали ровно 310."], idea:"Подбор двух ручек «на глаз» — это обучение вручную. В уроке «↻» модель сделает то же сама.", sol:"w = 10, b = 10"},
    {t:"code", q:"Измените w и b, чтобы модель предсказала ровно 300 порций при 25°. Нажмите «Проверить».", src:"w = 10\nb = 20\nx = 25\nprint(w * x + b)\n", hint:"Например, оставьте w = 10 и подберите b. 10·25 = 250.", sol:"w = 10, b = 50 (или w = 12, b = 0)", why:"Подходит любая пара, где w·25 + b = 300.", steps:["Модель считает w * x + b. При x = 25 нужно получить 300.", "Если оставить w = 10, то 10 · 25 = 250. Не хватает 50 → b = 50.", "Можно и иначе: w = 12, b = 0 → 12 · 25 = 300. Подходит любая пара, где w · 25 + b = 300."], idea:"Один пример объясняют многие пары w и b. Поэтому модели учат на многих примерах: только одна пара подходит ко всем сразу.",
     check:{out:o => Math.abs(parseFloat(o.trim()) - 300) < 1e-9, code:c => { const w = num(c,/^\s*w\s*=\s*(-?[\d.]+)/m), b = num(c,/^\s*b\s*=\s*(-?[\d.]+)/m); return w != null && b != null && Math.abs(w*25 + b - 300) < 1e-9; }}}
  ]},

{ stage:1, g:"L", title:"L — ошибка", short:"Одно число: насколько модель промахнулась",
  need:"Модель с ручками w и b готова. Но как понять, хорошо ли она настроена? Нужно одно число, которое честно скажет «насколько плохо». Это ошибка L — компас всего обучения.",
  real:"ChatGPT учили, считая ошибку на огромном количестве текста: насколько неуверенно он угадал настоящее следующее слово. Формула там другая (кросс-энтропия, урок P), но идея та же — одно число «насколько плохо», которое надо уменьшать.",
  intro:[
    "Чтобы улучшить модель, сначала надо измерить, насколько она плоха. Для этого считают ошибку — функцию потерь (loss). Её обозначают <b>L</b>.",
    "Шаг 1 — промах: <b>ŷ − y</b>. Прогноз 270, а продали 265 — промах +5. Прогноз 250 — промах −15.",
    "Шаг 2 — квадрат промаха. Минус пропадает, а большие промахи штрафуются сильнее: промах 2 даёт штраф 4, промах 10 — уже 100.",
    "Шаг 3 — среднее по всем примерам. Это <b>MSE</b>, средняя квадратичная ошибка. Ноль — идеально. Цель обучения — сделать L как можно меньше."
  ],
  sym:[["ŷ − y","промах на одном примере","270 − 265 = 5"],["(ŷ − y)²","штраф за промах","5² = 25"],["L (MSE)","среднее всех штрафов","(25 + 9) / 2 = 17"]],
  ex:{t:"Ошибка за два дня", s:[
    ["День 1: ŷ = 270, y = 265","Промах +5, штраф 5² = 25."],
    ["День 2: ŷ = 200, y = 203","Промах −3, штраф (−3)² = 9."],
    ["L = (25 + 9) / 2 = 17","Средний штраф за два дня."],
    ["Цель: L → 0","Чем ближе L к нулю, тем точнее модель."]]},
  analog:"Дартс: каждый бросок мимо центра даёт штраф, и дальние промахи наказываются особенно сильно. Счёт игрока — средний штраф. Хороший игрок тот, у кого он меньше.",
  src:"Траск, гл. 4 (шаг «сравнить»: средняя квадратичная ошибка). Принс, гл. 2 и 5 (функция потерь, метод наименьших квадратов).",
  stand:{scene:"darts", steps:[
    {t:"Чтобы улучшить модель, сначала надо измерить, насколько она плоха. Для этого считают ошибку — функцию потерь (loss), её пишут <b style=\"color:var(--cool)\">L</b>. Сыграем в дартс: модель ŷ = 10·x + 20 бросает дротик-прогноз <b style=\"color:var(--syh)\">ŷ</b>, а центр мишени — правда <b style=\"color:var(--sy)\">y</b>. Мишеней две, по одной на день.",
     go:["clear", {w:10, b:20}, "throw"],
     ex:[["Траск, гл. 4","Обучение у автора — круг из трёх шагов: предсказать, сравнить, научиться. Ошибка — это шаг «сравнить»: одно число, которое говорит, насколько прогноз промахнулся. Без него не понять, стала модель лучше или хуже."]]},
    {t:"Шаг 1 — промах: <b style=\"color:var(--cool)\">ŷ − y</b>. В первый день прогноз 270, а пришло 265: дротик выше центра, промах +5. Во второй — 200 против 203: дротик ниже, промах −3. Знак говорит, в какую сторону ошиблись, длина пунктира — насколько.",
     go:["landed", {w:10, b:20}, "pause", "miss"]},
    {t:"Шаг 2 — квадрат промаха. Штраф — это площадь квадрата, у которого сторона равна промаху: 5² = 25 и (−3)² = 9. Минус пропадает: площадь не бывает отрицательной.",
     go:["miss", {w:10, b:20}, "sq"],
     ex:[["Траск, гл. 4","Автор возводит промах в квадрат и объясняет зачем: ошибка всегда выходит положительной, и промахи разного знака при усреднении не гасят друг друга."]]},
    {t:"Большие промахи штрафуются сильнее. Сдвинем <b style=\"color:var(--sb)\">b</b> до 25: промахи стали +10 и +2. Промах 2 даёт штраф 4, промах 10 — уже 100: от центра в 5 раз дальше, а штраф в 25 раз больше. Сравните квадраты.",
     go:["sqi", {w:10, b:20}, "pause", 25, "pause"],
     ex:[["Траск, гл. 4","Ещё одно свойство квадрата, о котором пишет автор: большие промахи он раздувает, а совсем маленькие, меньше единицы, наоборот ужимает. Поэтому модель в первую очередь тянется исправлять самые грубые ошибки."]]},
    {t:"Шаг 3 — среднее по всем примерам: <b style=\"color:var(--cool)\">L</b> = (25 + 9) / 2 = 17. Это <b>MSE</b>, средняя квадратичная ошибка — счёт модели на табло. Дней может быть хоть тысяча, <b style=\"color:var(--cool)\">L</b> всё равно одно число. Ноль — идеально: все дротики в центре.",
     go:["sqi", {w:10, b:20}, "pause", "L"],
     ex:[["Принс, гл. 2","У автора ошибка прямой — сумма квадратов промахов по всем обучающим парам; такой способ называют методом наименьших квадратов. Среднее отличается от суммы только делением на число примеров, а лучшая прямая у них одна и та же."],
         ["Принс, гл. 5","Почему именно квадраты, автор выводит отдельно: если считать, что настоящие ответы разбросаны вокруг прогноза «колоколом» — по нормальному распределению, — то самая правдоподобная модель та, у которой сумма квадратов промахов меньше всего."]]},
    {t:"Цель обучения — сделать <b style=\"color:var(--cool)\">L</b> как можно меньше, подкручивая <b style=\"color:var(--sw)\">w</b> и <b style=\"color:var(--sb)\">b</b>. Смотрите: модель пробует чуть сдвинуть ручки и оставляет только то, что уменьшает счёт. За пять поправок L падает с 17 до 9.",
     go:["L", {w:10, b:20}, "pause", "hot"]},
    {look:true, t:"Почему бы просто не сложить промахи? Поставим <b style=\"color:var(--sb)\">b</b> = 19: промахи +4 и −4, в сумме 0 — будто модель не ошиблась. А квадраты 16 + 16 честно говорят: ошибка есть, L = 16.",
     go:["L", {w:10, b:20}, "pause", 19]},
    {look:true, t:"Пицца 30 см кажется вдвое больше пиццы 15 см, а теста в ней вчетверо больше: площадь растёт как квадрат. Так и штраф: один промах на 10 обходится модели дороже, чем два по 5, — 100 против 25 + 25. Покрутите ползунки и следите за квадратами.",
     go:["L", {w:10, b:20}, "pause", 25, "pause", 20]}
  ]},
  tasks:[
    {t:"num", see:2, q:"Прогноз ŷ = 12, правда y = 9. Чему равен промах ŷ − y?", a:3, hint:"Из прогноза вычтите правду.", why:"12 − 9 = 3: модель переоценила на 3.", steps:["Промах = прогноз − правда = ŷ − y.", "12 − 9 = 3.", "Плюс значит: модель сказала больше, чем было на самом деле (переоценила)."], idea:"Промах на одном примере — первый кирпичик ошибки. Дальше промахи возводят в квадрат и усредняют."},
    {t:"num", see:3, q:"Промах равен −4. Чему равен штраф (квадрат промаха)?", a:16, hint:"Минус на минус даёт плюс.", why:"(−4)² = 16.", steps:["Квадрат — число, умноженное само на себя: (−4) · (−4).", "Минус на минус даёт плюс: 4 · 4 = 16.", "Штраф всегда положительный, даже если промах был «в минус»."], idea:"Ошибиться в меньшую сторону так же плохо, как в большую. Квадрат делает штраф одинаковым для +4 и −4."},
    {t:"num", see:5, q:"Прогнозы: 3 и 5. Правда: 1 и 5. Посчитайте MSE.", a:2, hint:"Промахи 2 и 0. Квадраты? Среднее?", why:"Промахи 2 и 0, квадраты 4 и 0, среднее (4 + 0) / 2 = 2.", steps:["Промахи: 3 − 1 = 2 и 5 − 5 = 0.", "Квадраты: 2² = 4 и 0² = 0.", "Среднее: (4 + 0) / 2 = 2."], idea:"MSE — средний штраф по всем примерам. Одно число про всю модель: чем меньше, тем лучше."},
    {t:"fit", see:6, q:"Пунктир — промахи. Подберите w и b, чтобы ошибка L стала меньше 30.", data:"B", ctrl:["w","b"], init:{w:15,b:-50}, goal:30, resid:true, showLoss:true, hint:"Следите за числом L: двигайте по одной ручке и смотрите, растёт оно или падает.", why:"При w = 10, b = 10 ошибка около 7.", steps:["Пунктир — промах в каждой точке: насколько линия мимо.", "Двигаете ручку и смотрите на L. Падает — двигайте дальше в ту же сторону; растёт — назад.", "Около w = 10, b = 10 пунктиры почти исчезают, и L падает примерно до 7."], idea:"Вы искали, куда крутить ручки, глядя на ошибку. Ровно это и делает за нас градиент — следующий урок.", sol:"w = 10, b = 10"},
    {t:"mc", see:7, q:"Почему промахи возводят в квадрат, а не просто складывают?", o:["Иначе +5 и −5 дали бы в сумме 0, будто ошибки нет","Так быстрее считать","Чтобы ошибка стала отрицательной","Квадрат нужен для красоты"], a:0, hint:"Подумайте о промахах с разными знаками.", why:"Квадрат делает каждый промах положительным, и они не гасят друг друга.", steps:["Пусть промахи +5 и −5. Простая сумма: 5 + (−5) = 0 — будто модель идеальна.", "Сумма квадратов: 25 + 25 = 50 — ошибка видна.", "Бонус: большой промах штрафуется сильнее. Промах 2 → штраф 4, промах 10 → уже 100."], idea:"Ошибка должна честно показывать, насколько модель плоха. Квадрат не даёт промахам «гасить» друг друга."},
    {t:"tf", see:5, q:"Если L = 0, модель не ошиблась ни на одном примере.", a:true, hint:"Среднее неотрицательных чисел равно нулю, только если все они нули.", why:"Все квадраты ≥ 0, поэтому их среднее равно 0, только когда каждый промах равен 0.", steps:["Каждый штраф — квадрат, поэтому он не бывает меньше нуля.", "Среднее таких чисел равно нулю, только если все они нули.", "А штраф равен нулю, только когда прогноз точно совпал с правдой."], idea:"L = 0 — идеал, которого на настоящих данных почти не бывает. Цель обучения — не ноль, а как можно меньше."},
    {t:"code", q:"Код считает MSE. Поменяйте w и b, чтобы ошибка стала меньше 20.", srcId:"code-mse", hint:"Продажи растут примерно на 10 за градус. Попробуйте w = 10 и уменьшайте b.", sol:"w, b = 10, 10 — ошибка ≈ 8,3", why:"Чем ближе линия к точкам, тем меньше средний квадрат промаха.", steps:["Код считает прогноз для каждой точки, промахи, их квадраты и среднее — MSE.", "Продажи растут примерно на 10 за градус → начните с w = 10.", "Подбирайте b: при w = 10, b = 10 ошибка около 8 — меньше 20."], idea:"Тот же расчёт, что вы делали руками, только для всех точек сразу. В настоящих моделях ошибку тоже считает код — по миллионам примеров.",
     check:{out:o => { const m = o.match(/MSE\):\s*([\d.]+)/); return !!m && parseFloat(m[1]) < 20; }, code:c => { const m = c.match(/w\s*,\s*b\s*=\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/); if (!m) return false; const w=+m[1], b=+m[2], xs=[10,15,20,25,30,35], ys=[110,160,215,260,310,365]; return xs.reduce((s,x,i)=>s+(w*x+b-ys[i])**2,0)/6 < 20; }}}
  ]},

{ stage:1, g:"∇", title:"∇ — градиент", short:"Куда двигать ручку, чтобы ошибка уменьшилась",
  need:"Ошибка L показывает, насколько модель плоха, но не говорит, что делать. Крутить ручку вверх или вниз? Ответ даёт градиент — наклон ошибки в том месте, где мы сейчас стоим.",
  real:"Градиент — сердце обучения любой нейросети. У больших моделей миллиарды ручек, и для каждой на каждом шаге считается свой градиент: в какую сторону её подвинуть, чтобы ошибка стала чуть меньше.",
  intro:[
    "Ошибка зависит от ручек. Если нарисовать, как L меняется при разных w, получится долина: где-то на дне ошибка минимальна.",
    "<b>Градиент</b> — это наклон долины в точке, где мы стоим. Его пишут ∇ («набла») или dL/dw: «как изменится L, если чуть сдвинуть w».",
    "Знак градиента — это направление. Градиент больше нуля: если увеличить w, ошибка вырастет, значит w надо уменьшать. Меньше нуля — наоборот, увеличивать. Равен нулю — мы на дне.",
    "Величина градиента — это крутизна. Чем дальше от дна, тем круче склон и тем больше градиент по модулю."
  ],
  sym:[["dL/dw","градиент: как меняется L, если чуть сдвинуть w","+4"],["знак «+»","склон идёт вверх вправо","уменьшаем w"],["знак «−»","склон идёт вверх влево","увеличиваем w"],["0","на дне долины","ошибка минимальна"]],
  ex:{t:"Ошибка L(w) = (w − 3)²", s:[
    ["w = 5","Стоим справа от дна. L = (5 − 3)² = 4."],
    ["dL/dw = 2·(w − 3) = 4","Градиент положительный: вправо — вверх по склону."],
    ["значит, w ↓","Чтобы ошибка падала, уменьшаем w — идём против градиента."],
    ["w = 3 → dL/dw = 0","На дне склон ровный, двигаться некуда."]]},
  analog:"Вы стоите на склоне в густом тумане и не видите долину. Но ногами чувствуете, куда земля уходит вниз. Градиент — это наклон под ногами: он не показывает всю карту, но говорит, куда шагнуть прямо сейчас.",
  src:"Траск, гл. 4 (градиентный спуск, «горячо-холодно»). Принс, гл. 6 (подбор параметров). 3Blue1Brown, видео про градиентный спуск.",
  stand:{scene:"valley", steps:[
    {t:"Ошибка зависит от ручек. Если нарисовать, как L меняется при разных w, получится долина: где-то на дне ошибка минимальна. Представьте, что вы стоите на её склоне в тумане. Место на склоне — ручка <b style=\"color:var(--sw)\">w</b> (метка внизу), высота — ошибка <b style=\"color:var(--cool)\">L</b> (синяя линия до дна).",
     go:6.2,
     ex:[["Принс, гл. 6","Когда у модели две ручки, как у линии w·x + b, ошибку рисуют уже не кривой, а рельефом — картой местности с горизонталями, где по одной оси w, по другой b. Обучение — это поиск самой низкой точки на такой карте."]]},
    {t:"Дна не видно, но под ногами чувствуется наклон. Это и есть <b style=\"color:var(--accent)\">градиент</b>: его пишут ∇ («набла») или dL/dw — «как изменится L, если чуть сдвинуть w». Оранжевый треугольник: шагнули на 1 вправо (w +1) — высота изменилась примерно на dL/dw. Как в разборе примера: при w = 5 наклон равен 4.",
     go:5, tan:true,
     ex:[["Траск, гл. 4","Сначала автор учит вес способом «горячо-холодно»: чуть сдвигает вес вверх, потом вниз, делает прогноз в обоих случаях и оставляет тот, где ошибка меньше. Это работает, но медленно и грубо — на каждый шаг уходят лишние прогнозы. Наклон даёт то же направление сразу, одним расчётом."]]},
    {t:"Знак — это направление. Здесь <b style=\"color:var(--accent)\">dL/dw</b> с плюсом: шаг вправо ведёт вверх, ошибка вырастет. Значит, шагаем влево — уменьшаем w.",
     go:6, tan:true, arr:true,
     ex:[["Траск, гл. 4","У автора поправка веса — это промах, умноженный на вход. Модель завысила прогноз — поправка выходит с плюсом, и вес уменьшают. Занизила — с минусом, и вес увеличивают. Знак получается сам, угадывать направление не нужно."]]},
    {t:"А здесь <b style=\"color:var(--accent)\">dL/dw</b> с минусом: шаг вправо ведёт вниз. Шагаем вправо — увеличиваем w. Правило одно на все случаи: идём против знака градиента.",
     go:0, tan:true, arr:true,
     ex:[["3Blue1Brown, видео о градиентном спуске","Правило для одной ручки показано на шарике: смотрим на наклон в точке, где он лежит. Склон уходит вниз влево — шаг влево, вниз вправо — шаг вправо. Повторяем, пока шарик не окажется в ямке."]]},
    {t:"Величина — это крутизна. Далеко от дна склон крутой: треугольник высокий, dL/dw почти 9 по модулю. Ближе ко дну почти ровно — около 1. Чем дальше от дна, тем больше градиент.",
     go:[-1.4,"pause",2.4], tan:true, arr:true,
     ex:[["3Blue1Brown, видео о градиентном спуске","Если делать шаг пропорционально наклону, у дна, где склон пологий, шаги сами становятся мельче, и шарик не проскакивает ямку. А когда ручек тысячи, величина градиента по каждой подсказывает, какую ручку подвинуть важнее всего."]]},
    {t:"Шагаем против наклона, пока он не исчезнет. Шаги сами становятся короче. На дне <b style=\"color:var(--accent)\">dL/dw</b> = 0: ни подъёма, ни спуска — ошибка <b style=\"color:var(--cool)\">L</b> минимальна.",
     go:"descend", tan:true, arr:true, fog:false,
     ex:[["Принс, гл. 6","У простой линии из прошлых уроков долина одна и дно одно. У сложных моделей рельеф бугристый: бывают ямки, которые не самые глубокие, и «сёдла» — места, где наклон тоже нулевой, хотя до настоящего дна ещё далеко. Поэтому нулевой градиент значит «здесь ровно», но не всегда «лучше не бывает»."]]},
    {look:true, t:"Утром вы настраиваете душ. Повернули кран чуть вправо — вода стала горячее, чем нужно: значит, крутить надо влево. Если от маленького поворота температура сильно скачет — до нужной ещё далеко, если почти не меняется — вы почти у цели. Знак и величина отклика — это и есть градиент.",
     go:[6.6,"pause",3.6], tan:true, arr:true},
    {look:true, t:"Почему бы не нарисовать всю долину и не найти дно глазами? Для одной ручки это, скажем, 100 замеров ошибки, для двух — 10 000, а ручек у настоящих сетей миллионы: столько замеров не сделать никогда. Градиент — один расчёт в той точке, где вы стоите. Поэтому и туман: модель всегда видит только склон под ногами. Покрутите ползунок w и проверьте сами.",
     go:7.2, tan:true, arr:true,
     ex:[["3Blue1Brown, видео о градиентном спуске","В сети, которая узнаёт рукописные цифры, около 13 тысяч ручек — значит, её «долина» в 13 тысячах измерений. Нарисовать такую нельзя, но градиент — это просто список из 13 тысяч чисел: для каждой ручки — в какую сторону и насколько её подвинуть."]]}
  ]},
  tasks:[
    {t:"slope", q:"Кривая — ошибка при разных w. Смотрите на знак градиента и спуститесь на дно (зелёная зона). Два раунда, в каждом не больше 12 шагов.", hint:"Градиент «+» — жмите «уменьшить w». Градиент «−» — «увеличить w».", why:"Вы шли против знака градиента и каждый раз приходили на дно.", steps:["Градиент «+» значит: если увеличить w, ошибка вырастет. Поэтому w уменьшаем.", "Градиент «−» значит: если увеличить w, ошибка упадёт. Поэтому w увеличиваем.", "Чем ближе ко дну, тем меньше градиент: склон становится пологим."], idea:"Вы шли вслепую, глядя только на наклон под ногами, — и всё равно нашли дно. Так и учится нейросеть: всей долины она не видит.", sol:"В первом раунде 9 раз «уменьшить w», во втором 7 раз «увеличить w»."},
    {t:"mc", see:3, q:"Градиент равен +6. Что делать с w?", o:["Уменьшить w","Увеличить w","Ничего, мы на дне","Сделать w = 6"], a:0, hint:"Плюс значит: вправо ошибка растёт.", why:"Идём против градиента: он положительный, значит w уменьшаем.", steps:["+6 значит: если увеличить w (шагнуть вправо), ошибка вырастет, и довольно быстро.", "Нам нужно, чтобы ошибка падала, — значит, идём в обратную сторону.", "w уменьшаем."], idea:"Правило одно на все случаи: шагать против знака градиента. Поэтому способ и называют градиентным спуском."},
    {t:"num", see:4, q:"L(w) = (w − 3)². Градиент: 2·(w − 3). Чему он равен при w = 1?", a:-4, hint:"2 · (1 − 3) = ?", why:"2 · (−2) = −4. Знак минус: w надо увеличивать.", steps:["Подставляем w = 1 в 2 · (w − 3).", "В скобках: 1 − 3 = −2.", "Умножаем: 2 · (−2) = −4."], idea:"Минус значит: если увеличить w, ошибка упадёт. Значит, w надо увеличивать — дно (w = 3) правее нас."},
    {t:"mc", see:6, q:"Где градиент ближе всего к нулю?", o:["На дне долины","На самом крутом месте склона","Всегда в начале обучения","Там, где ошибка самая большая"], a:0, hint:"Где склон ровный?", why:"На дне склон горизонтальный, и наклон равен нулю.", steps:["Градиент — это крутизна склона под ногами.", "На крутом склоне он большой, на ровном месте — маленький.", "На самом дне долины земля ровная: наклон равен нулю."], idea:"Нулевой градиент — сигнал «дальше идти некуда». Поэтому обучение замедляется, когда модель подходит к лучшему положению."},
    {t:"tf", see:5, q:"Для такой долины чем дальше от дна, тем больше градиент по модулю.", a:true, hint:"Посмотрите на формулу 2·(w − 3).", why:"Градиент растёт вместе с расстоянием до дна: склон всё круче.", steps:["Градиент = 2 · (w − 3), а (w − 3) — расстояние до дна.", "w = 4 → градиент 2; w = 7 → 8; w = 13 → 20.", "Чем дальше от дна, тем круче склон и тем больше градиент."], idea:"Удобное свойство: далеко от цели модель делает большие поправки, а рядом с целью — мелкие и аккуратные."}
  ]},

{ stage:1, g:"η", title:"η — скорость обучения", short:"Длина шага: не слишком мало и не слишком много",
  need:"Градиент говорит, куда шагнуть, но не говорит, насколько далеко. Длину шага выбираем сами — это скорость обучения η. От неё зависит, дойдёт ли модель до дна долины или улетит.",
  real:"Скорость обучения — одна из главных настроек при обучении больших моделей. Её делают маленькой (часто около 0,0001–0,001) и к концу обучения ещё уменьшают, чтобы не перепрыгнуть удачное место.",
  intro:[
    "Градиент говорит, куда идти. Скорость обучения <b>η</b> («эта», в коде <b>lr</b> — learning rate) говорит, какой длины сделать шаг.",
    "Правило шага: <b>w_новое = w − η · градиент</b>. Минус — потому что идём против наклона, вниз.",
    "Маленькая η — шаги крошечные, спуск займёт вечность. Слишком большая — перепрыгиваем дно и улетаем на другой склон, ошибка растёт.",
    "Хорошую η подбирают опытом: обычно пробуют 0,1, 0,01, 0,001 и смотрят, как падает ошибка."
  ],
  sym:[["η (lr)","длина шага","0,25"],["η · градиент","на сколько сдвинуть w","0,25 · 4 = 1"],["w − η·∇","новое значение w","5 − 1 = 4"]],
  ex:{t:"Шаги по долине L = (w − 3)²", s:[
    ["w = 5, градиент = 4","Склон идёт вверх вправо."],
    ["η = 0,5 → шаг = 0,5 · 4 = 2","Длина шага."],
    ["w = 5 − 2 = 3","Попали ровно на дно."],
    ["η = 1,5 → w = 5 − 6 = −1","С длинным шагом перелетели дно: теперь стоим дальше, чем были."]]},
  analog:"Спуск по лестнице в темноте. Крошечные шажки — дойдёте к утру. Прыжки через пять ступенек — пролетите площадку. Нужен шаг размером со ступеньку.",
  src:"Траск, гл. 4 (коэффициент α и расходимость, когда шаг «перелетает»). Принс, гл. 6 (скорость обучения).",
  stand:{scene:"valley", mode:"eta", steps:[
    {t:"Градиент говорит, куда идти, но не говорит, как далеко. Длину шага выбираем сами — это скорость обучения <b style=\"color:var(--good)\">η</b> («эта», в коде <b>lr</b> — learning rate). Путник стоит на w = 5, наклон под ногами <b style=\"color:var(--accent)\">∇</b> = +4: дно левее. Зелёная стрелка — будущий шаг: чем больше η, тем она длиннее.",
     go:[{w:5, eta:0.25}, "pause", {eta:0.5}, "pause", {eta:1}, "pause", {eta:0.25}], tan:true,
     ex:[["Траск, гл. 4","Самый простой способ не перестараться с поправкой, по словам автора, — умножать её на маленькое число α от 0 до 1. Так в правиле шага и появляется скорость обучения: у автора это α, у нас η, в коде lr."]]},
    {t:"Правило шага: <b style=\"color:var(--sw)\">w</b> − <b style=\"color:var(--good)\">η</b>·<b style=\"color:var(--accent)\">∇</b>. Минус — потому что идём против наклона, вниз. Сам шаг — <b style=\"color:var(--good)\">η·∇</b>: длина, умноженная на наклон. При η = 0,25: η·∇ = 0,25 · 4 = 1, новое w = 5 − 1 = 4. Там склон положе, и следующий шаг сам выходит короче: 0,25 · 2 = 0,5.",
     go:[{w:5, eta:0.25}, "pause", "jump"],
     ex:[["Принс, гл. 6","Правило шага у автора то же самое: из параметров вычитают градиент, умноженный на число α. Это число он называет размером шага, или скоростью обучения (learning rate), — два имени одной вещи."]]},
    {t:"Как в разборе примера: при η = 0,5 шаг 0,5 · 4 = 2, и w = 5 − 2 = 3 — путник одним прыжком попал ровно на дно. Это удача именно этой долины: обычно до дна идут многими шагами.",
     go:[{w:5, eta:0.5}, "pause", "jump"]},
    {t:"Маленькая <b style=\"color:var(--good)\">η</b> — шаги крошечные. При η = 0,05 первый шаг всего 0,05 · 4 = 0,2, а дальше ещё короче: склон всё положе. За 10 шагов путник так и не дошёл до дна — w ≈ 3,7. Спуск займёт вечность.",
     go:[{w:5, eta:0.05}, "run"]},
    {t:"Слишком большая <b style=\"color:var(--good)\">η</b> — перелёт. При η = 1,5 шаг 1,5 · 4 = 6: w = 5 − 6 = −1. Путник перепрыгнул дно и стоит выше, чем был: ошибка <b style=\"color:var(--cool)\">L</b> выросла с 4 до 16. Следующий прыжок ещё длиннее — за край долины: w = 11, L = 64.",
     go:[{w:5, eta:1.5}, "pause", "jump", "pause", "jump"],
     ex:[["Траск, гл. 4","Автор нарочно ломает свой спуск: берёт вход побольше, и поправка веса выходит такой большой, что вес перелетает нужное значение. На следующем шаге промах больше прошлого, поправка ещё больше — и ошибка растёт без конца. Такое поведение называют расходимостью."]]},
    {t:"Хорошую <b style=\"color:var(--good)\">η</b> подбирают пробами: делают несколько шагов и смотрят, как падает <b style=\"color:var(--cool)\">L</b>. Падает медленно — η увеличивают, скачет или растёт — уменьшают. Обычно пробуют 0,1, 0,01, 0,001. Здесь η = 0,1 ползёт, 0,9 скачет через дно, а 0,4 за три шага почти на дне.",
     go:[{w:5, eta:0.1}, "run", "pause", {w:5, eta:0.9}, "run", "pause", {w:5, eta:0.4}, "run"],
     ex:[["Траск, гл. 4","Как выбрать α? Автор признаётся, что даже в серьёзных сетях её часто подбирают на глаз — следят за ошибкой. Начала расти — α слишком большая, её уменьшают. Падает слишком медленно — маленькая, её увеличивают."]]},
    {look:true, t:"Новичок за рулём: машину чуть повело вправо — он резко выкручивает руль влево, машина уходит влево, он ещё резче вправо, и виляние только растёт. Опытный водитель подруливает понемногу и едет ровно. Резкий руль — это слишком большая <b style=\"color:var(--good)\">η</b>: каждая поправка перелетает нужное положение.",
     go:[{w:5, eta:1.1}, "run", "pause", {w:5, eta:0.3}, "run"]},
    {look:true, t:"Покрутите ползунок <b style=\"color:var(--good)\">η</b> и следите за следом прыжков. До 0,5 путник спускается, не перепрыгивая дно. От 0,5 до 1 перепрыгивает, но качается всё меньше. Больше 1 — каждый прыжок длиннее прошлого. Граница 1 — только у этой долины: у крутой она ниже, у пологой выше. Поэтому η и подбирают пробами.",
     go:[{w:5, eta:0.75}, "path"],
     ex:[["Принс, гл. 6","Одну скорость на всё обучение часто не держат. Автор описывает расписание скорости: в начале её делают большой — модель смело прыгает и находит подходящую область, — а потом по ходу обучения раз за разом уменьшают, чтобы аккуратно спуститься к дну."]]}
  ]},
  tasks:[
    {t:"num", q:"w = 5, градиент = 4, η = 0,25. Какое новое w?", a:4, hint:"w − η · градиент = 5 − 0,25 · 4.", why:"0,25 · 4 = 1, и 5 − 1 = 4.", steps:["Правило шага: новое w = w − η · градиент.", "Длина шага: η · градиент = 0,25 · 4 = 1.", "Новое w: 5 − 1 = 4. Мы шагнули влево, к дну (оно в w = 3)."], idea:"Минус в формуле — это «против градиента», а η — насколько смело мы шагаем."},
    {t:"lrrun", see:6, q:"Подберите η, чтобы за 10 шагов спуститься на дно (w ≈ 3) и не улететь.", hint:"0,01 — слишком мелко. 1,05 — уже разлёт. Ищите посередине.", why:"При η от 0,2 до 0,8 спуск укладывается в 10 шагов.", steps:["η = 0,01: шаги крошечные — за 10 шагов почти не сдвинулись.", "η больше 1: шаг перелетает дно, и каждый прыжок уносит всё дальше.", "η около 0,3–0,5: несколько уверенных шагов — и мы на дне."], idea:"Слишком медленно — плохо, слишком быстро — ещё хуже. Хорошую η подбирают пробами, как вы сейчас.", sol:"η = 0,3 или 0,5"},
    {t:"mc", see:5, q:"Ошибка с каждым шагом растёт и скачет. Что, скорее всего, не так?", o:["Скорость обучения слишком большая","Скорость обучения слишком маленькая","Данных слишком много","Модель уже идеальна"], a:0, hint:"Вспомните перелёт через дно.", why:"Длинные шаги перепрыгивают минимум, и ошибка раскачивается.", steps:["Если шаги слишком длинные, модель перепрыгивает дно и попадает на другой склон.", "Там она выше, чем была, следующий шаг ещё длиннее — ошибка раскачивается и растёт.", "Лечение: уменьшить скорость обучения."], idea:"«Ошибка растёт и скачет» — первый признак слишком большой η. Это одна из самых частых поломок при обучении."},
    {t:"fill", see:2, q:"Допишите правило шага", code:"w = w [[0]] lr [[1]] dw", blanks:["-","*"], pool:["+","/"], hint:"Идём против градиента, а длина шага — lr, умноженная на градиент.", why:"w = w − lr · dw.", steps:["Идём против градиента — значит, вычитаем: w − …", "Длина шага — скорость, умноженная на градиент: lr * dw.", "Вместе: w = w − lr * dw."], idea:"Эта строка — главное правило обучения нейросетей. Её применяют к каждой из миллионов ручек на каждом шаге."},

    {t:"gd", see:{step:6, s:3}, q:"Нажимайте «Шаг» или «Авто», пока ошибка не станет меньше 30. Ручки двигает сама модель.", hint:"Если ошибка растёт — уменьшите скорость и нажмите «Сброс».", why:"Модель сама нашла w и b, видя только ошибку.", steps:["Каждое нажатие «Шаг» — один полный круг: прогноз, ошибка, градиенты, сдвиг ручек.", "Вы не двигали w и b — модель двигала их сама, глядя на градиенты.", "Если ошибка росла, скорость была слишком большой — как в прошлом уроке."], idea:"Это и есть «машинное обучение»: человек задаёт правило и данные, а числа внутри модели подбираются сами.", sol:"Скорость 0,3 и «Авто»."},
    {t:"mc", see:6, q:"Что такое эпоха?", o:["Один проход по всем обучающим примерам","Один шаг изменения одной ручки","Время, за которое модель отвечает","Количество слоёв"], a:0, hint:"Это про данные.", why:"Эпоха — модель «прочитала» все примеры один раз.", steps:["У нас есть набор примеров, например 7 дней продаж.", "Модель прошла по всем семи — это одна эпоха.", "Обычно нужно много эпох: за один проход ошибка падает лишь немного."], idea:"Шаг — одно изменение ручек, эпоха — один «прочитанный» набор данных. Большие языковые модели учат на таком количестве текста, что они проходят его всего примерно один раз."},

  real:"Каждый нейрон в ChatGPT считает именно такую взвешенную сумму: берёт сотни или тысячи входов, умножает каждый на свой вес и складывает. Это самая частая операция во всей модели.",

  stand:{scene:"jury", steps:[

    {code:true, t:"В коде входы и веса хранят списками-векторами: <b style=\"color:var(--sx)\">x</b> = [5, 7], <b style=\"color:var(--sw)\">w</b> = [8, 3]. Взвешенную сумму считают одной командой <b>x @ w</b> — скалярное произведение: перемножить числа на одинаковых местах и сложить, 5·8 + 7·3 = 61. Хоть два входа, хоть тысяча — запись та же.",
     go:[{x1:5, x2:7, w1:8, w2:3}, "full"],

    {look:true, t:"Чек в магазине — та же взвешенная сумма. В каждой строке количество — вход, цена — вес: 2 кг яблок по 150 ₽ и 3 пакета молока по 90 ₽ — это 300 + 270 = 570 ₽. Доставка 100 ₽ — сдвиг: её платят при любой корзине. Итого 670 ₽. Строк в чеке может быть сколько угодно — Σ сложит все.",

    {look:true, t:"Вес 0 — голос не считается. Поставим члену жюри <b style=\"color:var(--sw)\">w₂</b> = 0: ставит он 1 или 10 — его полоски нет, итог не меняется. Так модель учится не замечать бесполезный вход. Покрутите ползунки: одна и та же оценка даёт длинную полоску при большом весе и короткую — при маленьком.",
