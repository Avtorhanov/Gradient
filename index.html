  tasks:[
    {t:"num", see:3, q:"ŷ = 8·x₁ + 3·x₂ + 20. Посчитайте прогноз при x₁ = 2, x₂ = 8.", a:60, hint:"8·2 + 3·8 + 20.", why:"16 + 24 + 20 = 60.", steps:["Вклад подготовки: 8 · 2 = 16.", "Вклад сна: 3 · 8 = 24.", "Складываем всё со сдвигом: 16 + 24 + 20 = 60."], idea:"Каждый вход вносит свою долю, и доли складываются. Так модель учитывает сразу много вещей."},
    {t:"num", see:{step:6, s:2}, q:"Скалярное произведение: [1, 2] · [3, 4] = 1·3 + 2·4 = ?", a:11, hint:"Перемножьте попарно и сложите.", why:"3 + 8 = 11.", steps:["Перемножаем числа на одинаковых местах: 1 · 3 = 3 и 2 · 4 = 8.", "Складываем: 3 + 8 = 11."], idea:"Скалярное произведение — та же взвешенная сумма: входы × веса и всё сложить. Видеокарты считают его невероятно быстро."},
    {t:"mc", see:8, q:"Веса модели: подготовка 8, сон 3, цвет ручки 0. Что это значит?", o:["Цвет ручки не влияет на прогноз","Цвет ручки самый важный","Сон важнее подготовки","Модель сломана"], a:0, hint:"Что даёт умножение на ноль?", why:"Вес 0 — вход не влияет.", steps:["Вклад цвета ручки = 0 · x. Какой бы ни был цвет, получится 0.", "Значит, цвет ручки вообще не меняет прогноз.", "Самый важный вход здесь — подготовка: у неё самый большой вес (8)."], idea:"По весам видно, что модель считает важным. Вес около нуля — модель научилась не обращать внимания на этот вход."},
    {t:"wfit", see:4, q:"Подберите w₁ (подготовка) и w₂ (сон), чтобы модель точно угадала баллы четырёх студентов. Сдвиг b = 20.", hint:"Студенты 1 и 4 отличаются на час подготовки и час сна (в разные стороны), а баллы — на 5. Значит, w₁ − w₂ = 5.", why:"w₁ = 8, w₂ = 3 — все четыре балла совпадают.", steps:["Сдвиг b = 20 известен, ищем только w₁ и w₂.", "Студенты 1 и 4: у первого подготовки на час больше, а сна на час меньше, и балл выше на 5. Значит, w₁ − w₂ = 5.", "Пробуем w₁ = 8, w₂ = 3. Студент 1: 8·2 + 3·8 + 20 = 60 — совпало, и с остальными тремя тоже."], idea:"С двумя ручками искать уже труднее. А у нейросетей их миллионы — вручную не подобрать, поэтому и нужен градиентный спуск.", sol:"w₁ = 8, w₂ = 3"},
    {t:"match", q:"Соедините обозначение и смысл", pairs:[["x₁, x₂","входы"],["w₁, w₂","важность каждого входа"],["Σ","сложить всё вместе"],["x @ w","взвешенная сумма в коде"]], why:"Входы × веса, всё сложить — это и есть x @ w.", steps:["x₁, x₂ — что подаём: часы подготовки и сна.", "w₁, w₂ — насколько важен каждый вход.", "Σ — «сложить всё», а x @ w — так взвешенную сумму пишут в коде."], idea:"Одна запись x @ w заменяет длинное «x₁·w₁ + x₂·w₂ + …», сколько бы входов ни было."},
    {t:"fill", see:{step:6, s:2}, q:"Допишите взвешенную сумму на numpy", code:"import numpy as np\nx = np.array([5, 7])\nw = np.array([8, 3])\nb = 20\ny_hat = [[0]] + b\nprint(y_hat)   # 81", blanks:["x @ w"], pool:["x + w","np.sum(x)","w"], hint:"Знак @ — скалярное произведение.", why:"x @ w = 8·5 + 3·7 = 61, плюс 20 = 81.", steps:["В numpy знак @ считает скалярное произведение: попарно перемножает и складывает.", "x @ w = 5 · 8 + 7 · 3 = 40 + 21 = 61.", "Плюс сдвиг b = 20 — получается 81, как в комментарии."], idea:"numpy — библиотека Python для работы с наборами чисел. На ней и на PyTorch пишут почти все нейросети."}
  ]},

{ stage:2, g:"f", title:"f — активация ReLU", short:"Изгиб, без которого сеть — просто прямая",
  need:"Взвешенная сумма — всё ещё прямая линия, сколько входов ни добавляй. А мир не прямой. Нужен «изгиб» — функция активации. Именно он превращает формулу в нейрон.",
  real:"Внутри каждого блока GPT есть слой нейронов с функцией активации (там обычно GELU — сглаженная ReLU). Без изгибов вся огромная модель схлопнулась бы в одну прямую и ничего бы не умела.",
  intro:[
    "Взвешенная сумма рисует только прямую. Но мир не прямой: кошку от собаки линией не отделишь.",
    "Решение — пропустить сумму через простую функцию-изгиб. Её называют функцией активации <b>f</b>. Самая популярная — <b>ReLU</b>: всё отрицательное превращает в 0, положительное оставляет как есть. ReLU(z) = max(0, z).",
    "Взвешенная сумма + активация = <b>нейрон</b>. Нейрон с ReLU рисует ломаную с одним изломом. Где излом, решают w и b: там, где w·x + b = 0, то есть при x = −b / w.",
    "Если сложить несколько таких ломаных, можно согнуть любую форму, как из кусочков проволоки."
  ],
  sym:[["z = w·x + b","сумма до изгиба","−3 или 2,5"],["ReLU(z)","max(0, z): минус → 0","ReLU(−3) = 0, ReLU(2,5) = 2,5"],["−b / w","где излом","w = 1, b = −2 → x = 2"]],
  ex:{t:"Нейрон с w = 1, b = −2", s:[
    ["x = 1 → z = 1 − 2 = −1","Сумма отрицательная."],
    ["ReLU(−1) = 0","Нейрон молчит."],
    ["x = 5 → z = 3 → ReLU = 3","Сумма положительная — проходит как есть."],
    ["излом в x = 2","До x = 2 нейрон выключен, после — растёт прямой."]]},
  analog:"ReLU — как кран с порогом: пока давление ниже нуля, вода не течёт; выше — течёт пропорционально давлению. Много кранов с разными порогами вместе дают поток любой формы.",
  src:"Принс, гл. 3 (неглубокие сети: ReLU, изломы, кусочно-линейные функции). Траск, гл. 9 (функции активации).",
  stand:{scene:"tap", steps:[
    {plain:true, t:"Взвешенная сумма рисует только прямую. Пунктир на доске — сумма <b style=\"color:var(--syh)\">z</b> = <b style=\"color:var(--sw)\">w</b>·<b style=\"color:var(--sx)\">x</b> + <b style=\"color:var(--sb)\">b</b>: сколько ни крути w и b, меняются наклон и высота, а изгиба нет. Но мир не прямой: кошку от собаки одной прямой не отделишь.",
     go:[{x:0, w:1, b:-2}, "pause", {w:-0.5, b:-1}, "pause", {w:1.5, b:-5}, "pause", {w:1, b:-2}],
     ex:[["Принс, гл. 3","Автор начинает главу с того же: линейная регрессия из прошлой главы описывает связь входа и выхода только прямой. Неглубокие нейросети описывают ломаные — и этого уже хватает, чтобы как угодно точно приблизить очень сложную зависимость."]]},
    {t:"Решение — пропустить сумму через функцию-изгиб <b style=\"color:var(--sf)\">f</b>, её называют функцией активации. Самая популярная — <b style=\"color:var(--sf)\">ReLU(z)</b> = max(0, z): всё отрицательное превращает в 0, положительное оставляет как есть. Как кран с пружиной: пока <b style=\"color:var(--syh)\">z</b> меньше нуля, пружина держит клапан и вода не течёт; выше нуля — течёт, и тем сильнее, чем больше z.",
     go:["one", {w:1, b:-2}, "pump"],
     ex:[["Траск, гл. 9","Автор перечисляет, какой должна быть хорошая функция активации: непрерывной — давать ответ на любой вход; монотонной — не менять направление; нелинейной — с изгибом; и быстро считаться вместе со своей производной. ReLU подходит под все четыре условия: это просто сравнение с нулём."]]},
    {t:"Разбор примера: <b style=\"color:var(--sw)\">w</b> = 1, <b style=\"color:var(--sb)\">b</b> = −2. Стрелка манометра — давление насоса w·x, розовая метка — пружина: она держит 2. Нажим <b style=\"color:var(--sx)\">x</b> = 1: <b style=\"color:var(--syh)\">z</b> = 1·1 − 2 = −1, давление пружину не пересилило, ReLU(−1) = 0 — нейрон молчит, кран сухой. Нажим x = 5: z = 3, и ReLU(3) = 3 — проходит как есть.",
     go:["one", {x:1, w:1, b:-2}, "pause", {x:5}]},
    {kink:true, t:"Взвешенная сумма + активация = <b>нейрон</b>. Он рисует ломаную с одним изломом: до излома 0, после — прямая. Излом там, где w·x + b = 0, то есть при x = <b style=\"color:var(--sb)\">−b/w</b> = 2: здесь давление насоса ровно уравновешивает пружину.",
     go:["one", {x:0, w:1, b:-2}, {x:2}, "pause", {x:4}],
     ex:[["Принс, гл. 3","Нейрон у автора бывает активным — когда его сумма больше нуля — и неактивным, когда ReLU срезает её до нуля. Там, где нейрон переключается, у графика сети появляется излом. Сеть из трёх нейронов рисует ломаную из четырёх кусков, и какой кусок где, решает, какие нейроны сейчас активны."]]},
    {t:"Где излом, решают <b style=\"color:var(--sw)\">w</b> и <b style=\"color:var(--sb)\">b</b>. Пружина туже, b = −4, — кран откроется только при x = 4. Насос вдвое сильнее, w = 2, — тот же порог берётся уже при x = 2. А при отрицательном w насос работает наоборот: чем сильнее нажим, тем ниже давление, и ломаная смотрит влево — вода течёт только при малых x.",
     go:["one", {x:5, w:1, b:-2}, "pause", {b:-4}, "pause", {w:2}, "pause", {w:-1, b:2}, "pause", {x:1}],
     ex:[["Принс, гл. 3","У автора параметры нейронов решают, где у ломаной изломы и какой наклон у каждого куска. Обучение подбирает эти параметры — а значит, и расставляет изломы."]]},
    {t:"Если сложить несколько таких ломаных, можно согнуть любую форму, как из кусочков проволоки. Второй кран на той же трубе, но пружина у него туже: b₂ = −4. Первый открывается при x = 2, второй — при x = 4. Вместе поток сначала 0, потом растёт, потом растёт вдвое быстрее — линия гнётся.",
     go:[{x:0, w:1, b:-2}, "two", "pump"],
     ex:[["Принс, гл. 3","Автор приводит теорему об универсальной аппроксимации: если нейронов достаточно, неглубокая сеть может сколь угодно точно повторить любую непрерывную функцию. Чем больше нейронов, тем больше изломов и тем ближе ломаная к нужной кривой."]]},
    {look:true, t:"Премия продавца: 10 % от продаж сверх плана в 100 тысяч. Продал на 80 тысяч — премия 0, а не минус: в долг за недобор не загоняют. Продал на 150 — премия 5 тысяч, и каждая следующая тысяча продаж добавляет 100 ₽. План — это излом, а премия — ReLU: ниже порога ноль, выше — прямая.",
     go:["one", {w:1, b:-2}, "pump"]},
    {look:true, t:"ReLU — как пол под наклонной доской: всё, что ниже нуля, ложится на пол, что выше — остаётся как было. Покрутите ползунки: <b style=\"color:var(--sb)\">b</b> двигает излом влево-вправо, <b style=\"color:var(--sw)\">w</b> меняет крутизну, а его знак решает, с какой стороны от излома течёт вода.",
     go:["one", {x:5, w:1, b:-2}]}
  ]},
  tasks:[
    {t:"num", see:{step:2, s:2}, q:"ReLU(−3) = ?", a:0, hint:"Отрицательное превращается в…", why:"max(0, −3) = 0.", steps:["ReLU(z) = max(0, z): выбираем большее из двух чисел — 0 или z.", "Из 0 и −3 больше 0.", "Значит, ReLU(−3) = 0: отрицательное превращается в ноль."], idea:"Нейрон с отрицательной суммой «молчит» — не передаёт сигнал дальше."},
    {t:"num", see:{step:2, s:2}, q:"ReLU(2,5) = ?", a:2.5, hint:"Положительное проходит без изменений.", why:"max(0; 2,5) = 2,5.", steps:["Из 0 и 2,5 больше 2,5.", "Положительное число проходит без изменений: ReLU(2,5) = 2,5."], idea:"ReLU очень проста: отрезает минус и пропускает плюс. Простота — одна из причин, почему её так любят."},
    {t:"relu", see:{step:4, area:[200, 0, 160, 176]}, q:"Подвиньте w и b так, чтобы излом нейрона оказался в точке x = 2, а линия после него шла вверх.", hint:"Излом там, где w·x + b = 0. При w = 1 нужно b = −2.", why:"Излом в x = −b/w = 2, а при w > 0 линия справа растёт.", steps:["Излом там, где сумма w·x + b равна нулю: левее нейрон молчит, правее работает.", "Нужен излом в x = 2: w · 2 + b = 0. При w = 1 получаем b = −2.", "w должен быть больше нуля — тогда справа от излома линия идёт вверх."], idea:"w и b одного нейрона решают, где у него излом и в какую сторону он смотрит. Много нейронов — много изломов, и из них складывается кривая любой формы.", sol:"w = 1, b = −2 (или w = 2, b = −4)"},
    {t:"mc", see:{step:5, area:[200, 0, 160, 176]}, q:"Нейрон: w = 2, b = −6. Где у него излом?", o:["x = 3","x = −3","x = 6","x = 12"], a:0, hint:"x = −b / w.", why:"−(−6) / 2 = 3.", steps:["Излом там, где w·x + b = 0.", "2 · x − 6 = 0 → 2 · x = 6 → x = 3.", "Короткая формула: x = −b / w = 6 / 2 = 3."], idea:"Двигая b, модель двигает излом влево-вправо. Так при обучении нейроны «расставляют» изгибы туда, где они нужны."},
    {t:"tf", see:1, q:"Если убрать активации, сеть из 10 слоёв всё равно сможет нарисовать только прямую.", a:true, hint:"Прямая от прямой — это…", why:"Композиция прямых — снова прямая. Изгибы дают сложные формы.", steps:["Без активации каждый слой — это «умножить и прибавить», то есть прямая.", "Прямая от прямой — снова прямая: формулы просто сливаются в одну.", "Сколько слоёв ни ставь, без изгибов выйдет одна большая прямая."], idea:"Поэтому активация — обязательная деталь любой нейросети. Именно изгибы дают ей силу."}
  ]},

{ stage:2, g:"W", title:"W — слой нейронов", short:"Много нейронов рядом = одно умножение матриц",
  need:"Один нейрон даёт один изгиб — этого мало. Ставим много нейронов рядом (слой) и слои друг за другом. Чтобы не считать каждый нейрон отдельно, веса слоя собирают в таблицу — матрицу W.",
  real:"Большая языковая модель — это десятки слоёв, и каждый — огромная матрица весов. Почти всё время, пока ChatGPT пишет ответ, видеокарты перемножают такие матрицы. Поэтому для ИИ так важны видеокарты.",
  intro:[
    "Один нейрон даёт один излом. <b>Слой</b> — это много нейронов, которые смотрят на одни и те же входы, но у каждого свои веса. Каждый замечает что-то своё.",
    "Веса всего слоя складывают в таблицу — матрицу <b>W</b>. Строки — входы, столбцы — нейроны. 2 входа и 4 нейрона → матрица 2 × 4.",
    "Весь слой считается одной командой: <b>h = ReLU(x @ W + b)</b>. Поэтому для ИИ важны видеокарты: они очень быстро перемножают матрицы.",
    "Слои ставят друг за другом: выход одного — вход следующего. Отсюда «глубокое» обучение: первые слои замечают простое, следующие собирают из простого сложное."
  ],
  sym:[["W","матрица весов слоя","2 входа × 4 нейрона"],["x @ W + b","все суммы слоя разом","4 числа"],["h","выход слоя после ReLU","вход для следующего слоя"]],
  ex:{t:"Слой из двух нейронов, вход x = [1, 2]", s:[
    ["нейрон 1: веса [1, 1], b = 0","z₁ = 1·1 + 1·2 = 3 → ReLU = 3"],
    ["нейрон 2: веса [1, −1], b = 0","z₂ = 1·1 − 1·2 = −1 → ReLU = 0"],
    ["W = [[1, 1], [1, −1]]","Каждый столбец матрицы — веса одного нейрона."],

  analog:"Слой — как бригада экспертов, которые смотрят на одну картинку: один ищет уши, другой усы, третий хвост. Каждый выдаёт свою оценку, а следующая бригада решает по их отчётам.",
  src:"Принс, гл. 3–4 (неглубокие и глубокие сети, матричная запись). Гудфеллоу и соавторы, гл. 6.",
  stand:{scene:"crew", steps:[
    {names:["уши","усы","хвост"], nopin:true, t:"Один нейрон даёт один излом. <b>Слой</b> — это много нейронов, которые смотрят на одни и те же входы, но у каждого свои веса, и каждый замечает что-то своё. Как бригада экспертов над снимком кота: первый отвечает за уши, второй — за усы, третий — за хвост. Каждый кладёт по снимку свою линейку — это его излом: по эту сторону он молчит, за линейкой — говорит.",
     go:["ring", {N:3}, "clear", "lay"],
     ex:[["Гудфеллоу и соавторы, гл. 6","Авторы предлагают смотреть на слой двумя способами: как на одну функцию, которая превращает набор входов в набор выходов, или как на много маленьких блоков, работающих параллельно. Каждый блок получает все входы слоя и выдаёт одно своё число — поэтому его и сравнивают с нейроном."]]},
    {t:"Вход — точка снимка: два числа <b style=\"color:var(--sx)\">x</b> = [x₁, x₂], где она по горизонтали и по вертикали. Веса всего слоя складывают в таблицу — матрицу <b style=\"color:var(--sw)\">W</b>: строки — входы, столбцы — нейроны. Столбец — веса одного эксперта, они задают наклон его линейки, а сдвиг <b style=\"color:var(--sb)\">b</b> — как далеко она от центра. 2 входа и 3 нейрона → W 2 × 3; добавили эксперта — добавился столбец: 2 × 4.",
     go:["ring", {N:3}, "clear", {pin:[1, 2]}, "scan", "pause", {N:4}, "scan"],
     ex:[["Принс, гл. 4","Автор записывает сеть короче: веса слоя собирает в матрицу, сдвиги — в вектор, и весь слой умещается в одну строку: активация от «сдвиг + матрица × вход». В книге матрица повёрнута — строки у неё нейроны, столбцы входы; в коде удобнее x @ W, как в этом уроке. Смысл тот же."]]},
    {t:"Разбор примера: два нейрона, точка <b style=\"color:var(--sx)\">x</b> = [1, 2]. Эксперт 1, веса [1, 1], b = 0: <b style=\"color:var(--syh)\">z₁</b> = 1·1 + 1·2 = 3, ReLU(3) = 3 — точка за его линейкой, он говорит 3. Эксперт 2, веса [1, −1]: z₂ = 1·1 − 1·2 = −1, ReLU(−1) = 0 — молчит. Столбцы вместе — <b style=\"color:var(--sw)\">W</b> = [[1, 1], [1, −1]], а выход слоя <b style=\"color:var(--sf)\">h</b> = [3, 0]: по числу от каждого.",
     go:["ex", "pause", "one"],
     ex:[["Гудфеллоу и соавторы, гл. 6","Главный пример главы — задача XOR: четыре точки, которые одной прямой не разделить. Авторы ставят перед ответом слой из двух нейронов с ReLU: W = [[1, 1], [1, 1]], сдвиги [0, −1]. Слой переносит точки на новые места — две из них сливаются в одну, — и там их уже делит одна прямая."]]},
    {t:"Весь слой считается одной командой: <b><span style=\"color:var(--sf)\">h</span> = ReLU(<span style=\"color:var(--sx)\">x</span> @ <span style=\"color:var(--sw)\">W</span> + <span style=\"color:var(--sb)\">b</span>)</b>. Строку x умножают сразу на все столбцы W — эксперты отвечают одновременно, а не по очереди. Поэтому для ИИ важны видеокарты: они очень быстро перемножают такие таблицы.",
     go:["ring", {N:6}, "clear", {pin:[3, -1]}, "all", "pause", {pin:[-3, -1]}, "all", "pause", {pin:[0, -3]}, "all"]},
    {boss:true, bnd:true, t:"Слои ставят друг за другом: выход одного — вход следующего. Отчёты <b style=\"color:var(--sf)\">h</b> уходят старшему — это следующий слой. Он говорит «кот», только если все эксперты молчат. Отсюда «глубокое» обучение: первые слои замечают простое — эксперт видит лишь свою прямую, — а следующие собирают из простого сложное: по отчётам старший узнаёт целого кота.",

     ex:[["Гудфеллоу и соавторы, гл. 6","Сеть у авторов — цепочка функций: первая обрабатывает вход, вторая — то, что выдала первая, третья — выход второй. Длину цепочки называют глубиной сети, отсюда и название «глубокое обучение»."],
         ["Принс, гл. 4","Автор показывает, что второй слой работает с уже «сложенным» пространством: первый как бы сгибает лист с входами, и всё, что нарисует второй, повторяется на каждом сгибе. Поэтому с глубиной число кусков ломаной растёт гораздо быстрее, чем если добавлять нейроны в один слой."]]},
    {boss:true, bnd:true, t:"Сколько нужно экспертов? Один — одна прямая: кота не обвести, угадано 46 %. Два — полоса, 63 %. Три — <b style=\"color:var(--syh)\">граница</b> замкнулась в треугольник, 83 %. Шесть — почти круг, 98 %. Точку в углу старший при трёх экспертах путает с котом, при четырёх — уже нет. Это и есть задача 3 урока: больше нейронов — сложнее форма границы.",
     go:["ring", {N:1}, "clear", {pin:[-2, 2]}, "full", "pause", {N:2}, "pause", {N:3}, "pause", {N:4}, "pause", {N:5}, "pause", {N:6}],
     ex:[["Принс, гл. 3","Автор переходит от одного входа к двум: теперь излом каждого скрытого нейрона — это прямая на плоскости входов. С одной её стороны нейрон молчит, с другой работает. Три нейрона — три прямые, и плоскость режется на многоугольники, на каждом из которых выход меняется по-своему."]]},
    {look:true, boss:true, bnd:true, t:"Медкомиссия: окулист, лор и хирург смотрят одного и того же человека, но каждый — своё. Каждый пишет справку — это его h. Заключение «годен» пишет председатель по их справкам — следующий слой. Ни один врач не видит всего, а комиссия вместе видит.",
     go:["ring", {N:3}, "clear", {pin:[0, 0]}, "one", "chief"]},
    {look:true, t:"Чеки в трёх магазинах. Список покупок <b style=\"color:var(--sx)\">x</b> = [2 батона, 1 молоко]. У каждого магазина свой прайс — столбец <b style=\"color:var(--sw)\">W</b>: у дома батон 50 ₽ и молоко 90 ₽, на рынке 40 и 100, в гипермаркете 45 и 80. x @ W сразу даёт три чека: [190, 180, 170]. Одно умножение — все магазины разом.",

    {look:true, boss:true, bnd:true, t:"Круг ножницами. Вырежьте из бумаги круг, но ножницы режут только по прямой. Три разреза — треугольник, шесть — шестиугольник, мелкими разрезами — почти круг. Каждый разрез — один нейрон: сам он прямой, а вместе разрезы дают кривую.",
     go:["ring", {N:3}, "clear", {pin:[0, 0]}, "full", "pause", {N:4}, "pause", {N:5}, "pause", {N:6}]}

  tasks:[
    {t:"num", see:{step:3, area:[137, -1, 224, 138]}, q:"Вход x = [2, 1]. Нейрон с весами [1, 3] и b = −4. Чему равен его выход после ReLU?", a:1, hint:"z = 1·2 + 3·1 − 4, потом ReLU.", why:"z = 2 + 3 − 4 = 1, ReLU(1) = 1.", steps:["Взвешенная сумма: 1 · 2 + 3 · 1 = 2 + 3 = 5.", "Прибавляем сдвиг: 5 + (−4) = 1.", "ReLU(1) = 1: число положительное, проходит как есть."], idea:"Каждый нейрон слоя делает одно и то же: сумма → сдвиг → изгиб. Слой — просто много таких нейронов сразу."},
    {t:"mc", see:{step:2, s:2, area:[137, -1, 224, 138]}, q:"Слой: 3 входа, 5 нейронов. Какого размера матрица W?", o:["3 × 5","5 × 5","3 × 3","8 × 1"], a:0, hint:"Строки — входы, столбцы — нейроны.", why:"3 строки (входы) × 5 столбцов (нейроны).", steps:["Каждому нейрону нужен вес для каждого входа: 3 веса на нейрон.", "Нейронов 5 → 5 столбцов по 3 веса.", "Таблица: 3 строки (входы) × 5 столбцов (нейроны) = 15 весов."], idea:"Размер матрицы сразу говорит, сколько у слоя входов и сколько в нём нейронов."},
    {t:"circle", see:6, q:"Оранжевые точки внутри круга, синие снаружи. Выберите число нейронов в слое и обучите сеть, чтобы она угадывала не меньше 95% точек.", hint:"0 нейронов — это просто прямая. Попробуйте 3 и больше.", why:"Нескольких изломов хватает, чтобы обвести круг.", steps:["Без нейронов сеть — прямая. Прямой круг не обведёшь: часть точек всегда окажется не там.", "Каждый нейрон добавляет границе один изгиб.", "3–4 нейронов уже хватает, чтобы граница замкнулась вокруг круга."], idea:"Больше нейронов — сложнее формы, которые сеть может нарисовать. Это главная причина, почему большие сети умеют больше.", sol:"4 или 6 нейронов, «Обучать»."},
    {t:"fill", see:5, q:"Допишите двухслойную сеть", code:"h = relu([[0]] @ W1 + b1)\nout = h @ [[1]] + b2", blanks:["x","W2"], pool:["W1","h","b1"], hint:"Первый слой получает вход, второй — выход первого.", why:"Слой 1: x @ W1. Слой 2: h @ W2.", steps:["Первый слой получает исходный вход: x @ W1 + b1, затем изгиб relu.", "Второй слой получает выход первого — h — и свои веса W2.", "Так слои и соединяют: выход одного — вход следующего."], idea:"«Глубокая» сеть — это просто много слоёв подряд. В больших языковых моделях их десятки."},
    {t:"tf", see:4, q:"Все нейроны слоя считаются одной операцией умножения матриц.", a:true, hint:"Вспомните x @ W.", why:"x @ W сразу даёт суммы всех нейронов слоя.", steps:["x @ W считает суммы сразу для всех столбцов матрицы.", "Каждый столбец — веса одного нейрона, значит, каждый нейрон получил свою сумму.", "Одна операция — весь слой."], idea:"Записывать слой матрицей удобно не только на бумаге: компьютеры умеют перемножать матрицы очень быстро."},
    {t:"mc", see:4, q:"Почему для ИИ нужны видеокарты?", o:["Они очень быстро перемножают матрицы","У них больше памяти для фото","Без них Python не работает","Они охлаждают процессор"], a:0, hint:"Что делает каждый слой?", why:"Почти вся работа сети — умножение матриц, а видеокарта делает его параллельно.", steps:["Каждый слой — умножение матриц: тысячи умножений и сложений.", "Видеокарта создана, чтобы делать тысячи простых вычислений одновременно (сначала — для пикселей в играх).", "Поэтому нейросеть на видеокарте работает во много раз быстрее, чем на обычном процессоре."], idea:"Бум ИИ во многом начался, когда видеокарты стали достаточно мощными, чтобы обучать большие сети."}

{ stage:2, g:"∂", title:"∂ — правило цепочки", short:"Как вина за ошибку раздаётся назад",
  need:"В сети тысячи ручек, и каждой нужен свой градиент. Двигать их по одной и смотреть на ошибку — слишком долго. Правило цепочки позволяет посчитать все градиенты за один проход назад.",
  real:"Каждый шаг обучения ChatGPT включает такой «проход назад»: ошибка раздаётся по всем слоям, и каждая из миллиардов ручек узнаёт свою долю вины. Без правила цепочки большие сети было бы не обучить.",
  intro:[
    "В сети тысячи ручек. Нужно узнать градиент каждой: как изменится ошибка, если её чуть подвинуть. Двигать по одной — слишком долго.",
    "Помогает <b>правило цепочки</b>: если a влияет на b с силой 2, а b влияет на ошибку с силой 3, то a влияет на ошибку с силой 2 × 3 = 6. Влияния вдоль пути перемножаются.",
    "Двух правил хватает почти на всё. <b>Сложение</b> z = x + y: градиент, пришедший к z, достаётся x и y без изменений. <b>Умножение</b> z = x · y: x получает градиент z, умноженный на y («на соседа»), а y — умноженный на x.",
    "Начинают с конца (градиент ошибки по самой себе = 1) и идут назад узел за узлом. Это и есть обратное распространение (backpropagation)."
  ],
  sym:[["∂L/∂a","градиент: влияние a на L","6"],["сложение","градиент проходит как есть","−2 → −2 и −2"],["умножение","× на соседа","−2 · (−3) = 6"]],
  ex:{t:"L = (a · b + c) · f;  a = 2, b = −3, c = 10, f = −2", s:[
    ["вперёд: e = a·b = −6, d = e + c = 4, L = d·f = −8","Сначала считаем значения слева направо."],
    ["∂L/∂L = 1; d получает f = −2; f получает d = 4","Последнее действие — умножение: каждому × сосед."],
    ["e и c получают по −2","d = e + c — сложение: градиент проходит как есть."],
    ["a получает −2 · b = 6; b получает −2 · a = −4","Проверка: при a = 2,01 выходит L = −7,94, то есть +0,06 = 6 · 0,01."]]},
  analog:"Разбор провала в команде: директор спрашивает с руководителя, тот — со своих сотрудников, те — со своих. Каждый получает долю вины по своему вкладу, и никого не нужно проверять отдельно.",
  src:"Карпатый, лекция «building micrograd» (этот пример с a, b, c, f). Принс, гл. 7 (градиенты и обратное распространение). Траск, гл. 6.",
  stand:{scene:"stairs", steps:[
    {t:"В сети тысячи ручек. Нужно узнать градиент каждой: как изменится ошибка, если её чуть подвинуть. Двигать по одной и всё пересчитывать — слишком долго. Возьмём граф из разбора: команда на трибуне считает <b style=\"color:var(--cool)\">L</b> = (a·b + c)·f. Значения поднимаются снизу вверх: a и b дают e = −6, e и c — d = 4, d и f — итог L = −8.",
     go:["fwd"],
     ex:[["Принс, гл. 7","Автор начинает главу с того же вопроса: у глубокой сети огромное число параметров, и для каждого нужна производная ошибки. Если считать каждую отдельно, одни и те же промежуточные вычисления пришлось бы повторять снова и снова. Обратное распространение получает их все за два прохода — вперёд и назад."]]},
    {path:true, t:"Помогает <b>правило цепочки</b>: если одно число влияет на второе с силой 2, а второе на ошибку с силой 3, то первое влияет на ошибку с силой 2 × 3 = 6. Влияния вдоль пути перемножаются. Путь от a к директору: a влияет на e с силой b = −3, e на d — с силой 1, d на L — с силой f = −2. Вместе <b style=\"color:var(--accent)\">∂L/∂a</b> = (−3) · 1 · (−2) = 6.",
     ex:[["Карпатый, лекция «building micrograd»","Правило цепочки автор поясняет примером из Википедии: машина едет вдвое быстрее велосипеда, а велосипед вчетверо быстрее пешехода. Значит, машина быстрее пешехода в 2 × 4 = 8 раз — скорости вдоль цепочки перемножаются."]]},
    {t:"Двух правил хватает почти на всё. <b>Сложение</b> d = e + c: вина, пришедшая к d, достаётся e и c без изменений — по −2. <b>Умножение</b> L = d · f: d получает вину L, умноженную на соседа f, а f — умноженную на d. Табличка соседа обведена пунктиром.",
     go:[{bk:3}, "pause", "back", "back", "pause", {bk:1}, "back", "back"],
     ex:[["Карпатый, лекция «building micrograd»","Узел сложения автор называет раздатчиком: он просто передаёт пришедший градиент всем слагаемым, без изменений. А узел умножения как бы меняет множители местами: каждый получает градиент выхода, умноженный на значение другого."]]},
    {t:"Начинают с конца: вина ошибки перед самой собой равна 1 — папку получает директор. Дальше идут назад, человек за человеком: каждому нужна вина того, кто стоит выше, поэтому порядок — сверху вниз. Это и есть <b>обратное распространение</b> (backpropagation): один проход назад — и вина известна у всех.",
     go:[{bk:0}, "run"],
     ex:[["Принс, гл. 7","Пример автора — цепочка из нескольких функций, вложенных одна в другую. Проход вперёд считает и запоминает все промежуточные значения. Проход назад идёт от ошибки к началу и на каждом звене умножает на производную этого звена, а нужные для этого числа уже сохранены."],
         ["Траск, гл. 6","Автор называет обратное распространение передачей ошибки на большое расстояние: промах выхода отправляют назад, в средний слой, и каждый узел получает долю — через вес связи, которой он влиял на ответ. Узел, который при прогнозе молчал (ReLU дала 0), вины не получает."]]},
    {t:"Разбор примера: a = 2, b = −3, c = 10, f = −2. Вперёд: e = 2·(−3) = −6, d = −6 + 10 = 4, <b style=\"color:var(--cool)\">L</b> = 4·(−2) = −8. Назад: ∂L/∂L = 1; d получает f = −2, f получает d = 4; e и c — по −2; a получает −2 · b = 6, b получает −2 · a = −4.",
     go:[{bk:7}],
     ex:[["Карпатый, лекция «building micrograd»","Это граф из лекции, с теми же числами и L = −8. Автор сначала находит градиенты руками, а потом проверяет каждый: чуть сдвигает одно число, пересчитывает L и смотрит, насколько она изменилась."]]},
    {check:true, t:"Проверка: <b style=\"color:var(--accent)\">∂L/∂a</b> = 6 значит, что сдвиг a на 0,1 сдвинет L на 6 · 0,1 = 0,6. Ползунок a: при a = 2,1 выходит L = −7,4 — ровно на 0,6 больше. При a = 2,01 было бы L = −7,94. Вина a от самого a не зависит, а вина b = −2 · a — меняется.",
     go:[{a:2.1}, "pause", {a:3}, "pause", {a:1.5}]},
    {look:true, path:true, t:"Обмен через третью валюту: пусть за доллар дают 0,9 евро, а за евро — 100 рублей. Тогда за доллар — 0,9 × 100 = 90 рублей: курсы вдоль цепочки перемножаются. Так же вина идёт по трибуне: от директора к a через d и e, и силы связей перемножаются."},
    {look:true, t:"Площадь комнаты = длина × ширина: 4 × 3 = 12 м². Удлините комнату на метр — площадь вырастет на 3 м², то есть на ширину: это «× на соседа». А общий счёт в кафе — сумма заказов: подорожал любой заказ на 100 ₽ — и счёт вырос на те же 100 ₽. Сложение передаёт как есть.",
     go:[{bk:5}, "back", "pause", {bk:3}, "back"]}
  ]},
  tasks:[
    {t:"num", see:2, q:"a влияет на b с силой 2, b влияет на ошибку с силой 5. С какой силой a влияет на ошибку?", a:10, hint:"Влияния вдоль пути перемножаются.", why:"2 × 5 = 10.", steps:["a меняется на 1 → b меняется на 2.", "b меняется на 2 → ошибка меняется на 2 · 5 = 10.", "Влияния вдоль цепочки перемножаются: 2 × 5 = 10."], idea:"Так считают влияние любой ручки на ошибку, даже если между ними десятки слоёв: перемножают влияния вдоль пути."},
    {t:"num", see:3, q:"z = x + y. К z пришёл градиент 7. Какой градиент получит x?", a:7, hint:"Сложение передаёт градиент как есть.", why:"При сложении градиент проходит без изменений: 7.", steps:["z = x + y: если x вырастет на 1, z тоже вырастет на 1.", "Значит, влияние x на z равно 1.", "Градиент x = 7 · 1 = 7 — проходит без изменений."], idea:"Сложение — «прозрачный» узел: передаёт градиент дальше как есть. Это пригодится в уроке «+» про остаточные связи."},
    {t:"num", see:{step:3, s:3}, q:"z = x · y, x = 4, y = 5. К z пришёл градиент 1. Какой градиент получит x?", a:5, hint:"Умножение: × на соседа.", why:"1 × y = 5.", steps:["z = x · y. Если x вырастет на 1, z вырастет на y, то есть на 5.", "Значит, влияние x на z равно 5.", "Градиент x = 1 · 5 = 5: умножаем на соседа."], idea:"Умножение усиливает градиент на соседний множитель. Двух правил — для сложения и умножения — хватает почти на всю нейросеть."},
    {t:"chain", see:4, q:"Пройдите граф назад сами: впишите градиент каждого узла по очереди.", hint:"Умножение — × на соседа, сложение — как есть.", why:"Вы сделали обратное распространение руками: d = −2, f = 4, e = −2, c = −2, a = 6, b = −4.", steps:["Старт с конца: градиент L равен 1. Последнее действие — L = d · f.", "Умножение — × на соседа: d получает f = −2, f получает d = 4.", "d = e + c — сложение: e и c получают по −2.", "e = a · b: a получает −2 · b = −2 · (−3) = 6, b получает −2 · a = −2 · 2 = −4."], idea:"Вы сделали обратное распространение руками. Компьютер делает то же самое для миллиардов узлов — следующий урок.", sol:"d = −2, f = 4, e = −2, c = −2, a = 6, b = −4"},
    {t:"mc", see:4, q:"Зачем идти от конца графа к началу?", o:["Градиент узла строится из градиента следующего за ним, поэтому начинаем с ошибки","Так быстрее читать код","Начало графа неважно","Так придумали случайно"], a:0, hint:"Что нужно знать, чтобы посчитать градиент a?", why:"Каждому узлу нужен градиент «сверху», поэтому идём от L назад.", steps:["Чтобы найти градиент a, нужно знать градиент того, куда a идёт дальше (e).", "Чтобы знать градиент e, нужен градиент d — и так до самой ошибки L.", "Значит, начинаем с L и идём назад: тогда всё нужное уже посчитано."], idea:"Поэтому метод и называют «обратным распространением»: вина за ошибку течёт от конца к началу."}
  ]},

{ stage:2, g:"⟲", title:"⟲ — обратный проход в коде", short:"loss.backward(): правило цепочки делает компьютер",
  need:"Руками градиенты можно посчитать для шести узлов, но не для миллиардов. Поэтому правило цепочки поручают компьютеру: каждое число помнит, откуда оно взялось, а одна команда считает всё.",
  real:"Библиотека PyTorch, на которой написаны многие современные модели, делает это автоматически: loss.backward() — и градиенты всех ручек готовы. Выводить формулы для каждой ручки никому не нужно.",
  intro:[
    "Правило цепочки можно поручить компьютеру. Для этого каждое число запоминает, из каких чисел и какой операцией оно получено. Получается граф вычислений.",
    "Вызов <b>backward()</b> обходит граф от ошибки к началу и в каждом узле применяет правило: для сложения — передать как есть, для умножения — умножить на соседа. Это называют автоматическим дифференцированием.",
    "В PyTorch это одна строка: <b>loss.backward()</b>. После неё у каждой ручки появляется поле <b>.grad</b> — её градиент. Дальше оптимизатор делает шаг.",
    "Важная деталь: градиенты копятся (+=). Поэтому перед новым шагом их обнуляют: <b>optimizer.zero_grad()</b>."
  ],
  sym:[["Value / тензор","число, которое помнит своё происхождение","a = Value(2.0)"],["backward()","обратный проход по графу","L.backward()"],[".grad","градиент ручки после прохода","a.grad = 6.0"],["zero_grad()","стереть старые градиенты","перед каждым шагом"]],
  ex:{t:"Что происходит при L.backward()", s:[
    ["L.grad = 1","Старт с конца."],
    ["узел умножения: d.grad += f · L.grad","Каждый узел знает свою операцию и раздаёт градиент родителям."],
    ["обход в обратном порядке","Узлы выстраиваются так, чтобы каждый обработался после всех, кто от него зависит."],
    ["a.grad = 6.0","Тот же ответ, что вы посчитали вручную."]]},
  analog:"Бухгалтер хранит все чеки. Чтобы понять, откуда взялась итоговая сумма, он идёт по чекам в обратном порядке. Если не выбросить чеки прошлого месяца (zero_grad), они попадут в новый отчёт.",
  src:"Карпатый, micrograd (класс Value и backward). Траск, гл. 13 (своя мини-библиотека с автоградиентами). Рашка, приложение A (основы PyTorch и autograd).",
  stand:{scene:"ledger", steps:[
    {t:"Правило цепочки можно поручить компьютеру. Для этого каждое число запоминает, из каких чисел и какой операцией оно получено. Как бухгалтер: на каждую операцию — чек, где записано, что с чем перемножили или сложили и что вышло. Чек 1: e = a · b = −6, чек 2: d = e + c = 4, чек 3: <b style=\"color:var(--cool)\">L</b> = d · f = −8. Чеки по порядку — это и есть <b>граф вычислений</b>.",
     go:["clear", "print"],
     ex:[["Траск, гл. 13","Автор строит свою маленькую библиотеку для глубокого обучения. Каждый тензор в ней помнит, из каких тензоров он получен и какой операцией — сложением, умножением или другой. По этим записям потом можно пройти назад и посчитать градиенты."]]},
    {t:"Вызов <b>backward()</b> обходит граф от ошибки к началу и в каждом узле применяет правило: для сложения — передать как есть, для умножения — умножить на соседа. Бухгалтер идёт по чекам в обратном порядке, от итога L к первому, и на каждом раздаёт градиент тем, из кого число получено. Это называют автоматическим дифференцированием.",
     go:["bw"],
     ex:[["Карпатый, лекция «building micrograd»","Чтобы пройти граф в правильном порядке, автор выстраивает узлы топологической сортировкой: узел попадает в список только после всех, из кого он получен. Потом backward идёт по этому списку с конца и у каждого узла вызывает его маленькое правило — своё для сложения и своё для умножения."]]},
    {t:"Разбор примера: что происходит при L.backward(). Старт с конца: <b style=\"color:var(--accent)\">L.grad = 1</b>. Чек умножения L = d · f раздаёт: d.grad += f · L.grad = −2, f.grad += d · L.grad = 4. Чек сложения d = e + c передаёт −2 как есть. Последний — снова умножение, и <b style=\"color:var(--accent)\">a.grad = 6.0</b>: тот же ответ, что вы посчитали руками в прошлом уроке.",
     go:["bwS"],
     ex:[["Карпатый, лекция «building micrograd»","Под конец автор пересчитывает свой пример в PyTorch — градиенты совпадают с теми, что дал micrograd. Разница только в размахе: PyTorch работает не с отдельными числами, а с целыми таблицами чисел — тензорами."]]},
    {cards:true, t:"В PyTorch это одна строка: <b>loss.backward()</b>. После неё у каждой ручки появляется поле <b style=\"color:var(--accent)\">.grad</b> — её градиент: на карточках a, b, c и f. Дальше оптимизатор делает шаг — сдвигает каждую ручку против её .grad.",
     go:["bwI"],
     ex:[["Рашка, приложение A","Автор показывает autograd на маленькой логистической регрессии: если у тензора включено requires_grad, PyTorch сам строит граф вычислений. После loss.backward() градиенты лежат в поле .grad у веса и сдвига — выводить формулы руками не нужно."],
         ["Траск, гл. 13","В своей библиотеке автор пишет и оптимизатор: он хранит список параметров и умеет две вещи — сделать шаг, сдвинув каждый параметр против его градиента, и обнулить градиенты перед следующим шагом."]]},
    {t:"Важная деталь: градиенты копятся (+=). Бухгалтер не стирает карточки сам: второй backward() прибавит новые числа к старым — a.grad = 6 + 6 = 12, и шаг выйдет вдвое длиннее, чем нужно. Поэтому перед новым шагом их обнуляют: <b>optimizer.zero_grad()</b> — старые записи в корзину.",
     go:["bwI", "pause", "bw", "pause", "zero", "pause", "bwI"],
     ex:[["Карпатый, лекция «building micrograd»","Автор сам натыкается на ошибку: если число входит в формулу дважды, например b = a + a, его градиент должен прийти с обеих сторон и сложиться, а при «=» вторая часть затирала первую. Поэтому в коде везде +=. А в цикле обучения он забывает обнулить градиенты, и они копятся от шага к шагу, — и признаёт, что это очень частая ошибка."],
         ["Рашка, приложение A","В цикле обучения у автора перед loss.backward() стоит optimizer.zero_grad(): градиенты прошлого шага обнуляют, иначе они прибавились бы к новым."]]},
    {t:"Поменяйте <b>a</b> ползунком — бухгалтер заведёт новые чеки и пройдёт их заново. a.grad = b · e.grad = 6 при любом a. А b.grad = a · e.grad = −2 · a: при a = 1 он −2, при a = 2,5 — −5. Поменяли одно число — все градиенты пересчитались сами, как в задаче с кодом.",
     go:[{a:1}, "pause", {a:2.5}, "pause", {a:2}]},
    {look:true, t:"Суточный пробег в машине: счётчик копит километры, пока его не сбросить. Забыли нажать сброс перед новой поездкой — к ней прибавится прошлая. zero_grad() — та же кнопка сброса, только для градиентов: без неё каждый backward() докидывает к старым числам новые.",
     go:["bwI", "pause", "bwI", "pause", "bwI", "pause", "zero"]},
    {look:true, t:"Таблица Excel: ячейка с формулой помнит, из каких ячеек она посчитана, — Excel умеет показать их стрелками. Граф вычислений — такие же стрелки от чисел к чекам. backward() идёт по ним в обратную сторону и каждой ячейке-источнику дописывает её долю.",
     go:["bw"]}
  ]},
  tasks:[
    {t:"code", see:6, q:"Запустите код: он считает градиенты сам. Потом поменяйте a на 3.0 и снова нажмите «Проверить». Каким станет градиент b?", srcId:"code-value", hint:"Градиент b = градиент e × a = −2 × a.", sol:"a = Value(3.0) → градиент b: −6.0", why:"b получает градиент −2 × a = −6: умножение берёт соседа.", steps:["В графе e = a · b, и к e приходит градиент −2.", "Для b сосед по умножению — a. Значит, градиент b = −2 · a.", "При a = 3: −2 · 3 = −6. Программа посчитала то же самое."], idea:"Вы поменяли одно число — и все градиенты пересчитались сами. В этом сила автоматического подсчёта градиентов.",
     check:{out:o => /градиент b: -6\.0/.test(o), code:c => /=\s*Value\(\s*3(\.0*)?\s*\)\s*,\s*Value\(\s*-3/.test(c)}},
    {t:"mc", see:2, q:"Что делает loss.backward()?", o:["Считает градиенты всех ручек, проходя граф от ошибки назад","Делает шаг обучения","Удаляет модель","Запускает модель задом наперёд для генерации"], a:0, hint:"backward — «назад».", why:"Шаг делает оптимизатор, а backward только считает градиенты.", steps:["backward — «назад»: команда проходит граф от ошибки к началу.", "По пути она записывает каждой ручке её градиент (.grad).", "А двигает ручки другая команда — optimizer.step()."], idea:"Разделение ролей: backward узнаёт, куда двигать, оптимизатор делает шаг."},
    {t:"tf", see:5, q:"Если не вызывать zero_grad(), градиенты с прошлых шагов сложатся с новыми.", a:true, hint:"В коде градиент копится через +=.", why:"Градиенты накапливаются, поэтому их обнуляют перед каждым шагом.", steps:["В коде градиент добавляется (grad += …), а не заменяется.", "Если не стереть старый градиент, новый прибавится к нему.", "Шаг получится по смеси старого и нового направления — неправильный."], idea:"Поэтому в каждом цикле обучения есть zero_grad(): чистый лист перед новым шагом."},
    {t:"order", q:"Порядок действий в одном шаге обучения", items:["Прогноз модели","Ошибка loss","loss.backward()","optimizer.step()"], why:"Сначала прогноз и ошибка, потом градиенты, потом шаг.", steps:["Модель делает прогноз.", "По прогнозу считают ошибку loss.", "loss.backward() раздаёт градиенты всем ручкам.", "optimizer.step() сдвигает ручки на шаг."], idea:"Это тот же круг из урока ↻, только записанный командами PyTorch."},
    {t:"num", see:{step:4, s:3}, q:"После backward у ручки w: w.grad = 3. Шаг с lr = 0,1, w было 2. Каким станет w?", a:1.7, hint:"w − lr · grad.", why:"2 − 0,1 · 3 = 1,7.", steps:["Правило шага: w − lr · grad.", "lr · grad = 0,1 · 3 = 0,3.", "2 − 0,3 = 1,7."], idea:"Именно это делает optimizer.step() с каждой ручкой — только с миллионами сразу."}
  ]},

    "Резать можно по буквам (словарь маленький, но текст длинный), по словам (текст короткий, но словарь огромный, и новые слова не помещаются) или по частям слов, как делают современные модели: «нейросеть» → «нейро» + «сеть».",
    "<b>Словарь</b> — список всех токенов, которые знает модель. Номер токена (id) — его место в словаре. У GPT-2 словарь около 50 тысяч токенов.",

    ["« » = 0, а = 1, л = 2, м = 3, ы = 4","Место в словаре = номер."],

  src:"Рашка, гл. 2 (токенизация, словарь, BPE). Аламмар и Грутендорст, «Hands-On Large Language Models», гл. 2. Карпатый, лекция «Let's build the GPT Tokenizer».",

    {t:"num", q:"Сколько токенов в «кот ест», если резать по буквам? Пробел — тоже токен.", a:7, hint:"к-о-т-пробел-е-с-т.", why:"3 буквы + пробел + 3 буквы = 7.", steps:["Режем по буквам: к, о, т — 3 токена.", "Пробел — тоже токен: ещё 1.", "е, с, т — ещё 3. Итого 3 + 1 + 3 = 7."], idea:"Модель видит не слова, а цепочку токенов. Пробелы и знаки препинания для неё тоже важны."},
    {t:"num", q:"Сколько разных токенов (размер словаря) в слове «мама» при разбиении по буквам?", a:2, hint:"Какие разные буквы там есть?", why:"Только «м» и «а».", steps:["Буквы слова «мама»: м, а, м, а — 4 токена.", "Но разных среди них только два: «м» и «а».", "Словарь — список разных токенов, поэтому в нём 2."], idea:"Сколько раз токен встречается, неважно: в словаре он записан один раз."},
    {t:"tokgoal", q:"Напишите любой текст длиной от 6 символов, в котором ровно 5 разных токенов-букв (пробел тоже считается).", n:5, hint:"Например, «мама мыла» — там « », а, л, м, ы.", why:"Словарь — это набор разных токенов, сколько бы раз они ни повторялись.", steps:["Словарь — набор разных символов текста.", "«мама мыла»: м, а, пробел, ы, л — 5 разных.", "Повторы не добавляют в словарь новых токенов."], idea:"Так устроен первый шаг любой языковой модели: собрать словарь и заменить текст номерами.", sol:"«мама мыла»"},
    {t:"mc", q:"Почему современные модели режут текст на части слов?", o:["Словарь остаётся небольшим, а любое новое слово собирается из частей","Так текст красивее","Буквы модель не понимает совсем","Чтобы убрать пробелы"], a:0, hint:"Подумайте о словах, которых нет в словаре.", why:"Части слов — компромисс между буквами и словами.", steps:["По буквам: словарь маленький, зато текст очень длинный.", "По словам: текст короткий, но словарь огромный, а нового слова в нём нет.", "По частям слов — середина: «нейро» + «сеть» соберут и незнакомое слово."], idea:"Так режут текст GPT и большинство современных моделей (способ называется BPE)."},
    {t:"match", q:"Соедините термин и смысл", pairs:[["токен","кусочек текста"],["словарь","все токены, которые знает модель"],["id","номер токена"]], why:"Текст → токены → номера из словаря.", steps:["Текст режем на кусочки — токены.", "Все разные токены записываем в список — словарь.", "Номер места в словаре — id. Модель работает именно с номерами."], idea:"Цепочка «текст → токены → номера» — это вход ChatGPT. Дальше номера превращаются в векторы (следующий урок)."}
  ]},

{ stage:3, g:"E", title:"E — эмбеддинг", short:"Номер токена становится точкой на карте смыслов",
  need:"Номер токена — просто метка: «кот» под номером 7 не «больше» «дома» под номером 3. Модели нужно, чтобы похожие слова и выглядели похоже. Для этого каждому номеру дают набор чисел — координаты на карте смыслов.",
  real:"Первое, что делает ChatGPT с вашими токенами, — заменяет каждый номер на длинный вектор из таблицы эмбеддингов. Эту таблицу никто не заполнял руками: числа подобрались сами при обучении, и похожие слова оказались рядом.",
  intro:[
    "Номер токена — просто метка: токен 17 не «больше» токена 5 по смыслу. Поэтому каждому номеру сопоставляют список чисел — вектор. Это и есть <b>эмбеддинг</b>.",
    "Вектор — координаты токена на карте смыслов. Похожие по смыслу токены оказываются рядом: «кот» возле «собаки», «Москва» возле «Парижа».",
    "Направления на карте тоже несут смысл: шаг от «мужчины» к «женщине» такой же, как от «короля» к «королеве». Поэтому король − мужчина + женщина ≈ королева.",
    "Все векторы хранятся в таблице: строк столько, сколько токенов в словаре, столбцов — длина вектора <b>d</b>. Это обычные ручки: модель сама подбирает их при обучении."
  ],
  sym:[["вектор","список чисел — координаты","[0,8; 0,1]"],["d","длина вектора","у GPT-2 small — 768"],["таблица E","словарь × d чисел","50 257 × 768"]],
  ex:{t:"Как номер становится вектором", s:[
    ["«кот» → id 7","Сначала токенизация."],
    ["строка 7 таблицы → [0,8; 0,1]","Берём седьмую строку — это вектор «кота»."],
    ["«собака» → [0,7; 0,2]","Близкие числа — близкие точки — похожий смысл."],
    ["таблица учится","Сначала числа случайные, при обучении похожие слова сами «съезжаются»."]]},
  analog:"Как координаты городов: по названию города ничего не посчитаешь, а по широте и долготе можно найти расстояние и соседей. Эмбеддинг даёт словам такие координаты, только измерений не два, а сотни.",
  src:"Траск, гл. 11 («король − мужчина + женщина»). Аламмар, «The Illustrated Word2vec». Рашка, гл. 2 (слой эмбеддингов).",
  tasks:[
    {t:"emb", q:"Нажмите на слово, которое ближе всего к «кот».", target:"собака", from:"кот", hint:"Ищите среди животных.", why:"«Собака» лежит к «коту» ближе всех: тоже домашнее животное.", steps:["У каждого слова на карте есть координаты — эмбеддинг.", "Слова со сходным смыслом лежат рядом: «кот» и «собака» — домашние животные.", "Сходство для модели — это просто расстояние между точками."], idea:"Близость на карте позволяет переносить знания: узнав что-то про кошек, модель отчасти «знает» это и про собак."},
    {t:"emb", q:"Где окажется король − мужчина + женщина? Нажмите на это слово.", target:"королева", arrow:true, hint:"Приложите стрелку «мужчина → женщина» к «королю».", why:"Тот же сдвиг, что от «мужчины» к «женщине», ведёт от «короля» к «королеве».", steps:["Стрелка от «мужчины» к «женщине» — направление «пол».", "Прикладываем ту же стрелку к «королю».", "Попадаем к «королеве»: король − мужчина + женщина ≈ королева."], idea:"Направления на карте несут смысл. Правилам модель никто не учил — такие закономерности сами проявляются в числах."},
    {t:"num", q:"Словарь — 100 токенов, длина вектора d = 64. Сколько чисел в таблице эмбеддингов?", a:6400, hint:"Строк — по числу токенов, столбцов — d.", why:"100 × 64 = 6400.", steps:["В таблице по строке на каждый токен: 100 строк.", "В каждой строке вектор из d = 64 чисел.", "Всего 100 × 64 = 6400 чисел."], idea:"Все эти числа — обучаемые ручки, как w и b. У больших моделей одна только таблица эмбеддингов — десятки миллионов чисел."},
    {t:"mc", q:"Кто задаёт числа в эмбеддингах?", o:["Модель сама при обучении","Программист для каждого слова","Их берут из толкового словаря","Они равны номеру токена"], a:0, hint:"Это такие же ручки, как w и b.", why:"Эмбеддинги учатся градиентным спуском вместе с остальной моделью.", steps:["Сначала числа в таблице случайные.", "При обучении градиенты двигают их, как любые другие ручки.", "Слова, которые встречаются в похожих местах текста, постепенно «съезжаются» на карте."], idea:"Никто не объяснял модели, что кот похож на собаку: она вывела это из того, в каких текстах встречаются эти слова."},
    {t:"tf", q:"Номер токена 17 означает, что этот токен важнее токена 5.", a:false, hint:"Номер — просто место в словаре.", why:"Номер — метка без смысла. Смысл несёт вектор.", steps:["Номер — просто место в словаре, как номер страницы в оглавлении.", "Номера раздали по порядку, смысла в них нет: 17 не «больше» 5.", "Смысл несёт вектор, который стоит за номером."], idea:"Поэтому номера и превращают в векторы: по номерам модель не смогла бы сравнивать слова."}
  ]},

{ stage:3, g:"p", title:"p — позиция", short:"Модели нужно знать порядок слов",
  need:"Эмбеддинг говорит, что это за слово, но не говорит, где оно стоит. А от порядка зависит смысл. Поэтому к каждому токену добавляют ещё и «номер места».",
  real:"ChatGPT различает порядок слов в вашем вопросе благодаря информации о позициях. У современных моделей способ записать позицию хитрее, чем таблица, но задача та же.",
  intro:[
    "«Собака укусила человека» и «человек укусил собаку» — почти одни и те же слова, но смысл противоположный. Значит, модель должна знать, где стоит каждое слово.",
    "Для этого заводят вторую таблицу — эмбеддинги <b>позиций</b>: свой вектор для 1-го места, 2-го, 3-го и так далее, до длины контекста.",
    "Вектор токена и вектор его позиции просто складывают: <b>вход = E(токен) + P(позиция)</b>. Теперь одно и то же слово на разных местах выглядит для модели по-разному.",
    "Длина контекста <b>ctx</b> — сколько позиций в таблице, то есть сколько токенов модель видит за раз."
  ],
  sym:[["позиция","номер места токена в тексте","0, 1, 2…"],["P(позиция)","вектор позиции, тоже обучается","P(0) = [0; 0,5]"],["E + P","вход для блоков","[0,8; 0,1] + [0; 0,5]"],["ctx","длина контекста","у GPT-2 — 1024"]],
  ex:{t:"«кот ест» и «ест кот»", s:[
    ["«кот» на месте 0","вектор = E(кот) + P(0)"],
    ["«ест» на месте 1","вектор = E(ест) + P(1)"],
    ["«ест кот»","Теперь E(ест) + P(0) и E(кот) + P(1) — другие суммы."],
    ["итог","Модель различает порядок слов."]]},
  analog:"Как номера мест в театре: билеты на один спектакль, но первый ряд и тридцатый — разные впечатления. Позиция — номер места слова в предложении.",
  src:"Рашка, гл. 2 (позиционные эмбеддинги). Аламмар, «The Illustrated Transformer». Принс, гл. 12.",
  tasks:[
    {t:"tf", q:"Без позиций модель не отличит «собака укусила человека» от «человек укусил собаку».", a:true, hint:"Набор слов почти тот же.", why:"Различается порядок, поэтому позицию добавляют явно.", steps:["В обоих предложениях почти одни и те же слова: собака, укусить, человек.", "Отличается только порядок — кто кого укусил.", "Если модель видит только набор слов, без мест, разницы она не заметит."], idea:"Внимание (урок Q·K) само по себе порядка не знает, поэтому позиции добавляют явно."},
    {t:"mc", q:"Как вектор позиции соединяют с вектором токена?", o:["Складывают","Перемножают все числа","Записывают позицию вместо токена","Никак, позиция не нужна"], a:0, hint:"Самая простая операция.", why:"E(токен) + P(позиция).", steps:["У токена есть вектор смысла E, у его места — вектор позиции P.", "Их просто складывают по координатам: E + P.", "Получается один вектор, в котором есть и «что», и «где»."], idea:"Сложение — самый простой способ смешать две информации, и длина вектора при этом не меняется."},
    {t:"num", q:"Вектор токена [1; 2], вектор позиции [0,5; −1]. Чему равна первая координата суммы?", a:1.5, hint:"Складываем по координатам: 1 + 0,5.", why:"1 + 0,5 = 1,5 (а вторая: 2 − 1 = 1).", steps:["Складываем по координатам: первая с первой, вторая со второй.", "Первая: 1 + 0,5 = 1,5.", "Вторая: 2 + (−1) = 1."], idea:"Тот же токен на другом месте получит другую сумму — и модель отличит «кот ест» от «ест кот»."},
    {t:"num", q:"Контекст ctx = 64, длина вектора d = 128. Сколько чисел в таблице позиций?", a:8192, hint:"Строк — по числу позиций.", why:"64 × 128 = 8192.", steps:["По строке на каждую позицию: 64 строки.", "В каждой — вектор длины d = 128.", "64 × 128 = 8192 числа."], idea:"Длина контекста — сколько токенов модель видит за раз. У современных больших моделей — десятки и сотни тысяч токенов."},
    {t:"fill", q:"Допишите код мини-GPT", code:"self.tok = nn.Embedding(vocab_size, d)\nself.pos = nn.Embedding([[0]], d)\n...\nx = self.tok(idx) [[1]] self.pos(positions)", blanks:["ctx","+"], pool:["vocab_size","*","@"], hint:"Сколько строк в таблице позиций? Как соединяем векторы?", why:"Позиций ctx штук, векторы складываются.", steps:["Таблица позиций: по строке на каждое место, а мест — ctx.", "Вектор токена и вектор позиции соединяют сложением: +.", "Получается вход для блоков трансформера."], idea:"Две строчки кода — и у модели есть и смысл слов, и их порядок."}
  ]},

{ stage:3, g:"%", title:"% — softmax", short:"Сырые оценки превращаются в вероятности",
  need:"Модель выдаёт для каждого токена словаря оценку — любое число. А нужны вероятности: от 0 до 100%, вместе ровно 100%. Softmax превращает одно в другое.",
  real:"Каждый раз, когда ChatGPT пишет следующий кусочек текста, softmax превращает оценки для десятков тысяч токенов словаря в вероятности. Из них и выбирается, что написать.",
  intro:[
    "На выходе модель выдаёт по одному числу на каждый токен словаря — оценку (<b>logit</b>). Оценки бывают любыми: 3,1, −2, 0,5. Чтобы получить вероятности, их пропускают через <b>softmax</b>.",
    "softmax делает три вещи: возводит e в степень каждой оценки (всё становится положительным), складывает результаты и делит каждый на сумму. Все числа оказываются от 0 до 1 и вместе дают 100%.",
    "Больше оценка — больше вероятность. Важна разница оценок, а не их размер: [1, 1] и [10, 10] дают одинаковые 50 на 50.",
    "softmax работает дважды: на выходе модели (вероятности следующего токена) и внутри внимания (доли внимания)."
  ],
  sym:[["logit","сырая оценка токена","«кот»: 2"],["eᶻ","экспонента: всегда > 0","e² ≈ 7,39"],["softmax","eᶻ / сумма всех eᶻ","7,39 / 9,39 ≈ 79%"]],
  ex:{t:"Оценки: «кот» 2, «пёс» 0, «дом» 0", s:[
    ["e² ≈ 7,39; e⁰ = 1; e⁰ = 1","Экспонента делает всё положительным."],
    ["сумма = 9,39","Складываем."],
    ["кот: 7,39 / 9,39 ≈ 79%","Делим каждое на сумму."],
    ["пёс ≈ 11%, дом ≈ 11%","Вместе 100%."]]},
  analog:"Как голосование с усилением: у кого оценка чуть выше, тот получает заметно больше голосов, но шанс остаётся у всех. Потом голоса переводят в проценты, чтобы в сумме было 100.",
  src:"Траск, гл. 9 (softmax). Рашка, гл. 3–4. Гудфеллоу и соавторы, гл. 6.",
  tasks:[
    {t:"softmax", q:"Двигайте оценки трёх слов. Сделайте так, чтобы «кот» получил больше 70%.", goal:"cat", hint:"Поднимите оценку «кота» на 2–3 выше остальных.", why:"Разница оценок в 2 и больше даёт сильный перевес.", steps:["Вероятность зависит от разницы оценок, а не от их размера.", "Поднимите «кота» на 2 выше остальных: e² ≈ 7,4 против 1 и 1.", "7,4 / 9,4 ≈ 79% — больше 70%."], idea:"Небольшой перевес в оценке даёт большой перевес в вероятности — так модель становится «уверенной».", sol:"кот 2, пёс 0, дом 0"},
    {t:"num", q:"Оценки двух токенов одинаковые: [3, 3]. Какая вероятность у первого, в процентах?", a:50, hint:"Одинаковые оценки — одинаковые шансы.", why:"e³ / (e³ + e³) = 1/2 = 50%.", steps:["e³ ≈ 20,1 у обоих токенов.", "Сумма: 20,1 + 20,1 = 40,2.", "20,1 / 40,2 = 0,5, то есть 50%."], idea:"Равные оценки — равные шансы, какими бы большими они ни были."},
    {t:"softmax", q:"Сделайте три вероятности почти равными (каждая от 30% до 37%), но так, чтобы все оценки были не меньше 2.", goal:"equal", hint:"Важна разница оценок, а не их размер.", why:"Одинаковые оценки дают равные доли, какими бы большими они ни были.", steps:["Равные доли получаются, когда оценки равны.", "Неважно, 2 у всех или 10, — разница нулевая, доли по 33%.", "Условие «не меньше 2» не мешает: поставьте всем, например, 2."], idea:"Softmax смотрит только на разницу. Прибавить одно и то же число ко всем оценкам — ничего не изменить.", sol:"все три оценки = 2 (или все = 3)"},
    {t:"tf", q:"После softmax сумма всех вероятностей равна 100%.", a:true, hint:"Мы делим на сумму.", why:"Каждое eᶻ делится на сумму всех, поэтому вместе выходит 1.", steps:["Каждое eᶻ делим на сумму всех eᶻ.", "Сумма долей = сумма / сумма = 1, то есть 100%.", "Поэтому результат можно читать как вероятности."], idea:"Так модель распределяет уверенность между вариантами: если у одного доля выросла, у остальных уменьшилась."},
    {t:"mc", q:"Оценки [1, 2, 5]. У какого токена наибольшая вероятность?", o:["У третьего (оценка 5)","У первого","У всех одинаково","Нельзя сказать без обучения"], a:0, hint:"Больше оценка — больше вероятность.", why:"softmax сохраняет порядок: самая большая оценка — самая большая вероятность.", steps:["eᶻ растёт вместе с z: чем больше оценка, тем больше eᶻ.", "Деление на общую сумму порядок не меняет.", "Значит, у оценки 5 — самая большая вероятность (около 94%)."], idea:"Softmax не меняет, кто лидер, — он только переводит оценки в проценты."}
  ]},

{ stage:3, g:"T", title:"T — следующий токен", short:"Угадывание по одному токену и температура",
  need:"У модели есть вероятности следующего токена. Как из этого получается целый текст? Выбрать токен, дописать и повторить. А температура решает, насколько смело выбирать.",
  real:"Это ровно то, что вы видите в ChatGPT: ответ появляется кусочек за кусочком, потому что модель угадывает по одному токену. Настройку «температура» дают разработчикам многие ИИ-сервисы.",

    "<b>Внимание</b> даёт каждому токену три вектора: запрос <b>Q</b> («что я ищу»), ключ <b>K</b> («что во мне есть») и значение <b>V</b> («что я передам, если меня выберут»). Все три получаются умножением эмбеддинга на свою обучаемую матрицу.",

    ["MLP: 64 → 256 → 64","Каждый токен отдельно расширяется, проходит активацию и сжимается обратно."],
    ["выход: 4 × 64","Готово для следующего блока."]]},
  analog:"Совещание и работа: сначала все обсуждают (внимание), потом каждый думает над своей частью (MLP). Повторить так 12 раз — и у команды сложится глубокое понимание.",
  src:"Карпатый, «Let's build GPT» (внимание как общение, MLP как вычисление). Рашка, гл. 4 (блок трансформера). Принс, гл. 12.",
  tasks:[
    {t:"order", q:"Соберите путь текста через трансформер", items:["Токены","Эмбеддинги + позиции","Блоки × N","Выходной слой","Вероятности следующего токена"], why:"Блоки одинаковые и стоят стопкой.", steps:["Текст режем на токены.", "Каждому токену — вектор смысла и вектор позиции.", "Векторы проходят через N одинаковых блоков.", "Выходной слой даёт оценки токенов, softmax — вероятности следующего."], idea:"Это весь путь, который проходит ваш вопрос внутри ChatGPT, прежде чем появится один новый кусочек ответа."},
    {t:"mc", q:"Что делает MLP внутри блока?", o:["Каждый токен отдельно обдумывает собранную информацию","Токены обмениваются информацией","Режет текст на токены","Выбирает следующее слово"], a:0, hint:"Общение — это внимание. А MLP?", why:"Общение — внимание, размышление — MLP.", steps:["Внимание — когда токены «разговаривают» и обмениваются информацией.", "MLP — когда каждый токен отдельно «обдумывает» то, что узнал.", "MLP — это два слоя нейронов с активацией из этапа 2."], idea:"Общение + размышление — и так в каждом блоке. Вся GPT — это повторение этой пары."},
    {t:"match", q:"Соедините часть модели и её роль", pairs:[["внимание","общение токенов"],["MLP","размышление каждого токена"],["выходной слой","оценки всех токенов словаря"]], why:"Вместе они превращают текст в вероятности следующего токена.", steps:["Внимание собирает информацию от других токенов.", "MLP перерабатывает её внутри каждого токена.", "Выходной слой превращает итоговый вектор в оценку для каждого токена словаря."], idea:"Каждая часть — из уже пройденных уроков: Q·K, W и f, softmax."},
    {t:"num", q:"d = 64. Сколько нейронов в расширенном слое MLP, если он в 4 раза шире?", a:256, hint:"4 × d.", why:"4 × 64 = 256.", steps:["Ширина вектора d = 64.", "MLP сначала расширяет его в 4 раза: 4 · 64 = 256.", "Потом сжимает обратно до 64."], idea:"Расширение даёт токену «место для размышлений», а сжатие возвращает привычную форму для следующего блока."},
    {t:"tf", q:"Блок меняет форму данных, поэтому блоки нельзя ставить подряд.", a:false, hint:"Сравните форму на входе и выходе.", why:"Форма не меняется (T × d), поэтому блоки ставят стопкой сколько угодно.", steps:["На входе блока: T токенов × d чисел.", "На выходе — та же форма T × d.", "Значит, выход одного блока подходит как вход следующего — их можно ставить сколько угодно."], idea:"Одинаковая форма — ключ к масштабу: хотите модель умнее — добавьте блоков."}
  ]},

{ stage:4, g:"+", title:"+ — остаточная связь", short:"Два трюка, которые делают глубокую сеть обучаемой",
  need:"Если поставить много блоков подряд, сигнал по дороге портится, и сеть перестаёт учиться. Два простых трюка — остаточная связь и нормализация — делают глубокую стопку обучаемой.",
  real:"Без этих трюков не было бы ни GPT, ни ChatGPT: именно они позволяют ставить десятки блоков друг на друга. Остаточные связи и нормализация есть в каждом блоке больших языковых моделей.",
  intro:[
    "Если просто поставить 50 блоков подряд, сигнал и градиенты будут затухать или взрываться, и сеть не научится.",
    "<b>Остаточная связь</b>: x = x + блок(x). Блок не заменяет вход, а добавляет к нему поправку. Информация и градиенты текут по «скоростной трассе» напрямую, в обход блоков.",
    "<b>Нормализация</b> (LayerNorm): перед каждой частью блока числа вектора приводят к среднему 0 и разбросу 1. Так значения не уплывают в огромные или крошечные.",
    "Внутри блока: x = x + внимание(норм(x)), затем x = x + MLP(норм(x))."
  ],
  sym:[["x + блок(x)","вход + поправка","[1; 2] + [0,5; −1] = [1,5; 1]"],["LayerNorm","среднее 0, разброс 1","[2; 4; 6] → [−1,22; 0; 1,22]"]],
  ex:{t:"Почему сумма помогает", s:[
    ["блок(x) = 0","Даже если блок пока ничего не умеет, выход = x: информация не теряется."],
    ["градиент проходит через «+»","Сложение передаёт градиент как есть (урок ∂), и он доходит до первых слоёв."],
    ["норм([2, 4, 6]) = [−1,22; 0; 1,22]","Вычли среднее 4, поделили на разброс."],
    ["итог","Глубокие стопки блоков учатся стабильно."]]},
  analog:"Остаточная связь — как правка документа в режиме рецензирования: исходный текст остаётся, а поверх добавляются исправления. Плохая правка не уничтожает оригинал.",
  src:"Принс, гл. 11 (остаточные сети) и гл. 12. Рашка, гл. 4 (shortcut-соединения, LayerNorm).",
  tasks:[
    {t:"num", q:"x = [1; 2], блок(x) = [0,5; −1]. Чему равна вторая координата x + блок(x)?", a:1, hint:"2 + (−1).", why:"2 − 1 = 1.", steps:["Складываем по координатам. Вторая координата: у x — 2, у блока — (−1).", "2 + (−1) = 1.", "(Первая координата: 1 + 0,5 = 1,5.)"], idea:"Блок не заменяет вход, а добавляет к нему поправку. Сам вход сохраняется."},
    {t:"mc", q:"Зачем нужна остаточная связь?", o:["Информация и градиенты проходят напрямую, и глубокую сеть легче обучать","Чтобы модель занимала меньше места","Чтобы удалить старую информацию","Чтобы перемешать токены"], a:0, hint:"Вспомните «скоростную трассу».", why:"Без неё сигнал в глубокой сети затухает.", steps:["В глубокой сети сигнал проходит через десятки блоков и может «стереться».", "Остаточная связь даёт обходную дорогу: x идёт напрямую, а блок лишь добавляет поправку.", "Градиенты по этой дороге тоже доходят до первых слоёв без потерь."], idea:"Как скоростная трасса рядом с извилистой дорогой: информация не теряется по пути."},
    {t:"num", q:"LayerNorm сначала вычитает среднее. Чему равно среднее вектора [2; 4; 6]?", a:4, hint:"(2 + 4 + 6) / 3.", why:"12 / 3 = 4.", steps:["Складываем: 2 + 4 + 6 = 12.", "Делим на количество чисел: 12 / 3 = 4."], idea:"LayerNorm вычитает среднее и делит на разброс — так числа всегда остаются «нормального» размера."},
    {t:"tf", q:"Если блок выдаёт нули, остаточная связь всё равно передаёт вход дальше.", a:true, hint:"x + 0 = ?", why:"x + 0 = x: информация не теряется.", steps:["Выход = x + блок(x).", "Если блок(x) = 0, то x + 0 = x.", "Вход проходит дальше без потерь."], idea:"Поэтому в начале обучения, пока блоки ещё ничего не умеют, сеть хотя бы не портит сигнал."},
    {t:"fill", q:"Допишите блок трансформера", code:"x = x [[0]] self.attn(self.ln1(x))\nx = x [[1]] self.mlp(self.[[2]](x))", blanks:["+","+","ln2"], pool:["*","ln1","-"], hint:"Обе части — с остаточной связью, у каждой своя нормализация.", why:"x = x + внимание(ln1(x)); x = x + MLP(ln2(x)).", steps:["Обе части блока — с остаточной связью: x = x + …", "Перед вниманием своя нормализация ln1, перед MLP — своя ln2.", "Итог: x = x + attn(ln1(x)), затем x = x + mlp(ln2(x))."], idea:"Две строки — и это весь блок GPT. Дальше его просто повторяют N раз."}
  ]},

{ stage:4, g:"N", title:"N — масштаб", short:"Сильнее = больше, при том же устройстве",
  need:"Устройство GPT собрано. Почему же одни модели умнее других? В основном из-за размера: больше блоков, шире векторы, длиннее контекст, больше данных.",
  real:"У GPT-2 (2019) было 1,5 млрд параметров, у GPT-3 (2020) — 175 млрд. Устройство блоков почти не изменилось — вырос масштаб. Современные модели ещё больше, хотя точные размеры часто не раскрывают.",
  intro:[
    "Чтобы модель стала умнее, её устройство менять не нужно. Крутят ручки масштаба: число блоков <b>N</b> (глубина), длину векторов <b>d</b> (ширина), длину контекста, объём данных.",
    "Параметры — это все обучаемые числа. Почти все они в блоках: примерно <b>12 · N · d²</b> (внимание даёт 4·d², MLP — 8·d²). Плюс таблица эмбеддингов: словарь × d.",
    "GPT-2 small: 12 блоков, d = 768, словарь 50 257 — около 124 млн параметров. GPT-2 XL: 48 блоков, d = 1600 — около 1,5 млрд.",
    "Правило практики: сначала добиться, чтобы маленькая модель училась, потом увеличивать по одной ручке и проверять ошибку."
  ],
  sym:[["N","число блоков","12"],["d","ширина: длина векторов","768"],["12 · N · d²","параметры в блоках","≈ 85 млн"],["словарь × d","параметры эмбеддингов","≈ 39 млн"]],
  ex:{t:"Считаем GPT-2 small", s:[
    ["12 · 12 · 768² ≈ 84,9 млн","Все блоки."],
    ["50 257 · 768 ≈ 38,6 млн","Таблица эмбеддингов токенов."],
    ["сумма ≈ 124 млн","Совпадает с настоящей GPT-2 small."],
    ["удвоить d → блоки × 4","Ширина входит в квадрате: самая «дорогая» ручка."]]},
  analog:"Как город: можно добавлять этажи (глубина), расширять дома (ширина), строить дальние дороги (контекст) и звать больше жителей (данные). План города тот же — меняется масштаб.",
  src:"Рашка, гл. 4 (подсчёт параметров GPT-2). Карпатый, nanoGPT. Принс, гл. 12.",
  tasks:[
    {t:"params", q:"Подберите число блоков и ширину, чтобы получилось от 100 до 150 млн параметров при словаре из частей слов.", hint:"Начните с ширины 768 и подберите блоки.", why:"Например, 12 блоков × 768 — это как раз GPT-2 small, 124 млн.", steps:["Почти все параметры сидят в блоках: примерно 12 · N · d².", "При d = 768 и N = 12: 12 · 12 · 768² ≈ 85 млн.", "Плюс таблица эмбеддингов: ≈ 50 000 · 768 ≈ 39 млн. Вместе ≈ 124 млн."], idea:"Вы собрали размер настоящей GPT-2 small. Для больших моделей расчёт тот же — только числа другие.", sol:"12 блоков, ширина 768, словарь ~50 000"},
    {t:"num", q:"Посчитайте 12 · N · d² при N = 2, d = 10.", a:2400, hint:"d² = 100.", why:"12 · 2 · 100 = 2400.", steps:["d² = 10 · 10 = 100.", "12 · 2 = 24.", "24 · 100 = 2400."], idea:"Формула 12 · N · d² позволяет за минуту прикинуть размер любой модели такого устройства."},
    {t:"mc", q:"Ширину d увеличили в 2 раза. Во сколько раз выросли параметры блоков?", o:["В 4 раза","В 2 раза","В 8 раз","Не изменились"], a:0, hint:"d входит в квадрате.", why:"(2d)² = 4d².", steps:["Параметры блоков ≈ 12 · N · d², и d входит в квадрате.", "Новая ширина 2d: (2d)² = 4 · d².", "Значит, параметров в 4 раза больше."], idea:"Ширина — самая «дорогая» ручка: её удвоение увеличивает модель вчетверо."},
    {t:"mc", q:"Как правильно масштабировать модель?", o:["Добиться, чтобы маленькая училась, потом увеличивать по одной ручке","Сразу сделать самую большую","Увеличить всё в 100 раз одновременно","Убрать проверочные данные"], a:0, hint:"Как понять, какая ручка помогла?", why:"По одной ручке — видно, что помогает, а что ломает.", steps:["Если менять всё сразу и что-то сломалось, непонятно, что именно.", "Сначала убеждаемся, что маленькая модель учится.", "Потом растим по одной ручке и смотрим на ошибку."], idea:"Так работают и создатели больших моделей: сначала опыты на маленьких, потом — дорогое большое обучение."},
    {t:"tf", q:"Чтобы сделать GPT сильнее, обязательно нужно придумать новое устройство блоков.", a:false, hint:"Чем отличаются GPT-2 small и XL?", why:"Устройство то же, растёт размер.", steps:["GPT-2 small и GPT-2 XL устроены одинаково.", "Отличаются только числа: блоков 12 и 48, ширина 768 и 1600.", "Сила растёт за счёт размера и данных."], idea:"Главный урок последних лет в ИИ: простое устройство плюс огромный масштаб работают удивительно хорошо."}
  ]},

{ stage:4, g:"P", title:"P — обучение в PyTorch", short:"Данные со сдвигом и цикл из четырёх строк",
  need:"Модель собрана, осталось её обучить. Нужно приготовить данные (вход и правильные ответы), выбрать ошибку для вероятностей и запустить уже знакомый цикл — теперь в PyTorch.",
  real:"Этот этап называется предобучением: модель читает огромные объёмы текста и учится угадывать следующий токен. С него начинался и ChatGPT. Потом его ещё дообучали на диалогах и оценках людей, чтобы он отвечал как помощник.",
  intro:[
    "Данные для GPT готовят просто: берут кусок текста длиной ctx — это вход <b>x</b>. Тот же кусок, сдвинутый на один токен вперёд, — правильные ответы <b>y</b>. Модель учится угадывать следующий токен сразу во всех позициях.",
    "Ошибка — <b>кросс-энтропия</b>: −log(вероятность правильного токена). Модель дала правильному токену 100% — ошибка 0. Дала 1% — ошибка большая (≈ 4,6).",
    "Цикл в PyTorch: logits, loss = model(x, y) → optimizer.zero_grad() → loss.backward() → optimizer.step(). Это тот же цикл из этапа 1.",
    "Оптимизатор <b>AdamW</b> — улучшенный спуск: он сам подстраивает длину шага для каждой ручки и помнит направление прошлых шагов, как мяч с инерцией."
  ],
  sym:[["x","вход: кусок текста","«приве»"],["y","ответы: сдвиг на 1","«ривет»"],["cross_entropy","−log P(правильного)","P = 50% → 0,69"],["AdamW","оптимизатор","lr = 0,001"]],
  ex:{t:"Пары из слова «привет», ctx = 5", s:[
    ["x = «приве»","5 токенов на вход."],
    ["y = «ривет»","Для каждой позиции — следующая буква."],
    ["по «п» угадать «р» … по «приве» угадать «т»","5 заданий из одного куска."],
    ["loss = среднее −log P","Обратный проход и шаг AdamW."]]},
  analog:"Тренировка с карточками: на лицевой стороне начало фразы, на обороте — следующее слово. Из одной книги получаются миллионы таких карточек.",
  src:"Рашка, гл. 5 (предобучение, кросс-энтропия, цикл обучения). Карпатый, «Let's build GPT» (get_batch со сдвигом).",
  tasks:[
    {t:"mc", q:"Текст «кошка», ctx = 4. Вход x = «кошк». Каким будет y?", o:["«ошка»","«кошк»","«кошка»","«к»"], a:0, hint:"Сдвиг на один токен вперёд.", why:"Каждая буква x должна угадать следующую: к→о, о→ш, ш→к, к→а.", steps:["y — тот же кусок текста, сдвинутый на одну букву вперёд.", "x = «кошк» → y = «ошка».", "Каждая буква x угадывает следующую: к→о, о→ш, ш→к, к→а."], idea:"Из куска длиной 4 получаются сразу 4 задачи. Поэтому обучение на текстах такое выгодное."},
    {t:"order", q:"Шаг обучения в PyTorch: расставьте по порядку", items:["model(x, y) — прогноз и ошибка","zero_grad() — стереть старые градиенты","loss.backward() — новые градиенты","step() — сдвинуть ручки"], why:"Тот же цикл, что в этапе 1, только детали делает PyTorch.", steps:["model(x, y) — прогноз и сразу ошибка.", "zero_grad() — стираем старые градиенты.", "loss.backward() — считаем новые.", "step() — двигаем ручки."], idea:"Тот же цикл, что в этапе 1: прогноз → ошибка → градиент → шаг. Изменились только названия."},
    {t:"num", q:"Модель дала правильному токену вероятность 100%. Чему равна кросс-энтропия?", a:0, hint:"log(1) = ?", why:"−log(1) = 0: модель была полностью уверена и права.", steps:["Кросс-энтропия = −log(вероятность правильного токена).", "Вероятность 100% — это 1. log(1) = 0.", "−0 = 0: ошибки нет."], idea:"Модель уверена и права — штрафа нет. Чем меньше вероятность правильного ответа, тем больше штраф."},
    {t:"mc", q:"Модель A дала правильному токену 90%, модель B — 10%. У кого ошибка меньше?", o:["У A","У B","Одинаковая","Зависит от температуры"], a:0, hint:"Чем увереннее в правильном, тем меньше −log P.", why:"−log(0,9) ≈ 0,1, а −log(0,1) ≈ 2,3.", steps:["Ошибка = −log P. Чем ближе P к 1, тем ближе ошибка к 0.", "A: −log(0,9) ≈ 0,1 — маленькая.", "B: −log(0,1) ≈ 2,3 — большая."], idea:"Кросс-энтропия штрафует за неуверенность в правильном ответе. Именно эту ошибку уменьшают при обучении языковых моделей."},
    {t:"fill", q:"Допишите сдвиг в get_batch", code:"x = torch.stack([src[i : i + ctx] for i in ix])\ny = torch.stack([src[i + [[0]] : i + ctx + [[1]]] for i in ix])", blanks:["1","1"], pool:["0","2","ctx"], hint:"Ответы — тот же кусок на один токен правее.", why:"y начинается на 1 позже и заканчивается на 1 позже.", steps:["x — кусок текста с позиции i до i + ctx.", "y — тот же кусок на один токен правее: с i + 1 до i + ctx + 1.", "Тогда на каждом месте y стоит токен, следующий за токеном x."], idea:"Одна единица в индексе — и у нас готовые пары «вопрос — ответ» из любого текста."}

// from — с какого предложения подпись стартового шага, mini — короткая панель в окне задачи (одно предложение шага, без ручек, плашек, точек и примеров из книг;
// в шапке шага «Теория ↗» → opt.onTheory(шаг))
function renderStand(L, host, opt = {}){
  // сцена может служить нескольким урокам: режим (mode) задаёт свои плашки, ползунки и кнопки;
  // урок может переопределить их и сам (поля vals, ctrl, acts в stand)
  const cfg = L.stand, base = SCENES[cfg.scene], steps = cfg.steps, life = alive;
  const sc = Object.assign({}, base, base.modes && base.modes[cfg.mode] || {});
  ["vals","ctrl","acts"].forEach(k => { if (cfg[k]) sc[k] = cfg[k]; });

  const ctrls = [].concat(sc.ctrl || []);
  const ctrlHTML = ctrls.map((c, i) => c.opts

    <div class="st-scene" id="stScene">${sc.svg}${opt.mini ? "" : `<button class="st-fs" id="stFs" aria-label="На весь экран">${ST_ICO.open}</button>`}</div>
    <div class="st-vals">${sc.vals.map(([k,l,col,tx],i) => `<div class="st-v" style="--c:var(${col})"><div class="l"><b>${esc(k)}</b> ${esc(l)}</div><div class="v${tx?" tx":""}" id="stV${i}"></div></div>`).join("")}</div>

  const ctl = {};

  E.setCtrl = (k, v) => { const c = ctl[k]; if (!c) return; if (c.sl) c.sl.value = v; else c.btns.forEach(b => { const on = b.dataset.v === String(v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); };

    fsb.innerHTML = on ? ST_ICO.close : ST_ICO.open; fsb.setAttribute("aria-label", on ? "Свернуть" : "На весь экран");
    requestAnimationFrame(E.relayout);
  };

  show(opt.step || 0);

/* ---------- Сцена «Долина в тумане»: ошибка L(w) = (w − 3)², путник = ручка w ----------

  },

  init(E){

    const bez = (A, u) => [(1-u)**2 * A.xa + 2*u*(1-u) * A.cx + u*u * A.xb, (1-u)**2 * A.ya + 2*u*(1-u) * A.cy + u*u * A.yb];

    let trKey = "", bdKey = "";

      sa("arrG", {opacity: showArr ? 1 : 0});

      const gs = g < -0.004 ? "(" + f2(g) + ")" : f2(g), r2 = `${f2(w)} − ${f2(st.eta)} · ${gs} = ${f2(wn)}${out ? " → за край" : ""}`;
      const l1 = "η = " + f2(st.eta) + "   L: " + chain, l2 = "w − η·∇ = " + r2, bw = Math.max(l1.length * 6.3, l2.length * 6.6) + 16;

          const r = sd > 0 ? [cx, cy - 10, cx + tw, cy + 2] : [cx - tw, cy - 10, cx, cy + 2];

    if (ETA) return {
      draw,
      async step(s, id){
        st.tan = !!s.tan; st.jump = null; draw();
        for (const p of [].concat(s.go == null ? [] : s.go)){

          else { const a = st.eta; await anim(650, id, e => { st.eta = a + (p.eta - a) * e; }); st.eta = p.eta; draw(); }
        }

      slide(v){ st.eta = v; st.tan = false; path(); draw(true); },
      action(a, id){
        st.tan = false; st.jump = null;
        if (a === "run" || st.exitU > 0 || Math.abs(st.w - 3) < 0.02){ reset(); draw(); }
        if (a === "run") run(id); else jump(id);
      }
    };
    return {
      draw,
      async step(s, id){
        st.tan = !!s.tan; st.arr = !!s.arr; st.fog = s.fog !== false; draw();
        const plan = s.go == null ? [] : [].concat(s.go);

      slide(v){ st.ph += Math.abs(v - st.w) * 7; st.moving = 0; st.w = v; st.tan = st.arr = true; draw(true); },
      action(a, id){ st.tan = st.arr = true; draw(); if (a === "step") stepOnce(id); else descend(id); }
    };
  }
};

      if (!E.live(id)) return;
      reset(); draw();
    }
    async function movePin(p, id){
      await clear(id); if (!E.live(id)) return;
      const a = st.pin.slice(), dist = Math.hypot(p[0] - a[0], p[1] - a[1]); st.pinOn = true;
      if (dist > 0.01) await anim(Math.min(900, 300 + 110 * dist), id, e => { st.pin = [a[0] + (p[0] - a[0]) * e, a[1] + (p[1] - a[1]) * e]; });
      if (E.live(id)){ st.pin = p.slice(); draw(); }
    }
    async function one(id, k){   // эксперты по очереди: столбец за столбцом
      const N = cur().W.length, [, H] = ZH();
      for (let j = 0; j < N; j++){
        if (!E.live(id)) return;
        await anim(260 * k, id, e => { st.hl[j] = e; if (j) st.hl[j - 1] = 1 - e; });
        if (!E.live(id)) return;

        await anim(420 * k, id, e => { st.hand[j] = t * e; });

    }
    async function all(id){   // одна команда: все столбцы разом
      const N = cur().W.length, [, H] = ZH();
      await anim(300, id, e => { for (let j = 0; j < N; j++) st.hl[j] = e; });
      if (!E.live(id)) return;
      st.done.fill(1); const T = Array.from({length: 6}, (_, j) => j < N ? tgt(j, H) : 0);
      await anim(450, id, e => { for (let j = 0; j < 6; j++) st.hand[j] = T[j] * e; });
      if (!E.live(id)) return;
      await E.wait(450);
      await anim(260, id, e => { for (let j = 0; j < N; j++) st.hl[j] = 1 - e; });
    }
    async function chief(id){   // отчёты летят старшему, он поднимает табличку
      if (st.cfg !== "ring") return;

      st.fly = new Array(6).fill(0);

      const N = cur().W.length;
      for (let j = 0; j < N; j++){ if (!E.live(id)) return; await anim(950, id, (_, p) => { st.hl[j] = Math.sin(p * Math.PI); }); }

      for (const p of plan){

        else if (p === "lay") await lay(id);
        else if (p === "scan") await scan(id);
        else if (p === "one") await one(id, 1);
        else if (p === "one2") await one(id, 0.75);
        else if (p === "all") await all(id);
        else if (p === "chief") await chief(id);
        else if (p === "full"){ full(); draw(); }
        else if (p.N != null) setN(p.N);
        else if (p.pin) await movePin(p.pin, id);

    }
