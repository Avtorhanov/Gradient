<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Градиент — от одной формулы до своей GPT</title>
<meta name="description" content="Игра для изучения нейросетей с нуля: 24 урока, 128 задач, от формулы w·x + b до своей мини-GPT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one narrow column on graph paper; the course map is a 4-layer network, one band per stage */
  --paper:#E6EBF0; --card:#F8FAFC; --ink:#131B26; --muted:#586474; --line:#C6CFD9;
  --accent:#D4470C; --cool:#1F6CB0; --good:#2B8A3E; --bad:#C0392B; --codebg:#EEF2F6;
  --grid:rgba(31,108,176,.08); --band:rgba(31,108,176,.045);
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D131B; --card:#151E2A; --ink:#E4EAF1; --muted:#8B98A8; --line:#283547;
    --accent:#FF7A3D; --cool:#5AA8EA; --good:#55C26B; --bad:#FF6B5E; --codebg:#101823;
    --grid:rgba(90,168,234,.07); --band:rgba(90,168,234,.05); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D131B; --card:#151E2A; --ink:#E4EAF1; --muted:#8B98A8; --line:#283547;
  --accent:#FF7A3D; --cool:#5AA8EA; --good:#55C26B; --bad:#FF6B5E; --codebg:#101823;
  --grid:rgba(90,168,234,.07); --band:rgba(90,168,234,.05); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
html.noscroll,html.noscroll body{overflow:hidden}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
#app{max-width:720px;margin:0 auto;padding:16px 16px 72px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--cool)}
button,input,textarea,select,a,.node,label{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row.two > *{flex:1}
.next{display:flex;justify-content:flex-end;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;text-decoration:none;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.pill{font-size:12px;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-family:var(--f-body);font-weight:500}
.pill.ok{background:var(--good);border-color:var(--good);color:#fff}
.pill.cur{border-color:var(--accent);color:var(--accent)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:14px;color:var(--muted)}
.xp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-size:15px}
.glyph{display:inline-grid;place-items:center;flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:19px;line-height:1}
.glyph.g2{font-size:15px}.glyph.g3{font-size:12px}
.glyph.big{width:52px;height:52px;border-radius:14px;font-size:24px}
.glyph.big.g2{font-size:19px}.glyph.big.g3{font-size:15px}
.glyph.huge{width:84px;height:84px;border-radius:22px;font-size:40px}
.glyph.huge.g3{font-size:24px}

/* главная */
.hero{padding:6px 0 2px}
.hero h1{font-size:clamp(28px,8vw,44px);letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:60ch;margin:10px 0 0}
.map{margin:16px -4px 0}
.map svg{display:block;width:100%;height:auto}
.map .band{fill:var(--band);stroke:var(--line);stroke-width:1}
.map .band.cur{stroke:var(--accent);stroke-width:1.6}
.map .shead circle{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.map .shead text{font-family:var(--f-display);font-weight:700;font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.map .shead.cur circle{fill:var(--ink)} .map .shead.cur text{fill:var(--paper)}
.map .shead.done circle{fill:var(--accent);stroke:var(--accent)} .map .shead.done text{fill:#fff}
.map .sname{font-family:var(--f-display);font-weight:700;font-size:12px;fill:var(--ink);text-anchor:middle;letter-spacing:.02em}
.map .sprog{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted);text-anchor:middle}
.map .e{stroke:var(--line);stroke-width:.7;opacity:.75}
.map .e.on{stroke:var(--accent);opacity:.35}
.map .p{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;opacity:.8}
.map .p.on{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:none;opacity:1}
.map .node{cursor:pointer;outline:none}
.map .node .c{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.map .node text{font-family:var(--f-mono);font-weight:600;font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .node text.g2{font-size:12.5px}.map .node text.g3{font-size:10px}
.map .node.done .c{fill:var(--accent);stroke:var(--accent)} .map .node.done text{fill:#fff}
.map .node.cur .c{stroke:var(--accent);stroke-width:3}
.map .node.lock .c{fill:var(--paper);stroke:var(--line);stroke-dasharray:3 3}
.map .node.lock text{fill:var(--muted);opacity:.55}
.map .node.sel .c{stroke:var(--cool);stroke-width:3.2}
.map .node.done.sel .c{stroke:var(--cool)}
.map .pulse{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.85}to{transform:scale(1.7);opacity:0}}
.nodeinfo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 14px;flex-wrap:wrap}
.ni-t{flex:1 1 160px;display:flex;flex-direction:column;min-width:0;line-height:1.35}
.ni-t small{color:var(--muted);font-size:12px}
.ni-t b{font-size:15.5px}
.ni-t span{font-size:13.5px;color:var(--muted)}
.now{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.now-t{display:flex;gap:12px;align-items:center}
.now h2{font-size:21px}
.now p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.prog{height:6px;background:var(--codebg);border-radius:4px;margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog-l{font-size:13px;color:var(--muted)}
.tlist{list-style:none;padding:0;margin:12px 0 4px;display:grid;gap:6px}
.ti{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 10px}
.ti .tn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border:1.5px solid var(--line)}
.ti .tl{font-size:14px;line-height:1.35;color:var(--muted);min-width:0}
.ti .tl b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.ti.done .tn{background:var(--accent);border-color:var(--accent);color:#fff}
.ti.cur{border-color:var(--accent)} .ti.cur .tn{border-color:var(--accent);color:var(--accent)}
.ti[disabled]{opacity:.45;cursor:default}
.review-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;margin:14px 0}
.review-card .rc-l{font-size:13px;opacity:.75}
.review-card b{font-family:var(--f-display);font-size:19px}
.review-card button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap;min-height:44px}
.review-card button[disabled]{opacity:.45;cursor:default}
.srcs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.srcs summary{cursor:pointer;font-weight:600}
.srcs p{font-size:14px;color:var(--muted)}
.srow{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.srow span{color:var(--muted)}
.foot{color:var(--muted);font-size:13px;margin-top:20px}

/* урок */
.lhead{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.lhead small{color:var(--muted);font-size:12.5px;display:block;margin-bottom:2px}
.lhead h1{font-size:clamp(21px,5.6vw,28px)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg2 button{border:0;background:none;border-radius:9px;padding:10px;font-weight:600;font-size:15px}
.seg2 button.on{background:var(--ink);color:var(--paper)}
.intro p{margin:0 0 10px;max-width:65ch}
.blk{font-size:15px;margin:20px 0 8px}
.symtab{display:grid;gap:6px}
.sr{display:grid;grid-template-columns:104px 1fr;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.sy{font-family:var(--f-mono);font-weight:600;color:var(--accent);grid-row:span 2;align-self:center;overflow-wrap:anywhere}
.sm{font-size:15px}
.se{font-size:13.5px;color:var(--muted);font-family:var(--f-mono)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 42px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--cool);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.steps code{font-family:var(--f-mono);font-size:14px;background:var(--codebg);padding:2px 6px;border-radius:6px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.steps p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.analog{border-left:4px solid var(--cool);background:var(--card);padding:12px 14px;border-radius:0 12px 12px 0;margin-top:16px}
.analog b{display:block;font-size:13px;color:var(--cool);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.src{font-size:13.5px;color:var(--muted);margin-top:12px}
.tdots{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tdots button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:13px}
.tdots button.done{background:var(--accent);border-color:var(--accent);color:#fff}
.tdots button.cur{box-shadow:0 0 0 2.5px var(--ink)}
.tdots button.fin{border-color:var(--accent);color:var(--accent)}
.tdots button[disabled]{opacity:.35;cursor:default}

/* окно задачи */
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.task.fs{position:fixed;inset:0;z-index:60;border-radius:0;border:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--paper)}
.task.fs > *{max-width:860px;margin-left:auto;margin-right:auto}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tlabel{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:4px;margin-left:auto}
.tools button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 9px;font-size:13px;min-height:34px}
.tools button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools [data-tool="fs"]{font-size:16px;min-width:38px}
.tq{font-weight:600;font-size:17px;line-height:1.4;margin:8px 0 10px}
.tpanel{background:var(--codebg);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-bottom:10px}
.tpanel .symtab{margin-top:8px}
.tpanel .sr{background:var(--card)}
.tfb:empty{display:none}
.fbx{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--codebg);font-size:15px}
.fbx b{display:block;margin-bottom:2px}
.fbx.ok{border-left:4px solid var(--good)} .fbx.ok b{color:var(--good)}
.fbx.no{border-left:4px solid var(--bad)} .fbx.no b{color:var(--bad)}
.fbx.sol{border-left:4px solid var(--cool)} .fbx.sol b{color:var(--cool)}
.fbx small{color:var(--muted)}
.tact{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.tact:empty{display:none}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;font-size:15.5px;min-height:48px}
.opts.two .opt{text-align:center;font-weight:600}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt[disabled]{cursor:default}
.qcode{background:var(--codebg);border-radius:8px;padding:10px;font-family:var(--f-mono);font-size:14px;overflow-x:auto;margin:0 0 10px}
.numbox{display:flex;align-items:center;font-family:var(--f-mono);font-size:26px;border:1.5px solid var(--ink);border-radius:12px;padding:6px 14px;min-height:54px;background:var(--paper);max-width:360px}
.numbox .ph{color:var(--muted);font-size:16px;font-family:var(--f-body)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;max-width:360px}
.keypad button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:19px}
.keypad button:active{background:var(--codebg)}
.keypad .wide{grid-column:span 2}
.ord-ans{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:o}
.ord-ans li{counter-increment:o;border:1.5px dashed var(--line);border-radius:10px;padding:9px 12px 9px 40px;position:relative;min-height:42px;font-size:15px}
.ord-ans li::before{content:counter(o);position:absolute;left:14px;top:9px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.ord-ans li.f{border-style:solid;border-color:var(--ink)}
.ord-ans li.right{border-style:solid;border-color:var(--good)}
.ord-ans li.wrong{border-style:solid;border-color:var(--bad)}
.ord-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1.5px solid var(--ink);background:var(--paper);border-radius:9px;padding:9px 12px;font-size:15px;text-align:left;min-height:42px}
.chip[disabled]{opacity:.22;cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:grid;gap:6px;align-content:start}
.mbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;text-align:left;min-height:48px;font-size:15px}
.mbtn.sel{border-color:var(--cool);box-shadow:0 0 0 2px color-mix(in srgb,var(--cool) 35%,transparent)}
.mbtn.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card));opacity:.75}
.mbtn.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fillcode{font-family:var(--f-mono);font-size:15px;background:var(--codebg);border-radius:10px;padding:12px;white-space:pre-wrap;line-height:2.2;overflow-x:auto;overflow-wrap:anywhere}
.blank{font-family:var(--f-mono);font-size:15px;border:1.5px dashed var(--accent);border-radius:6px;padding:2px 8px;background:var(--card);color:var(--ink);min-height:30px}
.blank.sel{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.blank.filled{border-style:solid;border-color:var(--ink)}
.blank.bad{border-color:var(--bad);color:var(--bad)}
.plot{width:100%;display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.plot.sq{margin:10px auto 0}
.formula{font-family:var(--f-mono);font-size:14.5px;margin:10px 0;background:var(--codebg);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--accent)} .formula b.fixed{color:var(--muted)}
.slider{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.slider input{width:100%;accent-color:var(--accent);height:28px}
.slider output{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.meter{display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.meter b{font-family:var(--f-mono);font-size:21px;font-variant-numeric:tabular-nums}
.good{color:var(--good)!important}
.status{min-height:22px;margin:8px 0;font-weight:500;font-size:15px}
.status.good{color:var(--good)} .status.bad{color:var(--bad)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13.5px;color:var(--muted);margin:8px 0}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.pos{color:var(--bad)} .neg{color:var(--cool)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 11px;font-family:var(--f-mono);font-size:14px;min-height:38px}
.seg button.on{background:var(--cool);border-color:var(--cool);color:#fff}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px}
.tbl tr.okr td{color:var(--good)}
.graph svg{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.gnode rect{fill:var(--card);stroke:var(--ink);stroke-width:1.3}
.gnode.lit rect{stroke:var(--accent);stroke-width:2.6}
.gnode .nm{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.gnode .vl{font-family:var(--f-mono);font-size:13px;font-weight:600;fill:var(--ink)}
.gnode .gr{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.gnode.has .gr,.gnode.lit .gr{fill:var(--accent);font-weight:600}
.gedge{stroke:var(--line);stroke-width:1.6}
.explain{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.emap text{font-size:13px;fill:var(--ink);font-family:var(--f-body);pointer-events:none}
.emap g{cursor:pointer}
.emap circle{fill:var(--cool)}

<script type="text/plain" id="code-mse">
xs = [10, 15, 20, 25, 30, 35]          # температура
ys = [110, 160, 215, 260, 310, 365]    # реальные продажи
w, b = 10, 20

def predict(x):
    return w * x + b

# квадрат промаха для каждого дня
errors = [(predict(x) - y) ** 2 for x, y in zip(xs, ys)]
loss = sum(errors) / len(errors)       # среднее = MSE
print("Квадраты промахов:", errors)
print("Ошибка (MSE):", loss)
</script>
<script type="text/plain" id="code-gdbug">
xs = [1, 2, 3, 4, 5]
ys = [3, 5, 7, 9, 11]      # правда: y = 2x + 1, но модель этого не знает
w, b = 0.0, 0.0            # начинаем с нулей
lr = 0.05                  # скорость обучения (длина шага)

for step in range(1001):
    # 1) прогноз и 2) градиенты ошибки по w и по b
    dw = db = 0
    for x, y in zip(xs, ys):
        err = (w * x + b) - y
        dw += 2 * err * x / len(xs)
        db += 2 * err / len(xs)
    # 3) шаг (здесь ошибка в знаках!)
    w += lr * dw
    b += lr * db
    if step % 200 == 0:
        loss = sum(((w * x + b) - y) ** 2 for x, y in zip(xs, ys)) / len(xs)
        print(f"шаг {step}: w={w:.2f}, b={b:.2f}, ошибка={loss:.4f}")
</script>
<script type="text/plain" id="code-value">
class Value:
    """Число, которое помнит, откуда оно взялось."""
    def __init__(self, data, parents=()):
        self.data = data
        self.grad = 0.0
        self._parents = parents
        self._backward = lambda: None

    def __add__(self, other):
        out = Value(self.data + other.data, (self, other))
        def _backward():               # сложение: градиент проходит как есть
            self.grad += out.grad
            other.grad += out.grad
        out._backward = _backward
        return out

    def __mul__(self, other):
        out = Value(self.data * other.data, (self, other))
        def _backward():               # умножение: × на соседа
            self.grad += other.data * out.grad
            other.grad += self.data * out.grad
        out._backward = _backward
        return out

    def backward(self):
        # выстраиваем узлы от начала к концу, потом идём назад
        order, seen = [], set()
        def build(v):
            if v not in seen:
                seen.add(v)
                for p in v._parents:
                    build(p)
                order.append(v)
        build(self)
        self.grad = 1.0
        for v in reversed(order):
            v._backward()

a, b, c, f = Value(2.0), Value(-3.0), Value(10.0), Value(-2.0)
L = (a * b + c) * f
L.backward()
print("L =", L.data)
for name, v in zip("abcf", [a, b, c, f]):
    print(f"градиент {name}: {v.grad}")
</script>
<script type="text/plain" id="code-attn">
import numpy as np
np.random.seed(1)

T, d = 4, 8                      # 4 токена, у каждого вектор из 8 чисел
x = np.random.randn(T, d)        # эмбеддинги токенов

# Три обучаемые матрицы делают из токена запрос, ключ и значение
Wq, Wk, Wv = (np.random.randn(d, d) / np.sqrt(d) for _ in range(3))
Q, K, V = x @ Wq, x @ Wk, x @ Wv

scores = Q @ K.T / np.sqrt(d)    # совпадение каждого запроса с каждым ключом

mask = np.triu(np.ones((T, T)), k=1).astype(bool)
scores[mask] = -np.inf           # запрещаем смотреть в будущее

def softmax(z):
    e = np.exp(z - z.max(axis=1, keepdims=True))
    return e / e.sum(axis=1, keepdims=True)

weights = softmax(scores)        # доли внимания, в каждой строке сумма = 1
out = weights @ V                # смесь значений
print("Доли внимания:")
print(weights.round(2))
print("Размер выхода:", out.shape)

<script type="text/plain" id="code-gpt">
import os
import torch, torch.nn as nn, torch.nn.functional as F

# ===== 1. Данные и токенизация =====
# Загрузите в Colab любой русский текст как input.txt (чем больше, тем лучше)
if os.path.exists("input.txt"):
    text = open("input.txt", encoding="utf-8").read()
else:
    text = "Мама мыла раму, а кот смотрел в окно. " * 400   # заглушка

chars = sorted(set(text))
stoi = {c: i for i, c in enumerate(chars)}
itos = {i: c for c, i in stoi.items()}
encode = lambda s: [stoi[c] for c in s]
decode = lambda ids: "".join(itos[i] for i in ids)

data = torch.tensor(encode(text))
n = int(0.9 * len(data))
train, val = data[:n], data[n:]          # 10% откладываем для проверки

# ===== 2. Ручки масштаба =====
ctx = 64          # сколько букв модель видит
d = 128           # длина векторов (ширина)
n_layers = 4      # число блоков (глубина)
n_heads = 4
batch = 32
device = "cuda" if torch.cuda.is_available() else "cpu"

def get_batch(split):
    src = train if split == "train" else val
    ix = torch.randint(len(src) - ctx - 1, (batch,))
    x = torch.stack([src[i:i + ctx] for i in ix])
    y = torch.stack([src[i + 1:i + ctx + 1] for i in ix])   # сдвиг на 1 букву
    return x.to(device), y.to(device)

# ===== 3. Модель =====
class Block(nn.Module):
    def __init__(self, d, n_heads):
        super().__init__()
        self.ln1 = nn.LayerNorm(d)
        self.attn = nn.MultiheadAttention(d, n_heads, batch_first=True)
        self.ln2 = nn.LayerNorm(d)
        self.mlp = nn.Sequential(nn.Linear(d, 4 * d), nn.GELU(), nn.Linear(4 * d, d))

    def forward(self, x):
        T = x.size(1)
        mask = torch.triu(torch.ones(T, T, dtype=torch.bool, device=x.device), 1)
        h = self.ln1(x)
        x = x + self.attn(h, h, h, attn_mask=mask)[0]
        x = x + self.mlp(self.ln2(x))
        return x

class MiniGPT(nn.Module):
    def __init__(self):
        super().__init__()
        self.tok = nn.Embedding(len(chars), d)    # токен → вектор
        self.pos = nn.Embedding(ctx, d)           # позиция → вектор
        self.blocks = nn.Sequential(*[Block(d, n_heads) for _ in range(n_layers)])
        self.ln = nn.LayerNorm(d)
        self.head = nn.Linear(d, len(chars))      # вектор → оценка каждой буквы

    def forward(self, idx, targets=None):
        T = idx.size(1)
        x = self.tok(idx) + self.pos(torch.arange(T, device=idx.device))
        logits = self.head(self.ln(self.blocks(x)))
        loss = None
        if targets is not None:
            loss = F.cross_entropy(logits.view(-1, logits.size(-1)), targets.view(-1))
        return logits, loss

    @torch.no_grad()
    def generate(self, idx, n_new, temperature=1.0):
        for _ in range(n_new):
            logits, _ = self(idx[:, -ctx:])
            probs = F.softmax(logits[:, -1] / temperature, dim=-1)
            nxt = torch.multinomial(probs, 1)
            idx = torch.cat([idx, nxt], dim=1)
        return idx

model = MiniGPT().to(device)
print(sum(p.numel() for p in model.parameters()), "параметров")

# ===== 4. Обучение: прогноз → ошибка → градиенты → шаг =====
opt = torch.optim.AdamW(model.parameters(), lr=1e-3)
for step in range(3001):
    x, y = get_batch("train")
    _, loss = model(x, y)
    opt.zero_grad()
    loss.backward()
    opt.step()
    if step % 500 == 0:
        with torch.no_grad():
            _, vloss = model(*get_batch("val"))
        print(f"шаг {step}: обучение {loss.item():.3f}, проверка {vloss.item():.3f}")

# ===== 5. Генерация =====
start = torch.tensor([encode(text[:1])], device=device)
print(decode(model.generate(start, 300)[0].tolist()))
</script>

  ex:{t:"Собираем прогноз по шагам", s:[

  src:"Принс, гл. 2 (параметр φ₀ — пересечение с осью). Гудфеллоу и соавторы, «Глубокое обучение», гл. 5 (линейная регрессия и смещение).",

    {t:"num", q:"Такси: ŷ = 30·x + 100, где x — километры. Сколько стоит поездка на 0 км?", a:100, hint:"Подставьте x = 0.", why:"30·0 + 100 = 100. Это и есть сдвиг b."},
    {t:"num", q:"ŷ = 4·x + 7. Чему равен прогноз при x = 5?", a:27, hint:"Сначала w·x, потом прибавьте b.", why:"4·5 = 20, плюс 7 — получается 27."},
    {t:"match", q:"Соедините части модели ŷ = w·x + b", pairs:[["w","наклон линии"],["b","высота линии при x = 0"],["x","вход"],["ŷ","прогноз"]], why:"Две ручки (w, b), вход (x) и результат (ŷ)."},
    {t:"fit", q:"Теперь обе ручки ваши. Подберите w и b, чтобы линия легла на точки.", data:"B", ctrl:["w","b"], init:{w:4,b:150}, goal:30, hint:"Сначала наклон w (около 10), потом сдвиг b.", why:"w = 10, b ≈ 10: линия почти проходит через все точки.", sol:"w = 10, b = 10"},
    {t:"code", q:"Измените w и b, чтобы модель предсказала ровно 300 порций при 25°. Нажмите «Проверить».", src:"w = 10\nb = 20\nx = 25\nprint(w * x + b)\n", hint:"Например, оставьте w = 10 и подберите b. 10·25 = 250.", sol:"w = 10, b = 50 (или w = 12, b = 0)", why:"Подходит любая пара, где w·25 + b = 300.",
     check:{out:o => Math.abs(parseFloat(o.trim()) - 300) < 1e-9, code:c => { const w = num(c,/^\s*w\s*=\s*(-?[\d.]+)/m), b = num(c,/^\s*b\s*=\s*(-?[\d.]+)/m); return w != null && b != null && Math.abs(w*25 + b - 300) < 1e-9; }}}
  ]},

{ stage:1, g:"L", title:"L — ошибка", short:"Одно число: насколько модель промахнулась",
  intro:[
    "Чтобы улучшить модель, сначала надо измерить, насколько она плоха. Для этого считают ошибку — функцию потерь (loss). Её обозначают <b>L</b>.",
    "Шаг 1 — промах: <b>ŷ − y</b>. Прогноз 270, а продали 265 — промах +5. Прогноз 250 — промах −15.",
    "Шаг 2 — квадрат промаха. Минус пропадает, а большие промахи штрафуются сильнее: промах 2 даёт штраф 4, промах 10 — уже 100.",
    "Шаг 3 — среднее по всем примерам. Это <b>MSE</b>, средняя квадратичная ошибка. Ноль — идеально. Цель обучения — сделать L как можно меньше."
  ],
  sym:[["ŷ − y","промах на одном примере","270 − 265 = 5"],["(ŷ − y)²","штраф за промах","5² = 25"],["L (MSE)","среднее всех штрафов","(25 + 9) / 2 = 17"]],
  ex:{t:"Ошибка за два дня", s:[
    ["День 1: ŷ = 270, y = 265","Промах +5, штраф 5² = 25."],
    ["День 2: ŷ = 200, y = 203","Промах −3, штраф (−3)² = 9."],
    ["L = (25 + 9) / 2 = 17","Средний штраф за два дня."],
    ["Цель: L → 0","Чем ближе L к нулю, тем точнее модель."]]},
  analog:"Дартс: каждый бросок мимо центра даёт штраф, и дальние промахи наказываются особенно сильно. Счёт игрока — средний штраф. Хороший игрок тот, у кого он меньше.",
  src:"Траск, гл. 4 (шаг «сравнить»: средняя квадратичная ошибка). Принс, гл. 2 и 5 (функция потерь, метод наименьших квадратов).",
  tasks:[
    {t:"num", q:"Прогноз ŷ = 12, правда y = 9. Чему равен промах ŷ − y?", a:3, hint:"Из прогноза вычтите правду.", why:"12 − 9 = 3: модель переоценила на 3."},
    {t:"num", q:"Промах равен −4. Чему равен штраф (квадрат промаха)?", a:16, hint:"Минус на минус даёт плюс.", why:"(−4)² = 16."},
    {t:"num", q:"Прогнозы: 3 и 5. Правда: 1 и 5. Посчитайте MSE.", a:2, hint:"Промахи 2 и 0. Квадраты? Среднее?", why:"Промахи 2 и 0, квадраты 4 и 0, среднее (4 + 0) / 2 = 2."},
    {t:"fit", q:"Пунктир — промахи. Подберите w и b, чтобы ошибка L стала меньше 30.", data:"B", ctrl:["w","b"], init:{w:15,b:-50}, goal:30, resid:true, showLoss:true, hint:"Следите за числом L: двигайте по одной ручке и смотрите, растёт оно или падает.", why:"При w = 10, b = 10 ошибка около 7.", sol:"w = 10, b = 10"},
    {t:"mc", q:"Почему промахи возводят в квадрат, а не просто складывают?", o:["Иначе +5 и −5 дали бы в сумме 0, будто ошибки нет","Так быстрее считать","Чтобы ошибка стала отрицательной","Квадрат нужен для красоты"], a:0, hint:"Подумайте о промахах с разными знаками.", why:"Квадрат делает каждый промах положительным, и они не гасят друг друга."},
    {t:"tf", q:"Если L = 0, модель не ошиблась ни на одном примере.", a:true, hint:"Среднее неотрицательных чисел равно нулю, только если все они нули.", why:"Все квадраты ≥ 0, поэтому их среднее равно 0, только когда каждый промах равен 0."},
    {t:"code", q:"Код считает MSE. Поменяйте w и b, чтобы ошибка стала меньше 20.", srcId:"code-mse", hint:"Продажи растут примерно на 10 за градус. Попробуйте w = 10 и уменьшайте b.", sol:"w, b = 10, 10 — ошибка ≈ 8,3", why:"Чем ближе линия к точкам, тем меньше средний квадрат промаха.",
     check:{out:o => { const m = o.match(/MSE\):\s*([\d.]+)/); return !!m && parseFloat(m[1]) < 20; }, code:c => { const m = c.match(/w\s*,\s*b\s*=\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/); if (!m) return false; const w=+m[1], b=+m[2], xs=[10,15,20,25,30,35], ys=[110,160,215,260,310,365]; return xs.reduce((s,x,i)=>s+(w*x+b-ys[i])**2,0)/6 < 20; }}}
  ]},

{ stage:1, g:"∇", title:"∇ — градиент", short:"Куда двигать ручку, чтобы ошибка уменьшилась",
  intro:[
    "Ошибка зависит от ручек. Если нарисовать, как L меняется при разных w, получится долина: где-то на дне ошибка минимальна.",
    "<b>Градиент</b> — это наклон долины в точке, где мы стоим. Его пишут ∇ («набла») или dL/dw: «как изменится L, если чуть сдвинуть w».",
    "Знак градиента — это направление. Градиент больше нуля: если увеличить w, ошибка вырастет, значит w надо уменьшать. Меньше нуля — наоборот, увеличивать. Равен нулю — мы на дне.",
    "Величина градиента — это крутизна. Чем дальше от дна, тем круче склон и тем больше градиент по модулю."
  ],
  sym:[["dL/dw","градиент: как меняется L, если чуть сдвинуть w","+4"],["знак «+»","склон идёт вверх вправо","уменьшаем w"],["знак «−»","склон идёт вверх влево","увеличиваем w"],["0","на дне долины","ошибка минимальна"]],
  ex:{t:"Ошибка L(w) = (w − 3)²", s:[
    ["w = 5","Стоим справа от дна. L = (5 − 3)² = 4."],
    ["dL/dw = 2·(w − 3) = 4","Градиент положительный: вправо — вверх по склону."],
    ["значит, w ↓","Чтобы ошибка падала, уменьшаем w — идём против градиента."],
    ["w = 3 → dL/dw = 0","На дне склон ровный, двигаться некуда."]]},
  analog:"Вы стоите на склоне в густом тумане и не видите долину. Но ногами чувствуете, куда земля уходит вниз. Градиент — это наклон под ногами: он не показывает всю карту, но говорит, куда шагнуть прямо сейчас.",
  src:"Траск, гл. 4 (градиентный спуск, «горячо-холодно»). Принс, гл. 6 (подбор параметров). 3Blue1Brown, видео про градиентный спуск.",
  tasks:[
    {t:"slope", q:"Кривая — ошибка при разных w. Смотрите на знак градиента и спуститесь на дно (зелёная зона). Два раунда, в каждом не больше 12 шагов.", hint:"Градиент «+» — жмите «уменьшить w». Градиент «−» — «увеличить w».", why:"Вы шли против знака градиента и каждый раз приходили на дно.", sol:"В первом раунде 9 раз «уменьшить w», во втором 7 раз «увеличить w»."},
    {t:"mc", q:"Градиент равен +6. Что делать с w?", o:["Уменьшить w","Увеличить w","Ничего, мы на дне","Сделать w = 6"], a:0, hint:"Плюс значит: вправо ошибка растёт.", why:"Идём против градиента: он положительный, значит w уменьшаем."},
    {t:"num", q:"L(w) = (w − 3)². Градиент: 2·(w − 3). Чему он равен при w = 1?", a:-4, hint:"2 · (1 − 3) = ?", why:"2 · (−2) = −4. Знак минус: w надо увеличивать."},
    {t:"mc", q:"Где градиент ближе всего к нулю?", o:["На дне долины","На самом крутом месте склона","Всегда в начале обучения","Там, где ошибка самая большая"], a:0, hint:"Где склон ровный?", why:"На дне склон горизонтальный, и наклон равен нулю."},
    {t:"tf", q:"Для такой долины чем дальше от дна, тем больше градиент по модулю.", a:true, hint:"Посмотрите на формулу 2·(w − 3).", why:"Градиент растёт вместе с расстоянием до дна: склон всё круче."}
  ]},

    {t:"fill", q:"Допишите правило шага", code:"w = w [[0]] lr [[1]] dw", blanks:["-","*"], pool:["+","/"], hint:"Идём против градиента, а длина шага — lr, умноженная на градиент.", why:"w = w − lr · dw."},
    {t:"tf", q:"Чем больше скорость обучения, тем всегда быстрее и лучше обучение.", a:false, hint:"А если шаг перепрыгнет долину?", why:"Слишком большая η ломает обучение: ошибка начинает расти."}

  intro:[

    "Двух правил хватает почти на всё. <b>Сложение</b> z = x + y: градиент, пришедший к z, достаётся x и y без изменений. <b>Умножение</b> z = x · y: x получает градиент z, умноженный на y («на соседа»), а y — умноженный на x.",
    "Начинают с конца (градиент ошибки по самой себе = 1) и идут назад узел за узлом. Это и есть обратное распространение (backpropagation)."

  sym:[["∂L/∂a","градиент: влияние a на L","6"],["сложение","градиент проходит как есть","−2 → −2 и −2"],["умножение","× на соседа","−2 · (−3) = 6"]],

    ["a получает −2 · b = 6; b получает −2 · a = −4","Проверка: при a = 2,01 выходит L = −7,94, то есть +0,06 = 6 · 0,01."]]},

  src:"Карпатый, лекция «building micrograd» (этот пример с a, b, c, f). Принс, гл. 7 (градиенты и обратное распространение). Траск, гл. 6.",
  tasks:[

    {t:"mc", q:"Зачем идти от конца графа к началу?", o:["Градиент узла строится из градиента следующего за ним, поэтому начинаем с ошибки","Так быстрее читать код","Начало графа неважно","Так придумали случайно"], a:0, hint:"Что нужно знать, чтобы посчитать градиент a?", why:"Каждому узлу нужен градиент «сверху», поэтому идём от L назад."}

{ stage:2, g:"⟲", title:"⟲ — обратный проход в коде", short:"loss.backward(): правило цепочки делает компьютер",
  intro:[

    "Вызов <b>backward()</b> обходит граф от ошибки к началу и в каждом узле применяет правило: для сложения — передать как есть, для умножения — умножить на соседа. Это называют автоматическим дифференцированием.",
    "В PyTorch это одна строка: <b>loss.backward()</b>. После неё у каждой ручки появляется поле <b>.grad</b> — её градиент. Дальше оптимизатор делает шаг.",
    "Важная деталь: градиенты копятся (+=). Поэтому перед новым шагом их обнуляют: <b>optimizer.zero_grad()</b>."
  ],
  sym:[["Value / тензор","число, которое помнит своё происхождение","a = Value(2.0)"],["backward()","обратный проход по графу","L.backward()"],[".grad","градиент ручки после прохода","a.grad = 6.0"],["zero_grad()","стереть старые градиенты","перед каждым шагом"]],
  ex:{t:"Что происходит при L.backward()", s:[

    ["узел умножения: d.grad += f · L.grad","Каждый узел знает свою операцию и раздаёт градиент родителям."],
    ["обход в обратном порядке","Узлы выстраиваются так, чтобы каждый обработался после всех, кто от него зависит."],
    ["a.grad = 6.0","Тот же ответ, что вы посчитали вручную."]]},
  analog:"Бухгалтер хранит все чеки. Чтобы понять, откуда взялась итоговая сумма, он идёт по чекам в обратном порядке. Если не выбросить чеки прошлого месяца (zero_grad), они попадут в новый отчёт.",
  src:"Карпатый, micrograd (класс Value и backward). Траск, гл. 13 (своя мини-библиотека с автоградиентами). Рашка, приложение A (основы PyTorch и autograd).",
  tasks:[
    {t:"code", q:"Запустите код: он считает градиенты сам. Потом поменяйте a на 3.0 и снова нажмите «Проверить». Каким станет градиент b?", srcId:"code-value", hint:"Градиент b = градиент e × a = −2 × a.", sol:"a = Value(3.0) → градиент b: −6.0", why:"b получает градиент −2 × a = −6: умножение берёт соседа.",
     check:{out:o => /градиент b: -6\.0/.test(o), code:c => /=\s*Value\(\s*3(\.0*)?\s*\)\s*,\s*Value\(\s*-3/.test(c)}},
    {t:"mc", q:"Что делает loss.backward()?", o:["Считает градиенты всех ручек, проходя граф от ошибки назад","Делает шаг обучения","Удаляет модель","Запускает модель задом наперёд для генерации"], a:0, hint:"backward — «назад».", why:"Шаг делает оптимизатор, а backward только считает градиенты."},
    {t:"tf", q:"Если не вызывать zero_grad(), градиенты с прошлых шагов сложатся с новыми.", a:true, hint:"В коде градиент копится через +=.", why:"Градиенты накапливаются, поэтому их обнуляют перед каждым шагом."},
    {t:"order", q:"Порядок действий в одном шаге обучения", items:["Прогноз модели","Ошибка loss","loss.backward()","optimizer.step()"], why:"Сначала прогноз и ошибка, потом градиенты, потом шаг."},
    {t:"num", q:"После backward у ручки w: w.grad = 3. Шаг с lr = 0,1, w было 2. Каким станет w?", a:1.7, hint:"w − lr · grad.", why:"2 − 0,1 · 3 = 1,7."}

    "Для этого заводят вторую таблицу — эмбеддинги <b>позиций</b>: свой вектор для 1-го места, 2-го, 3-го и так далее, до длины контекста.",
    "Вектор токена и вектор его позиции просто складывают: <b>вход = E(токен) + P(позиция)</b>. Теперь одно и то же слово на разных местах выглядит для модели по-разному.",
    "Длина контекста <b>ctx</b> — сколько позиций в таблице, то есть сколько токенов модель видит за раз."

  intro:[

    "softmax делает три вещи: возводит e в степень каждой оценки (всё становится положительным), складывает результаты и делит каждый на сумму. Все числа оказываются от 0 до 1 и вместе дают 100%.",
    "Больше оценка — больше вероятность. Важна разница оценок, а не их размер: [1, 1] и [10, 10] дают одинаковые 50 на 50.",
    "softmax работает дважды: на выходе модели (вероятности следующего токена) и внутри внимания (доли внимания)."

    {t:"match", q:"Соедините часть модели и её роль", pairs:[["внимание","общение токенов"],["MLP","размышление каждого токена"],["выходной слой","оценки всех токенов словаря"]], why:"Вместе они превращают текст в вероятности следующего токена."},

const PY = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
let pyPromise = null;
function getPy(){
  if (!pyPromise){
    pyPromise = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = PY + "pyodide.js";
      s.onload = () => loadPyodide({indexURL: PY}).then(async py => { await py.loadPackage("numpy"); res(py); }).catch(rej);
      s.onerror = () => rej(new Error("load"));
      document.head.appendChild(s);
    }).catch(e => { pyPromise = null; throw e; });
  }
  return pyPromise;
}
async function runPy(code){
  let py;
  try { py = await getPy(); } catch(e){ return {loaded:false, out:""}; }
  const lines = [];
  py.setStdout({batched: s => lines.push(s)}); py.setStderr({batched: s => lines.push(s)});
  const g = py.globals.get("dict")();
  try { await py.runPythonAsync(code, {globals: g}); }
  catch(e){ const msg = String(e.message || e).trim().split("\n").filter(Boolean); lines.push("Ошибка: " + msg[msg.length-1]); }
  finally { g.destroy && g.destroy(); }
  return {loaded:true, out: lines.join("\n")};
}

fill(body, t, api){
  const st = api.st, nb = t.blanks.length;
  st.chips = st.chips || shuffle(t.blanks.concat(t.pool).map((s,i) => ({s, i})));
  st.f = st.f || Array(nb).fill(null); if (st.sel == null) st.sel = 0;
  const parts = t.code.split(/\[\[(\d+)\]\]/);
  const render = (bad) => {
    let code = "";
    parts.forEach((p,k) => { if (k % 2 === 0) code += esc(p); else { const b = +p, c = st.f[b]; code += `<button class="blank${st.sel===b?" sel":""}${c!=null?" filled":""}${bad&&bad.includes(b)?" bad":""}" data-b="${b}">${c!=null ? esc(st.chips[c].s) : "&nbsp;&nbsp;?&nbsp;&nbsp;"}</button>`; } });
    body.innerHTML = `<div class="fillcode">${code}</div><div class="ord-pool">${st.chips.map((c,k) => `<button class="chip mono" data-c="${k}" ${st.f.includes(k)?"disabled":""}>${esc(c.s)}</button>`).join("")}</div>
      <p class="legend">Нажмите на пропуск, потом на подходящий кусок кода.</p>`;
    $$(".blank", body).forEach(b => b.onclick = () => { const k = +b.dataset.b; if (st.f[k] != null) st.f[k] = null; st.sel = k; render(); });
    $$(".chip", body).forEach(b => b.onclick = () => {
      st.f[st.sel] = +b.dataset.c;
      const nx = st.f.findIndex(v => v == null); st.sel = nx < 0 ? st.sel : nx; render();
    });
  };
  render();
  api.check(() => {
    if (st.f.some(v => v == null)) return {ok:false, msg:"Заполните все пропуски.", noCount:true};
    const bad = st.f.map((c,k) => st.chips[c].s === t.blanks[k] ? -1 : k).filter(k => k >= 0);
    render(bad);
    return {ok: bad.length === 0, msg: bad.length ? "Красным — неверный пропуск. " + (t.hint || "") : ""};
  });
},
code(body, t, api){
  const src = t.src || document.getElementById(t.srcId).textContent.replace(/^\n/, "");
  const wrap = document.createElement("div"); body.appendChild(wrap);
  editor(wrap, src, api.st, "Python · можно править");
  body.insertAdjacentHTML("beforeend", `<div class="row"><button class="btn ghost" id="run">▶ Запустить</button><span class="legend">«Проверить» тоже запускает код</span></div><pre class="out" hidden></pre>`);
  const out = $(".out", body), run = $("#run", body);
  if (api.st.out){ out.hidden = false; out.textContent = api.st.out; }
  const exec = async () => {
    out.hidden = false; out.textContent = pyPromise ? "Запускаю…" : "Загружаю Python в браузер (один раз, около 10 МБ)…";
    const r = await runPy(api.st.code);
    out.textContent = api.st.out = r.loaded ? (r.out || "(код выполнился, но ничего не напечатал)") : "Python не загрузился в этом окне. Код можно запустить в Google Colab.";
    return r;
  };
  run.onclick = async () => { run.disabled = true; await exec(); run.disabled = false; };
  api.check(async () => {
    if (t.check.out){
      const r = await exec();
      if (r.loaded) return {ok: t.check.out(r.out), msg: "Результат пока не тот. " + (t.hint || "")};
      if (t.check.code) return {ok: t.check.code(api.st.code), msg: "Python не загрузился, проверил по тексту кода. " + (t.hint || "")};
      return {ok:false, msg:"Python не загрузился.", noCount:true};
    }
    return {ok: t.check.code(api.st.code), msg: t.hint};
  });
},

fit(body, t, api){
  const st = api.st, data = DS[t.data];
  if (st.w == null){ st.w = t.init.w; st.b = t.init.b; }
  const has = k => t.ctrl.includes(k);
  body.innerHTML = `<canvas class="plot"></canvas>
    <div class="formula">ŷ = <b class="${has("w")?"":"fixed"}" id="fw"></b> · x + <b class="${has("b")?"":"fixed"}" id="fb"></b></div>
    ${has("w") ? slider("sw","w — наклон",0,20,0.5,st.w) : ""}${has("b") ? slider("sb","b — сдвиг",-100,250,5,st.b) : ""}
    <div class="meter"><span>${t.showLoss ? "Ошибка L (MSE)" : "Насколько близко"}</span><b id="ml"></b></div>`;
  const cv = $("canvas", body);
  const upd = () => {
    if (has("w")) st.w = +$("#sw", body).value; if (has("b")) st.b = +$("#sb", body).value;
    $("#fw", body).textContent = fmt(st.w); $("#fb", body).textContent = fmt(st.b);
    if (has("w")) $("#sw-o", body).textContent = fmt(st.w); if (has("b")) $("#sb-o", body).textContent = fmt(st.b);
    const L = mseOf(data, st.w, st.b);
    $("#ml", body).textContent = t.showLoss ? fmt(L, 1) : (L > 3000 ? "далеко" : L > 600 ? "ближе" : L >= t.goal ? "почти" : "в точку");
    $("#ml", body).className = L < t.goal ? "good" : "";
    const A = axes(cv, {xr:[0,40], yr:[0,450], xt:10, yt:100, xu:"°", xlab:"температура, x", ylab:"порций, y", h:api.plotH()});
    const {ctx, sx, sy} = A; A.clip();
    if (t.resid){ ctx.strokeStyle = cssv("--accent"); ctx.setLineDash([3,3]); ctx.lineWidth = 1.5; data.forEach(([x,y]) => { ctx.beginPath(); ctx.moveTo(sx(x), sy(y)); ctx.lineTo(sx(x), sy(st.w*x+st.b)); ctx.stroke(); }); ctx.setLineDash([]); }
    ctx.strokeStyle = cssv("--cool"); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(sx(0), sy(st.b)); ctx.lineTo(sx(40), sy(st.w*40+st.b)); ctx.stroke();
    A.unclip();
    data.forEach(([x,y]) => dot(ctx, sx(x), sy(y), 5, cssv("--accent")));
  };
  $$("input", body).forEach(i => i.oninput = upd); upd();
  api.check(() => { const L = mseOf(data, st.w, st.b); return {ok: L < t.goal, msg: t.showLoss ? `Ошибка ${fmt(L,1)}, а нужно меньше ${t.goal}. ${t.hint}` : `Линия ещё не легла на точки. ${t.hint}`}; });
},

slope(body, t, api){
  const st = api.st, ROUNDS = [6.5, -1.5], MAX = 12, Lf = w => (w-2)**2;
  if (st.r == null){ st.r = 0; st.w = ROUNDS[0]; st.m = 0; }
  body.innerHTML = `<canvas class="plot"></canvas>
    <div class="stats"><span>раунд <b id="rd"></b> из 2</span><span>шагов: <b id="mv"></b> / ${MAX}</span><span>w = <b id="wv"></b></span><span>градиент: <b id="gv"></b></span></div>
    <div class="row two"><button class="btn ghost" id="dl">← уменьшить w</button><button class="btn ghost" id="dr">увеличить w →</button></div><div class="status" id="ss"></div>`;
  const cv = $("canvas", body);
  const draw = () => {
    const g = 2*(st.w-2);
    $("#rd", body).textContent = st.r+1; $("#mv", body).textContent = st.m; $("#wv", body).textContent = fmt(st.w,2);
    $("#gv", body).innerHTML = `<span class="${g>0?"pos":g<0?"neg":""}">${g>0?"+":""}${fmt(g,2)}</span>`;
    const A = axes(cv, {xr:[-3,7], yr:[0,26], xt:1, yt:5, xlab:"w", ylab:"ошибка L", h:api.plotH()});
    const {ctx, sx, sy} = A;
    ctx.fillStyle = cssv("--good"); ctx.globalAlpha = 0.18; ctx.fillRect(sx(1.75), sy(26), sx(2.25)-sx(1.75), sy(0)-sy(26)); ctx.globalAlpha = 1;
    A.clip(); ctx.strokeStyle = cssv("--cool"); ctx.lineWidth = 2.5; ctx.beginPath(); for (let w=-3; w<=7.001; w+=0.05){ const x = sx(w), y = sy(Lf(w)); w===-3 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); } ctx.stroke();
    ctx.strokeStyle = cssv("--accent"); ctx.lineWidth = 1.5; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(sx(st.w-1.2), sy(Lf(st.w)-1.2*g)); ctx.lineTo(sx(st.w+1.2), sy(Lf(st.w)+1.2*g)); ctx.stroke(); ctx.setLineDash([]); A.unclip();
    dot(ctx, sx(st.w), sy(Lf(st.w)), 7, cssv("--accent"));
  };
  const move = d => {
    const before = Lf(st.w); st.w += d*0.5; st.m++;
    const ss = $("#ss", body);
    if (Math.abs(st.w-2) < 0.26){
      if (st.r === ROUNDS.length-1){ ss.className = "status good"; ss.textContent = "Дно найдено в обоих раундах!"; draw(); $$("#dl,#dr", body).forEach(b => b.disabled = true); api.answer(true); return; }
      st.r++; st.w = ROUNDS[st.r]; st.m = 0; ss.className = "status good"; ss.textContent = "Раунд 1 пройден! Теперь стартуем с другой стороны.";
    } else if (st.m >= MAX){ st.w = ROUNDS[st.r]; st.m = 0; ss.className = "status bad"; ss.textContent = "Шаги закончились — раунд заново."; api.answer(false, "Больше 12 шагов. Смотрите на знак градиента: «+» — уменьшать w, «−» — увеличивать."); }
    else { ss.className = Lf(st.w) > before ? "status bad" : "status"; ss.textContent = Lf(st.w) > before ? "Ошибка выросла: это был шаг вверх по склону." : "Ошибка уменьшилась."; }
    draw();
  };
  $("#dl", body).onclick = () => move(-1); $("#dr", body).onclick = () => move(1);
  draw();
},
lrrun(body, t, api){
  const st = api.st, E = [0.01,0.05,0.1,0.2,0.3,0.5,0.8,0.95,1.05,1.2];
  if (st.ei == null){ st.ei = 0; st.path = null; }
  body.innerHTML = `<canvas class="plot"></canvas>${slider("se","η — шаг",0,E.length-1,1,st.ei)}
    <div class="formula">w ← w − <b id="fe"></b> · 2·(w − 3)</div>
    <div class="row"><button class="btn ghost" id="go">▶ Запустить 10 шагов</button></div><div class="status" id="ss"></div>`;
  const cv = $("canvas", body), Lf = w => (w-3)**2;
  const draw = (n) => {
    $("#se-o", body).textContent = fmt(E[st.ei],2); $("#fe", body).textContent = fmt(E[st.ei],2);
    const A = axes(cv, {xr:[-3,9], yr:[0,40], xt:1, yt:10, xlab:"w", ylab:"ошибка L", h:api.plotH()});
    const {ctx, sx, sy} = A;
    A.clip(); ctx.strokeStyle = cssv("--cool"); ctx.lineWidth = 2.5; ctx.beginPath(); for (let w=-3; w<=9.001; w+=0.05){ const x = sx(w), y = sy(Lf(w)); w===-3 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); } ctx.stroke();
    if (st.path){ const P = st.path.slice(0, n ?? st.path.length); ctx.strokeStyle = cssv("--accent"); ctx.lineWidth = 1.5; ctx.beginPath(); P.forEach((w,i) => { const x = sx(Math.max(-3.5, Math.min(9.5, w))), y = sy(Math.min(45, Lf(w))); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }); ctx.stroke(); P.forEach((w,i) => dot(ctx, sx(Math.max(-3.5, Math.min(9.5, w))), sy(Math.min(45, Lf(w))), i === P.length-1 ? 6 : 3.5, cssv("--accent"))); }
    A.unclip();
  };
  $("#se", body).oninput = e => { st.ei = +e.target.value; st.path = null; $("#ss", body).textContent = ""; draw(); };
  $("#go", body).onclick = () => {
    const eta = E[st.ei]; let w = 8; st.path = [w];
    for (let k=0; k<10; k++){ w = w - eta*2*(w-3); st.path.push(w); }
    st.final = w; let n = 1; const tok = api.tok(), btn = $("#go", body); btn.disabled = true;
    const iv = setInterval(() => {
      if (!api.alive(tok)){ clearInterval(iv); return; }
      n++; draw(n);
      if (n >= st.path.length){ clearInterval(iv); btn.disabled = false; const ss = $("#ss", body), d = Math.abs(w-3);
        if (d > 5){ ss.className = "status bad"; ss.textContent = "Улетели: шаг слишком длинный, каждый прыжок дальше от дна."; }
        else if (d >= 0.1){ ss.className = "status"; ss.textContent = `Не дошли до дна: w = ${fmt(w,2)}. ` + (eta < 0.2 ? "Шаг слишком мелкий." : "Раскачиваемся вокруг дна — шаг великоват."); }
        else { ss.className = "status good"; ss.textContent = `Дошли: w = ${fmt(w,3)}. Нажмите «Проверить».`; } }
    }, 140);
  };
  draw();
  api.check(() => st.path ? {ok: Math.abs(st.final-3) < 0.1, msg:"За 10 шагов дно не достигнуто. " + t.hint} : {ok:false, msg:"Сначала нажмите «Запустить 10 шагов».", noCount:true});
},
gd(body, t, api){
  const st = api.st, XN = DS_B.map(([x]) => (x-22)/10), YN = DS_B.map(([,y]) => y/100), LRS = [0.01,0.03,0.1,0.3,0.6,0.9,1.05,1.2];
  if (st.wn == null){ st.wn = 0; st.bn = 0; st.li = 2; st.steps = 0; st.hist = []; }
  const lossN = () => XN.reduce((s,x,i) => s + (st.wn*x+st.bn-YN[i])**2, 0)/XN.length*10000;
  body.innerHTML = `<canvas class="plot"></canvas>${slider("lr","η — скорость",0,LRS.length-1,1,st.li)}
    <div class="row"><button class="btn ghost" id="s1">Шаг</button><button class="btn ghost" id="au">▶ Авто</button><button class="btn ghost" id="rs">Сброс</button></div>
    <div class="stats"><span>шагов: <b id="ns"></b></span><span>w = <b id="wv"></b></span><span>b = <b id="bv"></b></span><span>ошибка: <b id="ls"></b></span></div>
    <canvas class="plot" id="lc"></canvas><div class="status" id="ss"></div>`;
  const cv = $("canvas", body);
  let timer = null; const tok = api.tok();
  const draw = () => {
    const L = lossN(), w = 10*st.wn, b = 100*(st.bn - 2.2*st.wn);
    $("#ns", body).textContent = st.steps; $("#wv", body).textContent = isFinite(w) ? fmt(w,1) : "∞"; $("#bv", body).textContent = isFinite(b) ? fmt(b,0) : "∞";
    $("#ls", body).textContent = !isFinite(L) || L > 1e6 ? "огромная" : fmt(L,1); $("#lr-o", body).textContent = LRS[st.li];
    const A = axes(cv, {xr:[0,40], yr:[0,450], xt:10, yt:100, xu:"°", xlab:"температура, x", ylab:"порций, y", h:api.plotH()});
    const {ctx, sx, sy} = A; A.clip(); ctx.strokeStyle = cssv("--cool"); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(sx(0), sy(b)); ctx.lineTo(sx(40), sy(w*40+b)); ctx.stroke(); A.unclip();
    DS_B.forEach(([x,y]) => dot(ctx, sx(x), sy(y), 5, cssv("--accent")));
    drawLoss($("#lc", body), st.hist);
    const ss = $("#ss", body);
    if (!isFinite(L) || L > 1e6){ ss.className = "status bad"; ss.textContent = "Шаг слишком длинный: ошибка растёт. Уменьшите скорость и нажмите «Сброс»."; }
    else if (L < 30){ ss.className = "status good"; ss.textContent = "Ошибка меньше 30. Нажмите «Проверить»."; }
    else { ss.className = "status"; ss.textContent = st.steps ? "" : "Нажмите «Шаг» несколько раз или «Авто»."; }
  };
  const step = () => { let dw = 0, db = 0; XN.forEach((x,i) => { const e = st.wn*x+st.bn-YN[i]; dw += 2*e*x/XN.length; db += 2*e/XN.length; }); st.wn -= LRS[st.li]*dw; st.bn -= LRS[st.li]*db; st.steps++; st.hist.push(lossN()); };
  const stopA = () => { if (timer){ clearInterval(timer); timer = null; const b = $("#au", body); if (b) b.textContent = "▶ Авто"; } };
  $("#lr", body).oninput = e => { st.li = +e.target.value; draw(); };
  $("#s1", body).onclick = () => { step(); draw(); };
  $("#au", body).onclick = () => { if (timer) return stopA(); $("#au", body).textContent = "❚❚ Пауза";
    timer = setInterval(() => { if (!api.alive(tok)){ clearInterval(timer); return; } step(); draw(); const L = st.hist[st.hist.length-1]; if (st.steps >= 300 || !isFinite(L) || L > 1e9 || L < 8) stopA(); }, 90); };
  $("#rs", body).onclick = () => { stopA(); st.wn = 0; st.bn = 0; st.steps = 0; st.hist = []; draw(); };
  draw();
  api.check(() => { const L = lossN(); return {ok: isFinite(L) && L < 30, msg:`Ошибка пока ${isFinite(L) && L < 1e6 ? fmt(L,1) : "огромная"}. ${t.hint}`}; });
},
relu(body, t, api){
  const st = api.st; if (st.w == null){ st.w = 0.5; st.b = 1; }
  body.innerHTML = `<canvas class="plot"></canvas><div class="formula">y = ReLU(<b id="fw"></b>·x + <b id="fb"></b>)<span class="muted" id="fk"></span></div>
    ${slider("sw","w — вес",-2,2,0.5,st.w)}${slider("sb","b — сдвиг",-4,4,0.5,st.b)}`;
  const cv = $("canvas", body);
  const upd = () => {
    st.w = +$("#sw", body).value; st.b = +$("#sb", body).value;
    $("#fw", body).textContent = fmt(st.w); $("#fb", body).textContent = fmt(st.b); $("#sw-o", body).textContent = fmt(st.w); $("#sb-o", body).textContent = fmt(st.b);

    const blocks = 12*st.L*d*d, emb = st.V*d, n = blocks + emb; st.n = n;
    const f = v => v < 1e6 ? fmt(v/1e3,0) + " тыс." : v < 1e9 ? fmt(v/1e6, v<1e7?1:0) + " млн" : fmt(v/1e9,2) + " млрд";
    $("#pc", body).textContent = f(n); $("#pc", body).className = n >= 1e8 && n <= 1.5e8 ? "good" : "";
    $("#fx", body).textContent = `12·${st.L}·${d}² = ${f(blocks)}  +  ${fmt(st.V,0)}·${d} = ${f(emb)}`;
    $$("#vs button", body).forEach(b => b.classList.toggle("on", +b.dataset.v === st.V)); };
  $("#nl", body).oninput = upd; $("#nd", body).oninput = upd;
  $$("#vs button", body).forEach(b => b.onclick = () => { st.V = +b.dataset.v; upd(); });
  $$("#pr button", body).forEach(b => b.onclick = () => { const [l,di,v] = b.dataset.p.split(",").map(Number); $("#nl", body).value = l; $("#nd", body).value = di; st.V = v; upd(); });
  upd();
  api.check(() => st.V !== 50257 ? {ok:false, msg:"Выберите словарь из частей слов (~50 000)."} : {ok: st.n >= 1e8 && st.n <= 1.5e8, msg:`Нужно от 100 до 150 млн. ${t.hint}`});
},
train(body, t, api){
  const st = api.st, B = bigram(), chars = B.chars, ix = B.ix, V = chars.length;
  const init = K => { st.K = K; st.Wt = new Float32Array(Math.pow(V,K)*V); st.steps = 0; st.hist = []; st.samples = []; st.run = false; st.pairs = [];
    NAMES.forEach(n => { const s = ".".repeat(K) + n + "."; for (let i=K; i<s.length; i++){ let r = 0; for (let j=i-K; j<i; j++) r = r*V + ix[s[j]]; st.pairs.push([r, ix[s[i]]]); } }); st.hist.push(evalL()); };
  const soft = r => { const o = r*V, p = new Float64Array(V); let mx = -1e9; for (let j=0;j<V;j++) mx = Math.max(mx, st.Wt[o+j]); let s = 0; for (let j=0;j<V;j++){ p[j] = Math.exp(st.Wt[o+j]-mx); s += p[j]; } for (let j=0;j<V;j++) p[j] /= s; return p; };
  const evalL = () => { let L = 0; for (const [r,tt] of st.pairs) L -= Math.log(soft(r)[tt] + 1e-12); return L/st.pairs.length; };
  const stepOnce = () => { for (let b=0; b<32; b++){ const [r,tt] = st.pairs[(Math.random()*st.pairs.length)|0], p = soft(r), o = r*V; for (let j=0; j<V; j++) st.Wt[o+j] -= 0.5*(p[j] - (j===tt?1:0)); } st.steps++; };
  const gen = () => { const out = []; for (let n=0; n<8; n++){ let c = new Array(st.K).fill(0), s = ""; for (let k=0; k<14; k++){ let r = 0; for (const x of c) r = r*V + x; const nx = B.sample(soft(r)); if (nx === 0) break; s += chars[nx]; c = c.slice(1).concat(nx); } out.push(s); } return out; };
  if (!st.Wt) init(1);
  body.innerHTML = `<div class="row"><span class="legend">Контекст:</span><div class="seg" id="kk">${[1,2,3].map(k => `<button data-k="${k}">${k} ${plural(k,"буква","буквы","букв")}</button>`).join("")}</div></div>
    <div class="row"><button class="btn ghost" id="go">▶ Обучать</button><button class="btn ghost" id="rs">Сначала</button></div>
    <div class="stats"><span>шагов: <b id="ns"></b></span><span>ошибка: <b id="ls"></b></span><span>параметров: <b id="pc"></b></span></div>
    <canvas class="plot" id="lc"></canvas><div class="names" id="nm"></div><div class="status" id="ss"></div>
    <p class="legend">Зелёным — новые имена, серым — заученные из обучающего списка.</p>`;
  const tok = api.tok();
  const draw = () => { const L = st.hist[st.hist.length-1]; $("#ns", body).textContent = st.steps; $("#ls", body).textContent = fmt(L,3); $("#ls", body).className = L < 1.9 ? "good" : "";
    $("#pc", body).textContent = fmt(Math.pow(V,st.K)*V,0); drawLoss($("#lc", body), st.hist, true);
    $("#nm", body).innerHTML = st.samples.map(s => `<span class="nm-chip ${NAMESET.has(s)?"copy":"new"}">${esc(s||"—")}</span>`).join("");
    $$("#kk button", body).forEach(b => b.classList.toggle("on", +b.dataset.k === st.K));
    const ss = $("#ss", body);
    if (L < 1.9){ ss.className = "status good"; ss.textContent = "Ошибка ниже 1,9. Нажмите «Проверить»."; }
    else if (st.steps >= 1500){ ss.className = "status bad"; ss.textContent = "Обучение закончилось, а ошибка не опустилась. С одной буквой контекста модель упирается в ≈ 2,1."; }
    else { ss.className = "status"; ss.textContent = st.steps ? "" : "Нажмите «Обучать». Сначала модель выдаёт мешанину букв."; } };
  const loop = () => { if (!st.run || !api.alive(tok)) return; for (let k=0; k<10; k++) stepOnce(); if (st.steps % 30 === 0 || st.steps >= 1500) st.hist.push(evalL()); if (st.steps % 100 === 0 || st.steps >= 1500) st.samples = gen(); draw();
    if (st.steps >= 1500){ st.run = false; $("#go", body).textContent = "▶ Обучать"; return; } requestAnimationFrame(loop); };
  $$("#kk button", body).forEach(b => b.onclick = () => { init(+b.dataset.k); st.samples = gen(); $("#go", body).textContent = "▶ Обучать"; draw(); });
  $("#go", body).onclick = () => { if (st.steps >= 1500) return; st.run = !st.run; $("#go", body).textContent = st.run ? "❚❚ Пауза" : "▶ Обучать"; if (st.run) loop(); };
  $("#rs", body).onclick = () => { init(st.K); st.samples = gen(); $("#go", body).textContent = "▶ Обучать"; draw(); };
  if (!st.samples.length) st.samples = gen();
  draw(); if (st.run){ $("#go", body).textContent = "❚❚ Пауза"; loop(); }
  api.check(() => ({ok: st.hist[st.hist.length-1] < 1.9, msg:`Ошибка сейчас ${fmt(st.hist[st.hist.length-1],2)}. ${t.hint}`}));
}
};
let _bigram = null;
function bigram(){
  if (_bigram) return _bigram;
  const chars = ["."].concat([...new Set(NAMES.join(""))].sort((a,b) => a.localeCompare(b,"ru")));
  const ix = Object.fromEntries(chars.map((c,i) => [c,i])), V = chars.length;
  const C = Array.from({length:V}, () => new Float64Array(V).fill(0.05));
  NAMES.forEach(n => { const s = "."+n+"."; for (let i=0; i<s.length-1; i++) C[ix[s[i]]][ix[s[i+1]]]++; });
  const probs = (row, T) => { const p = C[row].map(c => Math.pow(c, 1/T)); const s = p.reduce((a,b) => a+b, 0); return p.map(x => x/s); };
  const sample = p => { let u = Math.random(), j = 0; for (; j<p.length-1; j++){ u -= p[j]; if (u <= 0) break; } return j; };
  return (_bigram = {chars, ix, probs, sample});
}

/* ================= Старт ================= */
function start(data){
  const old = loadLS(OLDKEY);
  S = Object.assign(defaults(), loadLS(KEY) || {xp: old && old.xp || 0}, (data && data.S) || {});
  if (data && data.LV) LV = data.LV;
  if (!location.hash) { try { history.replaceState(null, "", "#home"); } catch(e){} }
  route();
}
window.claude?.hot?.snapshot?.(() => ({S, LV}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
